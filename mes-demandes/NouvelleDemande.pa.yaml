Screens:
  NouvelleDemande:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varTriedSubmitND, false);
        Set(varSubmitting, false);
        Set(varIAPanelOpen, false);
        Set(varIALoading, false);
        Set(varIAErreurSaisie, false);
        Set(varIAErreurAppel, "");
        Set(varIAResultat, Blank());
        Set(varIAConfirmerEcrasement, false);
        Set(varIAAppliedType, Blank());
        Set(varIAAppliedService, Blank());
        Reset(InpNDTitre);
        Reset(DdNDType);
        Reset(DdNDService);
        Reset(RadNDUrgence);
        Reset(InpNDDescription);
        Reset(DpNDDeadline);
        Reset(DdNDDeadlineHeure);
        Reset(InpIATexteRequete)
    Children:
      - NDScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - NDHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - NDBackRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                      Children:
                        - IconNDBack:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour vers Mes demandes"
                              Height: =28
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                              Width: =28
                        - TxtNDBack:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                              Size: =14
                              Text: ="Retour"
                  - TxtNDTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =24
                        Text: ="Nouvelle demande"
                        Width: =Parent.Width - 56
                  - RectNDAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - NDBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - FormCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =898 + If(Coalesce(DdNDType.Selected.Deadline_Obligatoire, false), 98, 0)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Min(Parent.Width - 56, 680)
                      Children:
                        - SectionDemandeHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                            Children:
                              - RectSectionDemandeSep:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(229, 231, 235, 1)
                                    Height: =1
                              - SectionDemandeTitleRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                  Children:
                                    - TxtSectionDemande:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          AutoHeight: =true
                                          Color: =RGBA(140, 12, 20, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Size: =12
                                          Text: ="Demande"
                                    - BtnNDAssistantIA:
                                        Control: ModernButton
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Transparent
                                          BasePaletteColor: =RGBA(140, 12, 20, 1)
                                          Height: =28
                                          Icon: ="Sparkle"
                                          OnSelect: |-
                                            =Set(varIAPanelOpen, true);
                                            Set(varIALoading, false);
                                            Set(varIAErreurSaisie, false);
                                            Set(varIAErreurAppel, "");
                                            Set(varIAResultat, Blank());
                                            Set(varIAConfirmerEcrasement, false);
                                            Reset(InpIATexteRequete)
                                          Text: ="Assistant IA"
                                          Width: =130
                        - BlockTitre:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                            Children:
                              - LblRowNDTitre:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =18
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =2
                                  Children:
                                    - TxtLblNDTitre:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(140, 12, 20, 1)
                                          Size: =13
                                          Text: ="Titre de la demande"
                                    - TxtReqNDTitre:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(220, 38, 38, 1)
                                          Size: =13
                                          Text: ="*"
                              - InpNDTitre:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Titre de la demande (obligatoire)"
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    Height: =40
                                    Placeholder: |-
                                      ="Ex : Demande de validation d'avenant"
                                    ValidationState: =If(varTriedSubmitND && IsBlank(Trim(Self.Text)), ValidationState.Error, ValidationState.None)
                              - TxtErrNDTitre:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(220, 38, 38, 1)
                                    Size: =12
                                    Text: ="Le titre est obligatoire."
                                    Visible: =varTriedSubmitND && IsBlank(Trim(InpNDTitre.Text))
                        - BlockType:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                            Children:
                              - LblRowNDType:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =18
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =2
                                  Children:
                                    - TxtLblNDType:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(140, 12, 20, 1)
                                          Size: =13
                                          Text: ="Type de demande"
                                    - TxtReqNDType:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(220, 38, 38, 1)
                                          Size: =13
                                          Text: ="*"
                              - DdNDType:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Type de demande (obligatoire)"
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    Default: =varIAAppliedType
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Titre
                                    Items: =SortByColumns(Types_Demandes, "Title", SortOrder.Ascending)
                                    OnChange: =Reset(DdNDService)
                                    ValidationState: =If(varTriedSubmitND && IsBlank(Self.Selected.ID), ValidationState.Error, ValidationState.None)
                              - TxtErrNDType:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(220, 38, 38, 1)
                                    Size: =12
                                    Text: ="Sélectionnez un type de demande."
                                    Visible: =varTriedSubmitND && IsBlank(DdNDType.Selected.ID)
                        - BlockService:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                            Children:
                              - LblRowNDService:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =18
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =2
                                  Children:
                                    - TxtLblNDService:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(140, 12, 20, 1)
                                          Size: =13
                                          Text: ="Service destinataire"
                                    - TxtReqNDService:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(220, 38, 38, 1)
                                          Size: =13
                                          Text: ="*"
                              - DdNDService:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Service destinataire (obligatoire)"
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    Default: |-
                                      =Coalesce(
                                          varIAAppliedService,
                                          If(
                                              CountRows(DdNDType.Selected.Service_Par_Defaut) > 0,
                                              LookUp(Services_Siege, ID = First(DdNDType.Selected.Service_Par_Defaut).Id),
                                              Blank()
                                          )
                                      )
                                    Height: =40
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =SortByColumns(Services_Siege, "Title", SortOrder.Ascending)
                                    ValidationState: =If(varTriedSubmitND && IsBlank(Self.Selected.ID), ValidationState.Error, ValidationState.None)
                              - TxtErrNDService:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(220, 38, 38, 1)
                                    Size: =12
                                    Text: ="Sélectionnez un service destinataire."
                                    Visible: =varTriedSubmitND && IsBlank(DdNDService.Selected.ID)
                        - BlockDeadline:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              Visible: =Coalesce(DdNDType.Selected.Deadline_Obligatoire, false)
                            Children:
                              - LblRowNDDeadline:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =18
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =2
                                  Children:
                                    - TxtLblNDDeadline:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(140, 12, 20, 1)
                                          Size: =13
                                          Text: ="Date limite demandée"
                                    - TxtReqNDDeadline:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(220, 38, 38, 1)
                                          Size: =13
                                          Text: ="*"
                              - NDDeadlineInputsRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                  Children:
                                    - DpNDDeadline:
                                        Control: ModernDatePicker
                                        Properties:
                                          AccessibleLabel: ="Date limite demandée (obligatoire)"
                                          FillPortions: =1
                                          Height: =40
                                    - DdNDDeadlineHeure:
                                        Control: ModernDropdown
                                        Properties:
                                          AccessibleLabel: ="Heure limite (obligatoire)"
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          Height: =40
                                          ItemDisplayText: =Text(ThisItem.Value, "00") & ":00"
                                          Items: =Sequence(24, 0)
                                          Width: =120
                              - TxtErrNDDeadline:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(220, 38, 38, 1)
                                    Size: =12
                                    Text: ="Veuillez renseigner la date limite souhaitée."
                                    Visible: =varTriedSubmitND && Coalesce(DdNDType.Selected.Deadline_Obligatoire, false) && (IsBlank(DpNDDeadline.SelectedDate) || IsBlank(DdNDDeadlineHeure.Selected.Value))
                        - BlockDescription:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =142
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                            Children:
                              - TxtLblNDDescription:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    Size: =13
                                    Text: ="Description"
                              - InpNDDescription:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Description de la demande (optionnel)"
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    Height: =120
                                    Placeholder: ="Décrivez votre demande en détail (contexte, urgence, éléments importants...)"
                                    Type: =TextInputType.Multiline
                        - BlockUrgence:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =172
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                            Children:
                              - TxtLblNDUrgence:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    Size: =13
                                    Text: ="Niveau d'urgence"
                              - RadNDUrgence:
                                  Control: ModernRadio
                                  Properties:
                                    AccessibleLabel: ="Niveau d'urgence"
                                    Default: |-
                                      ={Value: "Normal"}
                                    Height: =150
                                    Items: =["Faible", "Normal", "Urgent", "Critique"]
                        - SectionDocumentsHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =26
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                            Children:
                              - TxtSectionDocuments:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Documents"
                              - RectSectionDocumentsSep:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(229, 231, 235, 1)
                                    Height: =1
                        - BlockDocuments:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =58
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                            Children:
                              - TxtLblNDDocuments:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    Size: =13
                                    Text: ="Pièces jointes (optionnel)"
                              - TxtNoteNDDocuments:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(144, 144, 144, 1)
                                    Size: =12
                                    Text: ="Vous pourrez ajouter des pièces jointes après la création de la demande, depuis la page de détail."
                                    Width: =Parent.Width
                        - NDButtonsRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                            Children:
                              - BtnNDAnnuler:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(140, 12, 20, 1)
                                    Height: =40
                                    OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                                    Text: ="Annuler"
                                    Width: =140
                              - BtnNDSoumettre:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(140, 12, 20, 1)
                                    DisplayMode: =If(varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =40
                                    Icon: ="Checkmark"
                                    OnSelect: |-
                                      =Set(varTriedSubmitND, true);
                                      If(
                                          Not(IsBlank(Trim(InpNDTitre.Text)))
                                              && Not(IsBlank(DdNDType.Selected.ID))
                                              && Not(IsBlank(DdNDService.Selected.ID))
                                              && (Not(Coalesce(DdNDType.Selected.Deadline_Obligatoire, false))
                                                  || (Not(IsBlank(DpNDDeadline.SelectedDate)) && Not(IsBlank(DdNDDeadlineHeure.Selected.Value)))),
                                          Set(varSubmitting, true);
                                          IfError(
                                              With(
                                                  {
                                                      _newDemande: Patch(
                                                          Demandes,
                                                          Defaults(Demandes),
                                                          {
                                                              Titre: Trim(InpNDTitre.Text),
                                                              Type_Demande_ID: {Id: DdNDType.Selected.ID, Value: DdNDType.Selected.Titre},
                                                              Service_Actuel_ID: {Id: DdNDService.Selected.ID, Value: DdNDService.Selected.Title},
                                                              Description: InpNDDescription.Text,
                                                              Niveau_Urgence: {Value: RadNDUrgence.Selected.Value},
                                                              Agent_Demandeur: {
                                                                  Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                  DisplayName: User().FullName,
                                                                  Email: User().Email,
                                                                  Department: "",
                                                                  JobTitle: "",
                                                                  Picture: ""
                                                              },
                                                              Statut_Actuel: {Value: "Soumis"},
                                                              Date_Soumission: Now(),
                                                              Num_Mouvement_Cours: 1,
                                                              Alerte_Retard_Active: false,
                                                              Deadline_Metier: If(Coalesce(DdNDType.Selected.Deadline_Obligatoire, false), DateAdd(DpNDDeadline.SelectedDate, DdNDDeadlineHeure.Selected.Value, TimeUnit.Hours), Blank()),
                                                              Deadline_Metier_Active: Coalesce(DdNDType.Selected.Deadline_Obligatoire, false),
                                                              Statut_Deadline: If(Coalesce(DdNDType.Selected.Deadline_Obligatoire, false), {Value: "Normale"}, Blank()),
                                                              Alerte_Deadline_Envoyee: false
                                                          }
                                                      )
                                                  },
                                                  Patch(Temps_Parcours_Demande, Defaults(Temps_Parcours_Demande), {
                                                      Title: Trim(InpNDTitre.Text) & " - M1",
                                                      Demande_ID: Text(_newDemande.ID),
                                                      Num_Mouvement: 1,
                                                      Type_Etape: {Value: "Attente"},
                                                      Service: DdNDService.Selected.Title,
                                                      Date_Debut: Now(),
                                                      Statut: "Soumis",
                                                      Actionneur: {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(User().Email), DisplayName: User().FullName, Email: User().Email, Department: "", JobTitle: "", Picture: ""},
                                                      Commentaire: ""
                                                  })
                                              ),
                                              Set(varSubmitting, false);
                                              Notify("Échec de la soumission : " & FirstError.Message, NotificationType.Error),
                                              Set(varSubmitting, false);
                                              Notify("Votre demande a été soumise avec succès.", NotificationType.Success);
                                              Navigate(MesDemandes, ScreenTransition.Fade)
                                          )
                                      )
                                    Text: ="Soumettre"
                                    Width: =160
      - IAOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =Coalesce(varIAPanelOpen, false)
            Width: =Parent.Width
          Children:
            - RectIAScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varIAPanelOpen, false)
                  Width: =Parent.Width
            - IACard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =620
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(NouvelleDemande.Size = ScreenSize.Small, Parent.Width - 40, 480)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtIATitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: ="Assistant IA"
                  - TxtIABanner:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =12
                        Text: ="L’Assistant IA propose automatiquement les informations ci-dessous. Une validation humaine reste nécessaire avant l’enregistrement"
                        Width: =Parent.Width
                  - TxtIALblTexte:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        Size: =12
                        Text: ="Texte à analyser"
                  - InpIATexteRequete:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Texte à analyser par l’assistant IA"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =InpNDDescription.Text
                        Height: =80
                        Placeholder: ="Décrivez la demande à analyser..."
                        Type: =TextInputType.Multiline
                  - TxtIAErreurSaisie:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        Size: =12
                        Text: ="Veuillez décrire votre demande avant de lancer l’analyse."
                        Visible: =varIAErreurSaisie
                  - BtnIALancer:
                      Control: ModernButton
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(140, 12, 20, 1)
                        DisplayMode: =If(varIALoading, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =40
                        OnSelect: |-
                          =Set(varIAErreurSaisie, IsBlank(Trim(InpIATexteRequete.Text)));
                          If(
                              Not(varIAErreurSaisie),
                              Set(varIAErreurAppel, "");
                              Set(varIAResultat, Blank());
                              Set(varIAConfirmerEcrasement, false);
                              Set(varIALoading, true);
                              IfError(
                                  Set(varIAResultat, Flow_AI_Request_Analysis.Run(Trim(InpIATexteRequete.Text))),
                                  Set(varIALoading, false);
                                  Set(varIAErreurAppel, "L’assistant IA est momentanément indisponible. Réessayez plus tard ou continuez sans assistance."),
                                  Set(varIALoading, false)
                              )
                          )
                        Text: =If(IsBlank(varIAErreurAppel), "Lancer l’analyse", "Réessayer")
                        Visible: =IsBlank(varIAResultat)
                        Width: =160
                  - TxtIALoading:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Analyse en cours..."
                        Visible: =varIALoading
                  - TxtIAErreurAppel:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        Size: =13
                        Text: =varIAErreurAppel
                        Visible: =Not(IsBlank(varIAErreurAppel))
                  - IAResultBlock:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =260
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        Visible: =Not(IsBlank(varIAResultat))
                      Children:
                        - TxtIAType:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 41, 55, 1)
                              Size: =13
                              Text: |-
                                ="Type de demande proposé : " & Coalesce(varIAResultat.type_demande_propose, "—")
                              Width: =Parent.Width
                        - TxtIABranche:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 41, 55, 1)
                              Size: =13
                              Text: |-
                                ="Branche contrat : " & Coalesce(varIAResultat.branche_contrat, "—")
                              Width: =Parent.Width
                        - TxtIAConfiance:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 41, 55, 1)
                              Size: =13
                              Text: |-
                                ="Confiance : " & Coalesce(varIAResultat.final_confidence, "—")
                              Width: =Parent.Width
                        - TxtIAStatut:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: |-
                                =If(
                                  varIAResultat.decision_status = "DECISION_CONFIRMED",
                                  RGBA(6, 95, 70, 1),
                                  RGBA(146, 64, 14, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: |-
                                ="Statut : " & Coalesce(varIAResultat.decision_status, "—")
                              Width: =Parent.Width
                        - TxtIAExplication:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(112, 112, 112, 1)
                              Size: =12
                              Text: =Coalesce(varIAResultat.explanation, "—")
                              Width: =Parent.Width
                        - TxtIAMessageValidation:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(146, 64, 14, 1)
                              FontWeight: =FontWeight.Semibold
                              Size: =12
                              Text: =Coalesce(varIAResultat.assistant_message, "")
                              Width: =Parent.Width
                        - TxtIAService:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 41, 55, 1)
                              Size: =13
                              Text: |-
                                ="Service proposé : " & Coalesce(varIAResultat.service_propose, "—")
                              Width: =Parent.Width
                  - TxtIAConfirmerEcrasement:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(217, 119, 6, 1)
                        Size: =12
                        Text: ="Une valeur existe déjà. Voulez-vous remplacer la valeur actuelle par la proposition IA ?"
                        Visible: =varIAConfirmerEcrasement
                  - IAButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - BtnIAFermer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Outline
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: =Set(varIAPanelOpen, false)
                              Text: ="Fermer"
                              Width: =110
                        - BtnIAAnnulerEcrasement:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Outline
                              BasePaletteColor: =RGBA(112, 112, 112, 1)
                              Height: =40
                              OnSelect: =Set(varIAConfirmerEcrasement, false)
                              Text: ="Annuler"
                              Visible: =varIAConfirmerEcrasement
                              Width: =110
                        - BtnIAAppliquer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: |-
                                =If(
                                    Not(varIAConfirmerEcrasement) && (Not(IsBlank(DdNDType.Selected.ID)) || Not(IsBlank(DdNDService.Selected.ID))),
                                    Set(varIAConfirmerEcrasement, true),
                                    Set(varIAConfirmerEcrasement, false);
                                    If(
                                        Not(IsBlank(varIAResultat.type_demande_propose)),
                                        Set(varIAAppliedType, LookUp(Types_Demandes, Titre = varIAResultat.type_demande_propose))
                                    );
                                    If(
                                        Not(IsBlank(varIAResultat.service_propose)),
                                        Set(varIAAppliedService, LookUp(Services_Siege, Title = varIAResultat.service_propose))
                                    );
                                    Reset(DdNDType);
                                    Reset(DdNDService);
                                    If(
                                        Not(IsBlank(varIAResultat.type_demande_propose)) && IsBlank(varIAAppliedType.ID),
                                        Notify("Le type proposé par l’IA « " & varIAResultat.type_demande_propose & " » ne correspond à aucun type existant — non appliqué.", NotificationType.Warning)
                                    );
                                    If(
                                        Not(IsBlank(varIAResultat.service_propose)) && IsBlank(varIAAppliedService.ID),
                                        Notify("Le service proposé par l’IA « " & varIAResultat.service_propose & " » ne correspond à aucun service existant — non appliqué.", NotificationType.Warning)
                                    );
                                    Set(varIAPanelOpen, false);
                                    Notify("Propositions IA appliquées — vérifiez les champs avant de soumettre.", NotificationType.Success)
                                )
                              Text: =If(varIAConfirmerEcrasement, "Confirmer le remplacement", "Appliquer les propositions")
                              Visible: =Not(IsBlank(varIAResultat)) && (Not(IsBlank(varIAResultat.service_propose)) || Not(IsBlank(varIAResultat.type_demande_propose)))
                              Width: =220
