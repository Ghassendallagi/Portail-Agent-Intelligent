Screens:
  NouvelleDemande:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varTriedSubmitND, false);
        Reset(InpNDTitre);
        Reset(DdNDType);
        Reset(DdNDService);
        Reset(RadNDUrgence)
    Children:
      - NDScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(249, 250, 251, 1)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - NDHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =150
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  PaddingTop: =24
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - NDBackRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                      Children:
                        - IconNDBack:
                            Control: ModernIcon
                            Properties:
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(6, 95, 70, 1)
                              FillPortions: =0
                              Width: =28
                              Height: =28
                              AccessibleLabel: ="Retour vers Mes demandes"
                              OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        - TxtNDBack:
                            Control: ModernText
                            Properties:
                              Text: ="Retour"
                              Size: =14
                              Color: =RGBA(6, 95, 70, 1)
                              FontWeight: =FontWeight.Semibold
                              AutoHeight: =true
                              OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                  - TxtNDTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Nouvelle demande"
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(6, 95, 70, 1)
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                  - RectNDAccentBar:
                      Control: Rectangle
                      Properties:
                        FillPortions: =0
                        Width: =56
                        Height: =4
                        Fill: =RGBA(6, 95, 70, 1)
            - NDBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingBottom: =28
                Children:
                  - FormCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =566
                        Width: =If(NouvelleDemande.Size = ScreenSize.Small, Parent.Width - 56, 640)
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =16
                        PaddingTop: =20
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        DropShadow: =DropShadow.Semilight
                      Children:
                        - BlockTitre:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - TxtLblNDTitre:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Titre de la demande *"
                                    Size: =13
                                    Color: =RGBA(107, 114, 128, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                              - InpNDTitre:
                                  Control: ModernTextInput
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    Placeholder: |-
                                      ="Ex : Demande de validation d'avenant"
                                    AccessibleLabel: ="Titre de la demande (obligatoire)"
                                    ValidationState: =If(varTriedSubmitND && IsBlank(Trim(Self.Text)), ValidationState.Error, ValidationState.None)
                              - TxtErrNDTitre:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Le titre est obligatoire."
                                    Size: =12
                                    Color: =RGBA(220, 38, 38, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Visible: =varTriedSubmitND && IsBlank(Trim(InpNDTitre.Text))
                        - BlockType:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - TxtLblNDType:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Type de demande *"
                                    Size: =13
                                    Color: =RGBA(107, 114, 128, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                              - DdNDType:
                                  Control: ModernDropdown
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    Items: =SortByColumns(Types_Demandes, "Title", SortOrder.Ascending)
                                    ItemDisplayText: =ThisItem.Title
                                    AccessibleLabel: ="Type de demande (obligatoire)"
                                    ValidationState: =If(varTriedSubmitND && IsBlank(Self.Selected.ID), ValidationState.Error, ValidationState.None)
                              - TxtErrNDType:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Sélectionnez un type de demande."
                                    Size: =12
                                    Color: =RGBA(220, 38, 38, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Visible: =varTriedSubmitND && IsBlank(DdNDType.Selected.ID)
                        - BlockService:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =82
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - TxtLblNDService:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Service destinataire *"
                                    Size: =13
                                    Color: =RGBA(107, 114, 128, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                              - DdNDService:
                                  Control: ModernDropdown
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    Items: =SortByColumns(Services_Siege, "Title", SortOrder.Ascending)
                                    ItemDisplayText: =ThisItem.Title
                                    AccessibleLabel: ="Service destinataire (obligatoire)"
                                    ValidationState: =If(varTriedSubmitND && IsBlank(Self.Selected.ID), ValidationState.Error, ValidationState.None)
                              - TxtErrNDService:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Sélectionnez un service destinataire."
                                    Size: =12
                                    Color: =RGBA(220, 38, 38, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Visible: =varTriedSubmitND && IsBlank(DdNDService.Selected.ID)
                        - BlockUrgence:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =172
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - TxtLblNDUrgence:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Niveau d'urgence"
                                    Size: =13
                                    Color: =RGBA(107, 114, 128, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                              - RadNDUrgence:
                                  Control: ModernRadio
                                  Properties:
                                    FillPortions: =0
                                    Height: =150
                                    Items: =["Faible", "Normal", "Urgent", "Critique"]
                                    Default: |-
                                      ={Value: "Normal"}
                                    AccessibleLabel: ="Niveau d'urgence"
                        - NDButtonsRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =44
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                            Children:
                              - BtnNDAnnuler:
                                  Control: ModernButton
                                  Properties:
                                    Text: ="Annuler"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    FillPortions: =0
                                    Width: =140
                                    Height: =40
                                    OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                              - BtnNDSoumettre:
                                  Control: ModernButton
                                  Properties:
                                    Text: ="Soumettre"
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(6, 95, 70, 1)
                                    FillPortions: =0
                                    Width: =160
                                    Height: =40
                                    OnSelect: |-
                                      =Set(varTriedSubmitND, true);
                                      If(
                                          Not(IsBlank(Trim(InpNDTitre.Text)))
                                              && Not(IsBlank(DdNDType.Selected.ID))
                                              && Not(IsBlank(DdNDService.Selected.ID)),
                                          IfError(
                                              Patch(
                                                  Demandes,
                                                  Defaults(Demandes),
                                                  {
                                                      Title: Trim(InpNDTitre.Text),
                                                      Type_Demande_ID: {Id: DdNDType.Selected.ID, Value: DdNDType.Selected.Title},
                                                      Service_Actuel_ID: {Id: DdNDService.Selected.ID, Value: DdNDService.Selected.Title},
                                                      Niveau_Urgence: {Value: RadNDUrgence.Selected.Value},
                                                      Agent_Demandeur: {
                                                          Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                          DisplayName: User().FullName,
                                                          Email: User().Email,
                                                          Department: "",
                                                          JobTitle: "",
                                                          Picture: ""
                                                      },
                                                      Statut_Actuel: {Value: "Soumis"},
                                                      Date_Soumission: Now(),
                                                      Num_Mouvement_Cours: 1,
                                                      Alerte_Retard_Active: false
                                                  }
                                              ),
                                              Notify("Échec de la soumission : " & FirstError.Message, NotificationType.Error),
                                              Notify("Votre demande a été soumise avec succès.", NotificationType.Success);
                                              Navigate(MesDemandes, ScreenTransition.Fade)
                                          )
                                      )
