                                                      "Récurrent", RGBA(219, 234, 254, 1),
                                                      "À accompagner", RGBA(254, 235, 200, 1),
                                                      "Critique", RGBA(254, 226, 226, 1),
                                                      RGBA(229, 231, 235, 1)
                                                  )
                                                Content: |-
                                                  =With(
                                                      {_p: ThisItem.Profil_Comportemental_ML.Value},
                                                      If(IsBlank(_p), "En attente d'analyse", _p)
                                                  )
                                                FillPortions: =0
                                                FontColor: |-
                                                  =Switch(
                                                      ThisItem.Profil_Comportemental_ML.Value,
                                                      "Autonome", RGBA(6, 95, 70, 1),
                                                      "Récurrent", RGBA(30, 64, 175, 1),
                                                      "À accompagner", RGBA(180, 83, 9, 1),
                                                      "Critique", RGBA(153, 27, 27, 1),
                                                      RGBA(55, 65, 81, 1)
                                                  )
                                                Height: =28
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: |-
                                                  =Len(With({_p: ThisItem.Profil_Comportemental_ML.Value}, If(IsBlank(_p), "En attente d'analyse", _p))) * 8 + 32
                                                Width: |-
                                                  =Len(With({_p: ThisItem.Profil_Comportemental_ML.Value}, If(IsBlank(_p), "En attente d'analyse", _p))) * 8 + 32
                                          - BadgeATRowActif:
                                              Control: Badge
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: =Coalesce(If(ThisItem.Actif, RGBA(209, 250, 229, 1), RGBA(229, 231, 235, 1)), RGBA(209, 250, 229, 1))
                                                Content: =Coalesce(If(ThisItem.Actif, "Actif", "Inactif"), "Actif")
                                                FillPortions: =0
                                                FontColor: =Coalesce(If(ThisItem.Actif, RGBA(6, 95, 70, 1), RGBA(107, 114, 128, 1)), RGBA(6, 95, 70, 1))
                                                Height: =28
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =Len(Coalesce(If(ThisItem.Actif, "Actif", "Inactif"), "Actif")) * 8 + 32
                                                Width: =Len(Coalesce(If(ThisItem.Actif, "Actif", "Inactif"), "Actif")) * 8 + 32
                                    - TxtATRowDate:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Recruté le " & If(IsBlank(ThisItem.Date_Recrutement), "—", Text(ThisItem.Date_Recrutement, "dd/mm/yyyy"))
                                          Width: =Parent.Width
                                          Wrap: =false
                              - BtnATModifier:
                                  Control: ModernButton
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(140, 12, 20, 1)
                                    FillPortions: =0
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varATFormMode, "edit");
                                      Set(varATEditingID, ThisItem.ID);
                                      Set(varATFormOpen, true)
                                    Text: ="Modifier"
                                    Width: =110
                              - BtnATToggleActif:
                                  Control: ModernButton
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(Coalesce(ThisItem.Actif, true), RGBA(220, 38, 38, 1), RGBA(6, 95, 70, 1))
                                    FillPortions: =0
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =IfError(
                                          Patch(Agents, ThisItem, {Actif: Not(Coalesce(ThisItem.Actif, true))}),
                                          Notify("Échec de la mise à jour : " & FirstError.Message, NotificationType.Error),
                                          Notify("Statut mis à jour.", NotificationType.Success)
                                      )
                                    Text: =If(Coalesce(ThisItem.Actif, true), "Désactiver", "Activer")
                                    Width: =110
                              - BtnATSupprimer:
                                  Control: ModernButton
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =RGBA(220, 38, 38, 1)
                                    FillPortions: =0
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varATConfirmRemoveID, ThisItem.ID);
                                      Set(varATConfirmRemoveName, ThisItem.Title);
                                      Set(varATRefCount,
                                          CountRows(Filter(Demandes, Agent_Demandeur.Email = ThisItem.Email_Agent))
                                          + CountRows(Filter(Performance_Mensuelle_Agents, Agent_ID.Id = ThisItem.ID))
                                      )
                                    Text: ="Supprimer"
                                    Width: =110
                  - TxtATEmpty:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =RGBA(144, 144, 144, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Aucun agent."
                        Visible: =GalleryATListe.AllItemsCount = 0
                        Width: =Parent.Width - 56
                        Wrap: =false
      - ATFormOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =varATFormOpen
            Width: =Parent.Width
          Children:
            - RectATFormScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varATFormOpen, false)
                  Width: =Parent.Width
            - ATFormCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Min(Parent.Height - 40, 620)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(AdministrationAgents.Size = ScreenSize.Small, Parent.Width - 40, 480)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtATFormTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FillPortions: =0
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: =If(varATFormMode = "edit", "Modifier l'agent", "Nouvel agent")
                        Wrap: =false
                  - TxtATLblNom:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Nom *"
                        Wrap: =false
                  - InpATNom:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Nom (obligatoire)"
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varATFormMode = "edit", LookUp(Agents, ID = varATEditingID).Title, "")
                        FillPortions: =0
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - TxtATLblEmail:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Email *"
                        Wrap: =false
                  - InpATEmail:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Email (obligatoire)"
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varATFormMode = "edit", LookUp(Agents, ID = varATEditingID).Email_Agent, "")
                        FillPortions: =0
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: ="prenom.nom@takafulia.tn"
                  - TxtATLblAgence:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Agence *"
                        Wrap: =false
                  - DdATAgence:
