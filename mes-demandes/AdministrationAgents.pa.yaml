                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =28
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - IconBackAT:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour à l'espace administrateur"
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Height: =20
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(EspaceAdministrateur, ScreenTransition.Fade)
                              Width: =20
                        - TxtBackAT:
