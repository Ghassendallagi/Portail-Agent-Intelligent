                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
