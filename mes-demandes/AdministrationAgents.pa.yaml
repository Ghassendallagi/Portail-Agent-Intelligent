                              Size: =28
                              Text: ="Agents"
                              Wrap: =false
                        - IconNotifAT:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Ouvrir les notifications"
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Height: =28
                              Icon: ="Alert"
                              IconColor: =RGBA(140, 12, 20, 1)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                              Width: =28
                        - BadgeNotifAT:
                            Control: Badge
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='BadgeCanvas.Appearance'.Filled
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                              FillPortions: =0
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                  - RectATAccentBar:
                      Control: Rectangle
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Fill: =RGBA(140, 12, 20, 1)
                        FillPortions: =0
                        Height: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =56
            - ATBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =20
                Children:
                  - ATToolbarRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - BtnATNouveau:
                            Control: ModernButton
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Height: =40
                              Icon: ="Add"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varATFormMode, "create");
                                Set(varATEditingID, Blank());
                                Reset(InpATNom);
                                Reset(InpATEmail);
                                Reset(DdATAgence);
                                Reset(InpATDateRecrutement);
                                Reset(RadATActif);
                                Set(varATFormOpen, true)
                              Text: ="Ajouter un agent"
                              Width: =220
                  - GalleryATListe:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: =SortByColumns(Agents, "Title", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplatePadding: =10
                        TemplateSize: =140
                        Width: =Parent.Width - 56
                      Children:
                        - ATRowCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - ATRowInfo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - TxtATRowNom:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: =Coalesce(ThisItem.Title, "—")
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - TxtATRowEmail:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =Coalesce(ThisItem.Email_Agent, "—")
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - ATRowBadgesLine:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          FillPortions: =0
                                          Height: =28
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =Parent.Width
                                        Children:
                                          - BadgeATRowAgence:
                                              Control: Badge
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: =RGBA(219, 234, 254, 1)
                                                Content: =Coalesce(LookUp(Agences, ID = ThisItem.Agence_ID.Id, Title), "—")
                                                FillPortions: =0
                                                FontColor: =RGBA(30, 64, 175, 1)
                                                Height: =28
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =Len(Coalesce(LookUp(Agences, ID = ThisItem.Agence_ID.Id, Title), "—")) * 8 + 32
                                                Width: =Len(Coalesce(LookUp(Agences, ID = ThisItem.Agence_ID.Id, Title), "—")) * 8 + 32
                                          - BadgeATRowProfil:
                                              Control: Badge
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: |-
                                                  =Switch(
                                                      ThisItem.Profil_Comportemental_ML.Value,
