                      Properties:
                        AccessibleLabel: ="Agence (obligatoire)"
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varATFormMode = "edit", LookUp(Agences, ID = LookUp(Agents, ID = varATEditingID).Agence_ID.Id), Blank())
                        FillPortions: =0
                        Height: =40
                        ItemDisplayText: =ThisItem.Title
                        Items: =SortByColumns(Agences, "Title", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - TxtATLblDate:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Date de recrutement *"
                        Wrap: =false
                  - InpATDateRecrutement:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Date de recrutement (obligatoire, JJ/MM/AAAA)"
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: |-
                          =If(varATFormMode = "edit" && Not(IsBlank(LookUp(Agents, ID = varATEditingID).Date_Recrutement)), Text(LookUp(Agents, ID = varATEditingID).Date_Recrutement, "dd/mm/yyyy"), "")
                        FillPortions: =0
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: ="JJ/MM/AAAA"
                  - TxtATLblActif:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Actif"
                        Wrap: =false
                  - RadATActif:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Actif"
                        AlignInContainer: =AlignInContainer.Stretch
                        Default: |-
                          =If(varATFormMode = "edit" && Not(Coalesce(LookUp(Agents, ID = varATEditingID).Actif, true)), {Value: "Non"}, {Value: "Oui"})
                        FillPortions: =0
                        Height: =76
                        Items: =["Oui", "Non"]
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - TxtATFormErr:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Le nom, l'email, l'agence et une date de recrutement valide (JJ/MM/AAAA) sont obligatoires."
                        Visible: |-
                          =varATTriedSave && (
                              IsBlank(Trim(InpATNom.Text))
                                  || IsBlank(Trim(InpATEmail.Text))
                                  || IsBlank(DdATAgence.Selected.ID)
                                  || IsBlank(Trim(InpATDateRecrutement.Text))
                                  || IsError(DateValue(Trim(InpATDateRecrutement.Text)))
                          )
                  - ATFormButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - BtnATAnnuler:
                            Control: ModernButton
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Outline
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varATFormOpen, false)
                              Text: ="Annuler"
                              Width: =120
                        - BtnATEnregistrer:
                            Control: ModernButton
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varATTriedSave, true);
                                If(
                                    Not(IsBlank(Trim(InpATNom.Text)))
                                        && Not(IsBlank(Trim(InpATEmail.Text)))
                                        && Not(IsBlank(DdATAgence.Selected.ID))
                                        && Not(IsBlank(Trim(InpATDateRecrutement.Text)))
                                        && Not(IsError(DateValue(Trim(InpATDateRecrutement.Text))))
                                    ,
                                    IfError(
                                        Patch(
                                            Agents,
                                            If(varATFormMode = "edit", LookUp(Agents, ID = varATEditingID), Defaults(Agents)),
                                            {
                                                Title: Trim(InpATNom.Text),
                                                Email_Agent: Trim(InpATEmail.Text),
                                                Agence_ID: {Id: DdATAgence.Selected.ID, Value: DdATAgence.Selected.Title},
                                                Date_Recrutement: DateValue(Trim(InpATDateRecrutement.Text)),
                                                Actif: RadATActif.Selected.Value = "Oui"
                                            }
                                        ),
                                        Notify("Échec de l'enregistrement : " & FirstError.Message, NotificationType.Error),
                                        Set(varATFormOpen, false);
                                        Set(varATTriedSave, false);
                                        Refresh(Agents);
                                        Notify("Agent enregistré.", NotificationType.Success)
                                    )
                                )
                              Text: ="Enregistrer"
                              Width: =140
      - ATConfirmRemoveOverlay:
