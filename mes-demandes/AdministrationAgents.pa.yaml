                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =IfError(
                                    Patch(Agents, LookUp(Agents, ID = varATConfirmRemoveID), {Actif: false}),
                                    Notify("Échec de la mise à jour : " & FirstError.Message, NotificationType.Error),
                                    Set(varATConfirmRemoveID, Blank());
                                    Refresh(Agents);
                                    Notify("Agent désactivé.", NotificationType.Success)
                                )
                              Text: ="Désactiver à la place"
                              Visible: =varATRefCount > 0
                              Width: =180
                        - BtnATConfirmAnnuler:
                            Control: ModernButton
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varATConfirmRemoveID, Blank())
                              Text: ="Annuler"
                              Visible: =varATRefCount = 0
                              Width: =120
                        - BtnATConfirmSupprimer:
                            Control: ModernButton
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
