                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varATConfirmRemoveID, Blank())
                              Text: ="Fermer"
                              Visible: =varATRefCount > 0
                              Width: =120
                        - BtnATConfirmDesactiver:
