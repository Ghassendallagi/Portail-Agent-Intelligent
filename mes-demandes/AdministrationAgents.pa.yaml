      - ATMain:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(AdministrationAgents.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(AdministrationAgents.Size = ScreenSize.Small, 0, RailAT.Width)
            X: =If(AdministrationAgents.Size = ScreenSize.Small, 0, RailAT.Width)
          Children:
            - ATHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =136
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
