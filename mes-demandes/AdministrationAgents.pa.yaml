Screens:
  AdministrationAgents:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varATFormOpen, false);
        Set(varATFormMode, "create");
        Set(varATEditingID, Blank());
        Set(varATTriedSave, false);
        Set(varATConfirmRemoveID, Blank());
        Set(varATConfirmRemoveName, "");
        Set(varATRefCount, 0)
    Children:
      - RailAT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =AdministrationAgents.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoAT:
                Control: Image
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  Height: =60
                  Image: =Logo
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
            - RectRailSepAT:
                Control: Rectangle
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0
                  Height: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
            - NavATAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoATAccueil:
                      Control: ModernIcon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblATAccueil:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Accueil"
                        Wrap: =false
