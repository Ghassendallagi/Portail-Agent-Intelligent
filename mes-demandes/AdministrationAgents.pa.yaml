                  - BdgATNotifs:
                      Control: Badge
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FillPortions: =0
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =30
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
