Screens:
  AdministrationGestionnaires:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varAGFormOpen, false);
        Set(varAGFormMode, "create");
        Set(varAGEditingID, Blank());
        Set(varAGTriedSave, false);
        Set(varAGConfirmRemoveID, Blank());
        Set(varAGConfirmRemoveName, "")
    Children:
      - RailAG:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =AdministrationGestionnaires.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoAG:
                Control: Image
                Properties:
                  Height: =60
                  Image: =Logo
            - RectRailSepAG:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =16
            - NavAGAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoAGAccueil:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblAGAccueil:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Accueil"
            - NavAGMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoAGMesDem:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblAGMesDem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Mes demandes"
            - NavAGNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoAGNouvelle:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Width: =22
                  - LblAGNouvelle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Nouvelle demande"
            - NavAGFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoAGFile:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Width: =22
                  - LblAGFile:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Size: =14
                        Text: ="File à traiter"
            - NavAGAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoAGAlertes:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Width: =22
                  - LblAGAlertes:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Alertes SLA"
            - NavAGStats:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoAGStats:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="DataBarVertical"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Width: =22
                  - LblAGStats:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Statistiques"
            - NavAGAdmin:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Admin"
                Children:
                  - IcoAGAdmin:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Settings"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EspaceAdministrateur, ScreenTransition.Fade)
                        Width: =22
                  - LblAGAdmin:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EspaceAdministrateur, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Administration"
            - NavAGNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoAGNotifs:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Width: =22
                  - LblAGNotifs:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Notifications"
                  - BdgAGNotifs:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        Width: =30
            - RectRailSpacerAG:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
            - RectRailSeparatorAG:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
            - TxtRailUserAG:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(55, 65, 81, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =User().FullName
            - TxtRailRoleAG:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(112, 112, 112, 1)
                  Size: =12
                  Text: =UserRole
      - AGMain:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(AdministrationGestionnaires.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(AdministrationGestionnaires.Size = ScreenSize.Small, 0, RailAG.Width)
            X: =If(AdministrationGestionnaires.Size = ScreenSize.Small, 0, RailAG.Width)
          Children:
            - AGHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =136
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
                Children:
                  - AGBackRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =28
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                      Children:
                        - IconBackAG:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour à l'espace administrateur"
                              Height: =20
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Navigate(EspaceAdministrateur, ScreenTransition.Fade)
                              Width: =20
                        - TxtBackAG:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(EspaceAdministrateur, ScreenTransition.Fade)
                              Size: =13
                              Text: ="Espace Administrateur"
                  - AGTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =42
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        Width: =Parent.Width - 56
                      Children:
                        - TxtAGTitreMain:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Size: =28
                              Text: ="Gestionnaires"
                        - IconNotifAG:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Ouvrir les notifications"
                              Height: =28
                              Icon: ="Alert"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                              Width: =28
                        - BadgeNotifAG:
                            Control: Badge
                            Properties:
                              Appearance: ='BadgeCanvas.Appearance'.Filled
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =22
                              Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                  - RectAGAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - AGBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =20
                Children:
                  - AGToolbarRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                      Children:
                        - DdAGFilterService:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Filtrer par service"
                              BorderColor: =RGBA(229, 231, 235, 1)
                              FillPortions: =1
                              Height: =40
                              ItemDisplayText: =ThisItem.Title
                              Items: =SortByColumns(Services_Siege, "Title", SortOrder.Ascending)
                        - BtnAGNouveau:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              Icon: ="Add"
                              OnSelect: |-
                                =Set(varAGFormMode, "create");
                                Set(varAGEditingID, Blank());
                                Reset(InpAGNom);
                                Reset(InpAGEmail);
                                Reset(DdAGService);
                                Reset(RadAGRole);
                                Set(varAGFormOpen, true)
                              Text: ="Ajouter un gestionnaire"
                              Width: =220
                  - GalleryAGListe:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  Membres_Services,
                                  Role.Value = "Gestionnaire"
                                      && (IsBlank(DdAGFilterService.Selected.ID) || Service_ID.Id = DdAGFilterService.Selected.ID)
                              ),
                              "Title", SortOrder.Ascending
                          )
                        TemplatePadding: =10
                        TemplateSize: =120
                        Width: =Parent.Width - 56
                      Children:
                        - AGRowCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - AGRowInfo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                  Children:
                                    - TxtAGRowNom:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(31, 41, 55, 1)
                                          FontWeight: =FontWeight.Bold
                                          Text: =Coalesce(ThisItem.Utilisateur.DisplayName, "—")
                                          Width: =Parent.Width
                                    - TxtAGRowEmail:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =12
                                          Text: =Coalesce(ThisItem.Utilisateur.Email, "—")
                                          Width: =Parent.Width
                                    - AGRowBadgesLine:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =28
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          Width: =Parent.Width
                                        Children:
                                          - BadgeAGRowService:
                                              Control: Badge
                                              Properties:
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: =RGBA(219, 234, 254, 1)
                                                Content: =Coalesce(LookUp(Services_Siege, ID = ThisItem.Service_ID.Id, Title), "—")
                                                FontColor: =RGBA(30, 64, 175, 1)
                                                Height: =28
                                                LayoutMinWidth: =Len(Coalesce(LookUp(Services_Siege, ID = ThisItem.Service_ID.Id, Title), "—")) * 8 + 32
                                                Width: =Len(Coalesce(LookUp(Services_Siege, ID = ThisItem.Service_ID.Id, Title), "—")) * 8 + 32
                                          - BadgeAGRowRole:
                                              Control: Badge
                                              Properties:
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: =RGBA(209, 250, 229, 1)
                                                Content: =Coalesce(ThisItem.Role.Value, "—")
                                                FontColor: =RGBA(6, 95, 70, 1)
                                                Height: =28
                                                LayoutMinWidth: =Len(Coalesce(ThisItem.Role.Value, "—")) * 8 + 32
                                                Width: =Len(Coalesce(ThisItem.Role.Value, "—")) * 8 + 32
                              - BtnAGModifier:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(140, 12, 20, 1)
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varAGFormMode, "edit");
                                      Set(varAGEditingID, ThisItem.ID);
                                      Reset(DdAGService);
                                      Reset(RadAGRole);
                                      Set(varAGFormOpen, true)
                                    Text: ="Modifier"
                                    Width: =110
                              - BtnAGRetirer:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =RGBA(220, 38, 38, 1)
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varAGConfirmRemoveID, ThisItem.ID);
                                      Set(varAGConfirmRemoveName, ThisItem.Utilisateur.DisplayName)
                                    Text: ="Retirer"
                                    Width: =100
                  - TxtAGEmpty:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(144, 144, 144, 1)
                        Size: =14
                        Text: ="Aucun gestionnaire pour ce filtre."
                        Visible: =GalleryAGListe.AllItemsCount = 0
                        Width: =Parent.Width - 56
      - AGFormOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =varAGFormOpen
            Width: =Parent.Width
          Children:
            - RectAGFormScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varAGFormOpen, false)
                  Width: =Parent.Width
            - AGFormCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Min(Parent.Height - 40, 480)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(AdministrationGestionnaires.Size = ScreenSize.Small, Parent.Width - 40, 480)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtAGFormTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: =If(varAGFormMode = "edit", "Modifier l'affectation", "Nouveau gestionnaire")
                  - TxtAGLblNom:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Nom *"
                        Visible: =varAGFormMode = "create"
                  - InpAGNom:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Nom (obligatoire)"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Height: =40
                        Visible: =varAGFormMode = "create"
                  - TxtAGLblEmail:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Email *"
                        Visible: =varAGFormMode = "create"
                  - InpAGEmail:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Email (obligatoire)"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Height: =40
                        Placeholder: ="prenom.nom@takafulia.tn"
                        Visible: =varAGFormMode = "create"
                  - TxtAGEditIdentity:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(31, 41, 55, 1)
                        FontWeight: =FontWeight.Semibold
                        Size: =13
                        Text: |-
                          ="Gestionnaire : " & LookUp(Membres_Services, ID = varAGEditingID).Utilisateur.DisplayName & " (" & LookUp(Membres_Services, ID = varAGEditingID).Utilisateur.Email & ")"
                        Visible: =varAGFormMode = "edit"
                  - TxtAGLblService:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Service *"
                  - DdAGService:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Service (obligatoire)"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varAGFormMode = "edit", LookUp(Services_Siege, ID = LookUp(Membres_Services, ID = varAGEditingID).Service_ID.Id), Blank())
                        Height: =40
                        ItemDisplayText: =ThisItem.Title
                        Items: =SortByColumns(Services_Siege, "Title", SortOrder.Ascending)
                  - TxtAGLblRole:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Rôle *"
                  - RadAGRole:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Rôle (obligatoire)"
                        Default: |-
                          =If(varAGFormMode = "edit", {Value: LookUp(Membres_Services, ID = varAGEditingID).Role.Value}, {Value: "Gestionnaire"})
                        Height: =76
                        Items: =["Gestionnaire", "Superviseur"]
                  - TxtAGFormErr:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        Size: =12
                        Text: ="Le nom, l'email et le service sont obligatoires."
                        Visible: |-
                          =varAGTriedSave && (
                              (varAGFormMode = "create" && (IsBlank(Trim(InpAGNom.Text)) || IsBlank(Trim(InpAGEmail.Text))))
                                  || IsBlank(DdAGService.Selected.ID)
                          )
                  - AGFormButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - BtnAGAnnuler:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Outline
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: =Set(varAGFormOpen, false)
                              Text: ="Annuler"
                              Width: =120
                        - BtnAGEnregistrer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: |-
                                =Set(varAGTriedSave, true);
                                If(
                                    (varAGFormMode = "edit" || (Not(IsBlank(Trim(InpAGNom.Text))) && Not(IsBlank(Trim(InpAGEmail.Text)))))
                                        && Not(IsBlank(DdAGService.Selected.ID)),
                                    IfError(
                                        Patch(
                                            Membres_Services,
                                            If(varAGFormMode = "edit", LookUp(Membres_Services, ID = varAGEditingID), Defaults(Membres_Services)),
                                            {
                                                Utilisateur: If(
                                                    varAGFormMode = "edit",
                                                    LookUp(Membres_Services, ID = varAGEditingID).Utilisateur,
                                                    {
                                                        '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                        Claims: "i:0#.f|membership|" & Lower(Trim(InpAGEmail.Text)),
                                                        DisplayName: Trim(InpAGNom.Text),
                                                        Email: Trim(InpAGEmail.Text),
                                                        Department: "",
                                                        JobTitle: "",
                                                        Picture: ""
                                                    }
                                                ),
                                                Service_ID: {Id: DdAGService.Selected.ID, Value: DdAGService.Selected.Title},
                                                Role: {Value: RadAGRole.Selected.Value}
                                            }
                                        ),
                                        Notify("Échec de l'enregistrement : " & FirstError.Message, NotificationType.Error),
                                        Set(varAGFormOpen, false);
                                        Set(varAGTriedSave, false);
                                        Refresh(Membres_Services);
                                        Notify("Gestionnaire enregistré.", NotificationType.Success)
                                    )
                                )
                              Text: ="Enregistrer"
                              Width: =140
      - AGConfirmRemoveOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =Not(IsBlank(varAGConfirmRemoveID))
            Width: =Parent.Width
          Children:
            - RectAGConfirmScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varAGConfirmRemoveID, Blank())
                  Width: =Parent.Width
            - AGConfirmCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =180
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(AdministrationGestionnaires.Size = ScreenSize.Small, Parent.Width - 40, 440)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtAGConfirmTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(31, 41, 55, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =17
                        Text: ="Retirer ce gestionnaire ?"
                  - TxtAGConfirmBody:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="« " & varAGConfirmRemoveName & " » perdra son affectation de gestionnaire."
                  - AGConfirmButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - BtnAGConfirmAnnuler:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =40
                              OnSelect: =Set(varAGConfirmRemoveID, Blank())
                              Text: ="Annuler"
                              Width: =120
                        - BtnAGConfirmRetirer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              Height: =40
                              OnSelect: |-
                                =IfError(
                                    Remove(Membres_Services, LookUp(Membres_Services, ID = varAGConfirmRemoveID)),
                                    Notify("Échec de la suppression : " & FirstError.Message, NotificationType.Error),
                                    Set(varAGConfirmRemoveID, Blank());
                                    Refresh(Membres_Services);
                                    Notify("Gestionnaire retiré.", NotificationType.Success)
                                )
                              Text: ="Retirer"
                              Width: =120
