App:
  Properties:
    BackEnabled: =false
    Formulas: |-
      =// ---- Takaful palette (shared named formulas) ----
      ColorAccent = RGBA(140,12,20,1);
      ColorBackground = RGBA(249,250,251,1);
      ColorTextSecondary = RGBA(112,112,112,1);
      ColorTextTertiary = RGBA(144,144,144,1);
      ColorCardWhite = RGBA(255,255,255,1);
      ColorUrgent = RGBA(220,38,38,1);
      // ---- Détection de rôle (populations strictement séparées ; Membres_Services prioritaire) ----
      UserRole = Coalesce(
          LookUp(Membres_Services, Utilisateur.Email = User().Email, Role.Value),
          LookUp(Agents, Email_Agent = User().Email, "Agent"),
          "Inconnu"
      );
      UserServiceID = LookUp(Membres_Services, Utilisateur.Email = User().Email, Service_ID.Id);
      UserServiceLabel = LookUp(Services_Siege, ID = UserServiceID, Title);
      // ---- Moteur de regles metier (Phase D) : regles du Type_Demande de la demande courante ----
      TypeRulesActuelles = LookUp(Types_Demandes, ID = varSelectedDemande.Type_Demande_ID.Id);
    StartScreen: |-
      =Switch(
          UserRole,
          "Agent", Accueil,
          "Gestionnaire", Accueil,
          "Superviseur", Accueil,
          "Admin", Accueil,
          AccesNonConfigure
      )
    Theme: =PowerAppsTheme
