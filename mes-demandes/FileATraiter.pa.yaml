Screens:
  FileATraiter:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =UpdateContext({ctxFTTab: Coalesce(ctxFTTab, "atraiter")})
    Children:
      - RailFT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =300
            Height: =Parent.Height
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.Semilight
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            Visible: =FileATraiter.Size <> ScreenSize.Small
          Children:
            - ImgLogoFT:
                Control: Image
                Properties:
                  Image: =Logo
                  FillPortions: =0
                  Height: =60
                  ImagePosition: =ImagePosition.Fit
            - RectRailSepFT:
                Control: Rectangle
                Properties:
                  FillPortions: =0
                  Height: =16
                  Fill: =RGBA(0, 0, 0, 0)
            - NavFTAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(140, 12, 20, 0.08)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - IcoFTAccueil:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                  - LblFTAccueil:
                      Control: ModernText
                      Properties:
                        Text: ="Accueil"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
            - NavFTMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoFTMesDem:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                  - LblFTMesDem:
                      Control: ModernText
                      Properties:
                        Text: ="Mes demandes"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
            - NavFTNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoFTNouvelle:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Add"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                  - LblFTNouvelle:
                      Control: ModernText
                      Properties:
                        Text: ="Nouvelle demande"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
            - NavFTFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoFTFile:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Briefcase"
                        IconColor: =RGBA(140, 12, 20, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                  - LblFTFile:
                      Control: ModernText
                      Properties:
                        Text: ="File à traiter"
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(140, 12, 20, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
            - NavFTAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoFTAlertes:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                  - LblFTAlertes:
                      Control: ModernText
                      Properties:
                        Text: ="Alertes SLA"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
            - NavFTNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - IcoFTNotifs:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                  - LblFTNotifs:
                      Control: ModernText
                      Properties:
                        Text: ="Notifications"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                  - BdgFTNotifs:
                      Control: Badge
                      Properties:
                        Content: |-
                          =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        FontColor: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Width: =30
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: |-
                          =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
            - RectRailSpacerFT:
                Control: Rectangle
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
            - RectRailSeparatorFT:
                Control: Rectangle
                Properties:
                  FillPortions: =0
                  Height: =1
                  Fill: =RGBA(229, 231, 235, 1)
            - TxtRailUserFT:
                Control: ModernText
                Properties:
                  Text: =User().FullName
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(55, 65, 81, 1)
                  AutoHeight: =true
                  FillPortions: =0
            - TxtRailRoleFT:
                Control: ModernText
                Properties:
                  Text: =UserRole
                  Size: =12
                  FontWeight: =FontWeight.Normal
                  Color: =RGBA(112, 112, 112, 1)
                  AutoHeight: =true
                  FillPortions: =0
      - FTScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =If(FileATraiter.Size = ScreenSize.Small, 0, RailFT.Width)
            Y: =0
            Width: =Parent.Width - If(FileATraiter.Size = ScreenSize.Small, 0, RailFT.Width)
            Height: =Parent.Height - If(FileATraiter.Size = ScreenSize.Small, 64, 0)
            Fill: =RGBA(249, 250, 251, 1)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - FTHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =104
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  PaddingTop: =28
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - FTTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =42
                        Width: =Parent.Width - 56
                        Fill: =RGBA(255, 255, 255, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                      Children:
                        - TxtFTTitreMain:
                            Control: ModernText
                            Properties:
                              Text: ="File à traiter"
                              Size: =28
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(140, 12, 20, 1)
                              AutoHeight: =true
                              FillPortions: =1
                        - IconNotifFT:
                            Control: ModernIcon
                            Properties:
                              Icon: ="Alert"
                              IconColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Width: =28
                              Height: =28
                              AccessibleLabel: ="Ouvrir les notifications"
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        - BadgeNotifFT:
                            Control: Badge
                            Properties:
                              Content: |-
                                =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                              Appearance: ='BadgeCanvas.Appearance'.Filled
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              FontColor: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Width: =32
                              Height: =22
                              LayoutMinWidth: =32
                              Visible: |-
                                =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        - BtnAlertesSLA:
                            Control: ModernButton
                            Properties:
                              Text: =If(FileATraiter.Size = ScreenSize.Small, "SLA", "Alertes SLA")
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Width: =If(FileATraiter.Size = ScreenSize.Small, 64, 150)
                              Height: =40
                              AccessibleLabel: ="Ouvrir les alertes SLA"
                              Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                              OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                  - RectFTAccentBar:
                      Control: Rectangle
                      Properties:
                        FillPortions: =0
                        Width: =56
                        Height: =4
                        Fill: =RGBA(140, 12, 20, 1)
            - FTBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutGap: =10
                  PaddingTop: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingBottom: =28
                Children:
                  - InpSearchFT:
                      Control: ModernTextInput
                      Properties:
                        Type: =TextInputType.Search
                        Placeholder: ="Rechercher une demande ou un demandeur..."
                        Default: =""
                        FillPortions: =0
                        Width: =Min(Parent.Width - 56, 800)
                        Height: =40
                        Size: =14
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                  - TabsRowFT:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =48
                        AlignInContainer: =AlignInContainer.Start
                        Width: =Min(Parent.Width - 56, 800)
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                      Children:
                        - BtnTbFTATraiter:
                            Control: ModernButton
                            Properties:
                              Text: ="À traiter"
                              Icon: ="Briefcase"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxFTTab = "atraiter", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxFTTab = "atraiter", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxFTTab = "atraiter", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxFTTab = "atraiter", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxFTTab: "atraiter"})
                        - BtnTbFTTraitees:
                            Control: ModernButton
                            Properties:
                              Text: ="Traitées"
                              Icon: ="Checkmark"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxFTTab = "traitees", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxFTTab = "traitees", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxFTTab = "traitees", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxFTTab = "traitees", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxFTTab: "traitees"})
                        - BtnTbFTTransferees:
                            Control: ModernButton
                            Properties:
                              Text: ="Transférées"
                              Icon: ="ArrowRight"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Visible: =UserRole <> "Admin"
                              Appearance: =If(ctxFTTab = "transferees", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxFTTab = "transferees", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxFTTab = "transferees", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxFTTab = "transferees", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxFTTab: "transferees"})
                  - GalleryATraiter:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Visible: =ctxFTTab = "atraiter"
                        Items: |-
                          =With(
                              {_q: Trim(InpSearchFT.Text)},
                              If(
                                  UserRole = "Admin",
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          (Statut_Actuel.Value = "Soumis"
                                              || Statut_Actuel.Value = "En cours"
                                              || Statut_Actuel.Value = "En attente élément"
                                              || Statut_Actuel.Value = "Transféré")
                                              && (IsBlank(_q) || StartsWith(Title, _q) || StartsWith(Agent_Demandeur.DisplayName, _q))
                                      ),
                                      "Date_Soumission", SortOrder.Ascending
                                  ),
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          Service_Actuel_ID.Value = UserServiceLabel
                                              && (Statut_Actuel.Value = "Soumis"
                                                  || Statut_Actuel.Value = "En cours"
                                                  || Statut_Actuel.Value = "En attente élément"
                                                  || Statut_Actuel.Value = "Transféré")
                                              && (IsBlank(_q) || StartsWith(Title, _q) || StartsWith(Agent_Demandeur.DisplayName, _q))
                                      ),
                                      "Date_Soumission", SortOrder.Ascending
                                  )
                              )
                          )
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =150
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                      Children:
                        - FTCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RectFTUrgencyStripe:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Width: =4
                                    Fill: =If(ThisItem.Niveau_Urgence.Value = "Urgent" || ThisItem.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(255, 255, 255, 0))
                              - FTContentContainer:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =6
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                  Children:
                                    - TxtFTCardTitle:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Title
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - BadgeFTStatut:
                                        Control: Badge
                                        Properties:
                                          Content: =ThisItem.Statut_Actuel.Value
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          FillPortions: =0
                                          Width: =96
                                          Height: =28
                                          LayoutMinWidth: =96
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(229, 231, 235, 1),
                                              "En cours", RGBA(219, 234, 254, 1),
                                              "En attente élément", RGBA(254, 243, 199, 1),
                                              "Transféré", RGBA(237, 233, 254, 1),
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          FontColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(55, 65, 81, 1),
                                              "En cours", RGBA(30, 64, 175, 1),
                                              "En attente élément", RGBA(146, 64, 14, 1),
                                              "Transféré", RGBA(91, 33, 182, 1),
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                    - TxtFTCardService:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Service : " & ThisItem.Service_Actuel_ID.Value & "  ·  Type : " & ThisItem.Type_Demande_ID.Value
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTCardAgent:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Demandeur : " & ThisItem.Agent_Demandeur.DisplayName
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTCardDate:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            =With(
                                              {
                                                _hrs: DateDiff(ThisItem.Date_Soumission, Now(), TimeUnit.Hours)
                                              },
                                              If(
                                                _hrs < 24,
                                                "soumise il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                With(
                                                  {_days: RoundDown(_hrs / 24, 0)},
                                                  "soumise il y a " & _days & If(_days = 1, " jour", " jours")
                                                )
                                              )
                                            )
                                          Size: =12
                                          Color: =RGBA(144, 144, 144, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                        - BtnFTCardClick:
                            Control: Classic/Button
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Text: =""
                              Fill: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =2
                              BorderColor: =RGBA(0, 0, 0, 0)
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtFTEmptyATraiter:
                      Control: ModernText
                      Properties:
                        Text: ="Aucune demande à traiter."
                        Size: =14
                        Color: =RGBA(144, 144, 144, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =ctxFTTab = "atraiter" && GalleryATraiter.AllItemsCount = 0
                  - GalleryTraitees:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Visible: =ctxFTTab = "traitees"
                        Items: |-
                          =With(
                              {_q: Trim(InpSearchFT.Text)},
                              If(
                                  UserRole = "Admin",
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          (Statut_Actuel.Value = "Validé"
                                              || Statut_Actuel.Value = "Rejeté"
                                              || Statut_Actuel.Value = "Clôturé")
                                              && (IsBlank(_q) || StartsWith(Title, _q) || StartsWith(Agent_Demandeur.DisplayName, _q))
                                      ),
                                      "Date_Dernier_Mouvement", SortOrder.Descending
                                  ),
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          Service_Actuel_ID.Value = UserServiceLabel
                                              && (Statut_Actuel.Value = "Validé"
                                                  || Statut_Actuel.Value = "Rejeté"
                                                  || Statut_Actuel.Value = "Clôturé")
                                              && (IsBlank(_q) || StartsWith(Title, _q) || StartsWith(Agent_Demandeur.DisplayName, _q))
                                      ),
                                      "Date_Dernier_Mouvement", SortOrder.Descending
                                  )
                              )
                          )
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =150
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                      Children:
                        - FTTCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RectFTTUrgencyStripe:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Width: =4
                                    Fill: =If(ThisItem.Niveau_Urgence.Value = "Urgent" || ThisItem.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(255, 255, 255, 0))
                              - FTTContentContainer:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =6
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                  Children:
                                    - TxtFTTCardTitle:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Title
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - BadgeFTTStatut:
                                        Control: Badge
                                        Properties:
                                          Content: =ThisItem.Statut_Actuel.Value
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          FillPortions: =0
                                          Width: =96
                                          Height: =28
                                          LayoutMinWidth: =96
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          FontColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                    - TxtFTTCardService:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Service : " & ThisItem.Service_Actuel_ID.Value & "  ·  Type : " & ThisItem.Type_Demande_ID.Value
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTTCardAgent:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Demandeur : " & ThisItem.Agent_Demandeur.DisplayName
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTTCardDate:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            =If(
                                              IsBlank(ThisItem.Date_Dernier_Mouvement),
                                              "",
                                              "dernier traitement le " & Text(ThisItem.Date_Dernier_Mouvement, DateTimeFormat.ShortDateTime24)
                                            )
                                          Size: =12
                                          Color: =RGBA(144, 144, 144, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                        - BtnFTTCardClick:
                            Control: Classic/Button
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Text: =""
                              Fill: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =2
                              BorderColor: =RGBA(0, 0, 0, 0)
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtFTEmptyTraitees:
                      Control: ModernText
                      Properties:
                        Text: ="Aucune demande traitée."
                        Size: =14
                        Color: =RGBA(144, 144, 144, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =ctxFTTab = "traitees" && GalleryTraitees.AllItemsCount = 0
                  - GalleryTransferees:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =With(
                              {_q: Trim(InpSearchFT.Text)},
                              Filter(
                                  AddColumns(
                                      RenameColumns(
                                          Distinct(
                                              FirstN(
                                                  SortByColumns(
                                                      Filter(Historique_Demandes, Service_A_Ce_Moment = UserServiceLabel),
                                                      "ID", SortOrder.Descending
                                                  ),
                                                  50
                                              ),
                                              Demande_ID
                                          ),
                                          Value, DemID
                                      ),
                                      DemandeRec, LookUp(Demandes, ID = Value(DemID))
                                  ),
                                  Not(IsBlank(DemandeRec)) && DemandeRec.Service_Actuel_ID.Value <> UserServiceLabel
                                      && (IsBlank(_q) || StartsWith(DemandeRec.Title, _q) || StartsWith(DemandeRec.Agent_Demandeur.DisplayName, _q))
                              )
                          )
                        Visible: =ctxFTTab = "transferees" && UserRole <> "Admin"
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =126
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                      Children:
                        - FTTransCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(255, 255, 255, 0.65)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =6
                              PaddingTop: =14
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - TxtFTTransTitle:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.DemandeRec.Title
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(112, 112, 112, 1)
                                    AutoHeight: =true
                                    Width: =Parent.Width - 36
                              - BadgeFTTransferee:
                                  Control: Badge
                                  Properties:
                                    Content: ="Transférée"
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    FillPortions: =0
                                    Width: =104
                                    Height: =26
                                    LayoutMinWidth: =104
                                    BasePaletteColor: =RGBA(229, 231, 235, 1)
                                    FontColor: =RGBA(75, 85, 99, 1)
                              - TxtFTTransNowAt:
                                  Control: ModernText
                                  Properties:
                                    Text: |-
                                      ="Actuellement : " & ThisItem.DemandeRec.Service_Actuel_ID.Value & "  ·  Statut : " & ThisItem.DemandeRec.Statut_Actuel.Value
                                    Size: =13
                                    Color: =RGBA(144, 144, 144, 1)
                                    AutoHeight: =true
                                    Width: =Parent.Width - 36
                        - BtnFTTransClick:
                            Control: Classic/Button
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Text: =""
                              Fill: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =2
                              BorderColor: =RGBA(0, 0, 0, 0)
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem.DemandeRec);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtFTEmptyTransferees:
                      Control: ModernText
                      Properties:
                        Text: ="Aucune demande transférée."
                        Size: =14
                        Color: =RGBA(144, 144, 144, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =ctxFTTab = "transferees" && UserRole <> "Admin" && GalleryTransferees.AllItemsCount = 0
      - BarFT:
