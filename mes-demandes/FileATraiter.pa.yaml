Screens:
  FileATraiter:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =UpdateContext({ctxFTTab: "atraiter"})
    Children:
      - FTScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(249, 250, 251, 1)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - FTHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =140
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  PaddingTop: =28
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - TxtFTBrand:
                      Control: ModernText
                      Properties:
                        Text: ="Assurances At-Takafulia · " & UserRole
                        Size: =12
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(107, 114, 128, 1)
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                  - TxtFTTitle:
                      Control: ModernText
                      Properties:
                        Text: ="File à traiter"
                        Size: =28
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(6, 95, 70, 1)
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                  - RectFTAccentBar:
                      Control: Rectangle
                      Properties:
                        FillPortions: =0
                        Width: =56
                        Height: =4
                        Fill: =RGBA(6, 95, 70, 1)
            - FTBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutGap: =10
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingBottom: =28
                Children:
                  - TabsRowFT:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =42
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =16
                      Children:
                        - TabATraiter:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Width: =92
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - TxtTabATraiter:
                                  Control: ModernText
                                  Properties:
                                    Text: ="À traiter"
                                    Size: =14
                                    FontWeight: =If(ctxFTTab = "atraiter", FontWeight.Semibold, FontWeight.Normal)
                                    Color: =If(ctxFTTab = "atraiter", RGBA(6, 95, 70, 1), RGBA(107, 114, 128, 1))
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    OnSelect: |-
                                      =UpdateContext({ctxFTTab: "atraiter"})
                              - RectTabATraiter:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Height: =3
                                    Fill: =If(ctxFTTab = "atraiter", RGBA(6, 95, 70, 1), RGBA(0, 0, 0, 0))
                        - TabTraitees:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Width: =84
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - TxtTabTraitees:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Traitées"
                                    Size: =14
                                    FontWeight: =If(ctxFTTab = "traitees", FontWeight.Semibold, FontWeight.Normal)
                                    Color: =If(ctxFTTab = "traitees", RGBA(6, 95, 70, 1), RGBA(107, 114, 128, 1))
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    OnSelect: |-
                                      =UpdateContext({ctxFTTab: "traitees"})
                              - RectTabTraitees:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Height: =3
                                    Fill: =If(ctxFTTab = "traitees", RGBA(6, 95, 70, 1), RGBA(0, 0, 0, 0))
                        - TabTransferees:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Width: =108
                              Fill: =RGBA(0, 0, 0, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                              Visible: =UserRole <> "Admin"
                            Children:
                              - TxtTabTransferees:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Transférées"
                                    Size: =14
                                    FontWeight: =If(ctxFTTab = "transferees", FontWeight.Semibold, FontWeight.Normal)
                                    Color: =If(ctxFTTab = "transferees", RGBA(6, 95, 70, 1), RGBA(107, 114, 128, 1))
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    OnSelect: |-
                                      =UpdateContext({ctxFTTab: "transferees"})
                              - RectTabTransferees:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Height: =3
                                    Fill: =If(ctxFTTab = "transferees", RGBA(6, 95, 70, 1), RGBA(0, 0, 0, 0))
                  - GalleryATraiter:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Visible: =ctxFTTab = "atraiter"
                        Items: |-
                          =If(
                              UserRole = "Admin",
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Statut_Actuel.Value = "Soumis"
                                          || Statut_Actuel.Value = "En cours"
                                          || Statut_Actuel.Value = "En attente élément"
                                          || Statut_Actuel.Value = "Transféré"
                                  ),
                                  "Date_Soumission", SortOrder.Ascending
                              ),
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Service_Actuel_ID.Value = UserServiceLabel
                                          && (Statut_Actuel.Value = "Soumis"
                                              || Statut_Actuel.Value = "En cours"
                                              || Statut_Actuel.Value = "En attente élément"
                                              || Statut_Actuel.Value = "Transféré")
                                  ),
                                  "Date_Soumission", SortOrder.Ascending
                              )
                          )
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =150
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(varSelectedDemande, ThisItem);
                          Navigate(DetailDemande, ScreenTransition.Fade)
                      Children:
                        - FTCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RectFTUrgencyStripe:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Width: =4
                                    Fill: =If(ThisItem.Niveau_Urgence.Value = "Urgent" || ThisItem.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(255, 255, 255, 0))
                              - FTContentContainer:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =6
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                  Children:
                                    - TxtFTCardTitle:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Title
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - BadgeFTStatut:
                                        Control: Badge
                                        Properties:
                                          Content: =ThisItem.Statut_Actuel.Value
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          FillPortions: =0
                                          Width: =96
                                          Height: =28
                                          LayoutMinWidth: =96
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(229, 231, 235, 1),
                                              "En cours", RGBA(219, 234, 254, 1),
                                              "En attente élément", RGBA(254, 243, 199, 1),
                                              "Transféré", RGBA(237, 233, 254, 1),
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          FontColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(55, 65, 81, 1),
                                              "En cours", RGBA(30, 64, 175, 1),
                                              "En attente élément", RGBA(146, 64, 14, 1),
                                              "Transféré", RGBA(91, 33, 182, 1),
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                    - TxtFTCardService:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Service : " & ThisItem.Service_Actuel_ID.Value & "  ·  Type : " & ThisItem.Type_Demande_ID.Value
                                          Size: =13
                                          Color: =RGBA(107, 114, 128, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTCardAgent:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Demandeur : " & ThisItem.Agent_Demandeur.DisplayName
                                          Size: =13
                                          Color: =RGBA(107, 114, 128, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTCardDate:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            =With(
                                              {
                                                _hrs: DateDiff(ThisItem.Date_Soumission, Now(), TimeUnit.Hours)
                                              },
                                              If(
                                                _hrs < 24,
                                                "soumise il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                With(
                                                  {_days: RoundDown(_hrs / 24, 0)},
                                                  "soumise il y a " & _days & If(_days = 1, " jour", " jours")
                                                )
                                              )
                                            )
                                          Size: =12
                                          Color: =RGBA(156, 163, 175, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                        - RectFTCardClick:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtFTEmptyATraiter:
                      Control: ModernText
                      Properties:
                        Text: ="Aucune demande à traiter."
                        Size: =14
                        Color: =RGBA(156, 163, 175, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =ctxFTTab = "atraiter" && GalleryATraiter.AllItemsCount = 0
                  - GalleryTraitees:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Visible: =ctxFTTab = "traitees"
                        Items: |-
                          =If(
                              UserRole = "Admin",
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Statut_Actuel.Value = "Validé"
                                          || Statut_Actuel.Value = "Rejeté"
                                          || Statut_Actuel.Value = "Clôturé"
                                  ),
                                  "Date_Dernier_Mouvement", SortOrder.Descending
                              ),
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Service_Actuel_ID.Value = UserServiceLabel
                                          && (Statut_Actuel.Value = "Validé"
                                              || Statut_Actuel.Value = "Rejeté"
                                              || Statut_Actuel.Value = "Clôturé")
                                  ),
                                  "Date_Dernier_Mouvement", SortOrder.Descending
                              )
                          )
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =150
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(varSelectedDemande, ThisItem);
                          Navigate(DetailDemande, ScreenTransition.Fade)
                      Children:
                        - FTTCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RectFTTUrgencyStripe:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Width: =4
                                    Fill: =If(ThisItem.Niveau_Urgence.Value = "Urgent" || ThisItem.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(255, 255, 255, 0))
                              - FTTContentContainer:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =6
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                  Children:
                                    - TxtFTTCardTitle:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Title
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - BadgeFTTStatut:
                                        Control: Badge
                                        Properties:
                                          Content: =ThisItem.Statut_Actuel.Value
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          FillPortions: =0
                                          Width: =96
                                          Height: =28
                                          LayoutMinWidth: =96
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          FontColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                    - TxtFTTCardService:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Service : " & ThisItem.Service_Actuel_ID.Value & "  ·  Type : " & ThisItem.Type_Demande_ID.Value
                                          Size: =13
                                          Color: =RGBA(107, 114, 128, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTTCardAgent:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Demandeur : " & ThisItem.Agent_Demandeur.DisplayName
                                          Size: =13
                                          Color: =RGBA(107, 114, 128, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtFTTCardDate:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            =If(
                                              IsBlank(ThisItem.Date_Dernier_Mouvement),
                                              "",
                                              "dernier traitement le " & Text(ThisItem.Date_Dernier_Mouvement, DateTimeFormat.ShortDateTime24)
                                            )
                                          Size: =12
                                          Color: =RGBA(156, 163, 175, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                        - RectFTTCardClick:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtFTEmptyTraitees:
                      Control: ModernText
                      Properties:
                        Text: ="Aucune demande traitée."
                        Size: =14
                        Color: =RGBA(156, 163, 175, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =ctxFTTab = "traitees" && GalleryTraitees.AllItemsCount = 0
                  - GalleryTransferees:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =Filter(
                              AddColumns(
                                  RenameColumns(
                                      Distinct(
                                          FirstN(
                                              SortByColumns(
                                                  Filter(Historique_Demandes, Service_A_Ce_Moment = UserServiceLabel),
                                                  "ID", SortOrder.Descending
                                              ),
                                              50
                                          ),
                                          Demande_ID
                                      ),
                                      Value, DemID
                                  ),
                                  DemandeRec, LookUp(Demandes, ID = Value(DemID))
                              ),
                              Not(IsBlank(DemandeRec)) && DemandeRec.Service_Actuel_ID.Value <> UserServiceLabel
                          )
                        Visible: =ctxFTTab = "transferees" && UserRole <> "Admin"
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =126
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(varSelectedDemande, ThisItem.DemandeRec);
                          Navigate(DetailDemande, ScreenTransition.Fade)
                      Children:
                        - FTTransCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(255, 255, 255, 0.65)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =6
                              PaddingTop: =14
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                            Children:
                              - TxtFTTransTitle:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.DemandeRec.Title
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(107, 114, 128, 1)
                                    AutoHeight: =true
                                    Width: =Parent.Width - 36
                              - BadgeFTTransferee:
                                  Control: Badge
                                  Properties:
                                    Content: ="Transférée"
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    FillPortions: =0
                                    Width: =104
                                    Height: =26
                                    LayoutMinWidth: =104
                                    BasePaletteColor: =RGBA(229, 231, 235, 1)
                                    FontColor: =RGBA(75, 85, 99, 1)
                              - TxtFTTransNowAt:
                                  Control: ModernText
                                  Properties:
                                    Text: |-
                                      ="Actuellement : " & ThisItem.DemandeRec.Service_Actuel_ID.Value & "  ·  Statut : " & ThisItem.DemandeRec.Statut_Actuel.Value
                                    Size: =13
                                    Color: =RGBA(156, 163, 175, 1)
                                    AutoHeight: =true
                                    Width: =Parent.Width - 36
                        - RectFTTransClick:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem.DemandeRec);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtFTEmptyTransferees:
                      Control: ModernText
                      Properties:
                        Text: ="Aucune demande transférée."
                        Size: =14
                        Color: =RGBA(156, 163, 175, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =ctxFTTab = "transferees" && UserRole <> "Admin" && GalleryTransferees.AllItemsCount = 0
