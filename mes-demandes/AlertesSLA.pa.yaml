Screens:
  AlertesSLA:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
    Children:
      - RailAS:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =AlertesSLA.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoAS:
                Control: Image
                Properties:
                  Height: =60
                  Image: =Logo
            - RectRailSepAS:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =16
            - NavASAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(140, 12, 20, 0.08)
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoASAccueil:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblASAccueil:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Accueil"
            - NavASMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoASMesDem:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblASMesDem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Mes demandes"
            - NavASNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoASNouvelle:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Width: =22
                  - LblASNouvelle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Nouvelle demande"
            - NavASFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoASFile:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Width: =22
                  - LblASFile:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Size: =14
                        Text: ="File à traiter"
            - NavASAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoASAlertes:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Clock"
                        IconColor: =RGBA(140, 12, 20, 1)
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Width: =22
                  - LblASAlertes:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Alertes SLA"
            - NavASStats:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoASStats:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="DataBarVertical"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Width: =22
                  - LblASStats:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Statistiques"
            - NavASAdmin:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Admin"
                Children:
                  - IcoASAdmin:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Settings"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(AdministrationTypesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblASAdmin:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(AdministrationTypesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Administration"
            - NavASNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoASNotifs:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Width: =22
                  - LblASNotifs:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Notifications"
                  - BdgASNotifs:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        Width: =30
            - RectRailSpacerAS:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
            - RectRailSeparatorAS:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
            - TxtRailUserAS:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(55, 65, 81, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =User().FullName
            - TxtRailRoleAS:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(112, 112, 112, 1)
                  Size: =12
                  Text: =UserRole
      - ASScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(AlertesSLA.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(AlertesSLA.Size = ScreenSize.Small, 0, RailAS.Width)
            X: =If(AlertesSLA.Size = ScreenSize.Small, 0, RailAS.Width)
          Children:
            - ASHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =104
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
                Children:
                  - ASTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0)
                        FillPortions: =0
                        Height: =42
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        Width: =Parent.Width - 56
                      Children:
                        - IconASBack:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour à la file à traiter"
                              Height: =28
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                              Width: =28
                        - TxtASTitle:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Size: =28
                              Text: ="Alertes SLA"
                        - IconNotifAS:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Ouvrir les notifications"
                              Height: =28
                              Icon: ="Alert"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                              Width: =28
                        - BadgeNotifAS:
                            Control: Badge
                            Properties:
                              Appearance: ='BadgeCanvas.Appearance'.Filled
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =22
                              Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                  - RectASAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - ASBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - TxtASSectionRetard:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        FontWeight: =FontWeight.Semibold
                        Size: =16
                        Text: ="En retard" & If(GalleryRetard.AllItemsCount > 0, " · " & GalleryRetard.AllItemsCount, "")
                        Width: =Parent.Width - 56
                  - GalleryRetard:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =If(
                              UserRole = "Admin",
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Alerte_Retard_Active = true
                                          && (Statut_Actuel.Value = "Soumis"
                                              || Statut_Actuel.Value = "En cours")
                                  ),
                                  "Date_Soumission", SortOrder.Ascending
                              ),
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Service_Actuel_ID.Value = UserServiceLabel
                                          && Alerte_Retard_Active = true
                                          && (Statut_Actuel.Value = "Soumis"
                                              || Statut_Actuel.Value = "En cours")
                                  ),
                                  "Date_Soumission", SortOrder.Ascending
                              )
                          )
                        TemplatePadding: =14
                        TemplateSize: =205
                        Width: =Parent.Width - 56
                      Children:
                        - ASRCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: |-
                                =If(
                                    IsBlank(ThisItem.Gestionnaire_Assigne.DisplayName),
                                    RGBA(254, 242, 242, 1),
                                    RGBA(255, 255, 255, 1)
                                )
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - RectASRStripe:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(220, 38, 38, 1)
                                    Width: =4
                              - ASRContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    PaddingBottom: =14
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                    PaddingTop: =14
                                  Children:
                                    - TxtASRTitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          FontWeight: =FontWeight.Bold
                                          Size: =16
                                          Text: =ThisItem.Titre
                                          Width: =Parent.Width - 36
                                    - BadgeASRStatut:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(229, 231, 235, 1),
                                              "En cours", RGBA(219, 234, 254, 1),
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          Content: =ThisItem.Statut_Actuel.Value
                                          FontColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(55, 65, 81, 1),
                                              "En cours", RGBA(30, 64, 175, 1),
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                          Height: =28
                                          LayoutMinWidth: =96
                                          Width: =96
                                    - TxtASRSvcType:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: |-
                                            ="Service : " & ThisItem.Service_Actuel_ID.Value & "  ·  Type : " & ThisItem.Type_Demande_ID.Value
                                          Width: =Parent.Width - 36
                                    - TxtASRDemandeur:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: |-
                                            ="Demandeur : " & ThisItem.Agent_Demandeur.DisplayName
                                          Width: =Parent.Width - 36
                                    - TxtASRGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: |-
                                            =If(
                                              IsBlank(ThisItem.Gestionnaire_Assigne.DisplayName),
                                              RGBA(220, 38, 38, 1), RGBA(112, 112, 112, 1)
                                            )
                                          FontWeight: |-
                                            =If(
                                              IsBlank(ThisItem.Gestionnaire_Assigne.DisplayName),
                                              FontWeight.Semibold, FontWeight.Normal
                                            )
                                          Size: =13
                                          Text: |-
                                            =If(
                                              IsBlank(ThisItem.Gestionnaire_Assigne.DisplayName),
                                              "⚠ Non assignée",
                                              "Gestionnaire : " & ThisItem.Gestionnaire_Assigne.DisplayName
                                            )
                                          Width: =Parent.Width - 36
                                    - TxtASRSoumission:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(144, 144, 144, 1)
                                          Size: =12
                                          Text: |-
                                            =If(
                                              IsBlank(ThisItem.Date_Soumission),
                                              "Date de soumission inconnue",
                                              "Soumise le " & Text(ThisItem.Date_Soumission, DateTimeFormat.ShortDateTime24) & " · " &
                                              With(
                                                {_hrs: DateDiff(ThisItem.Date_Soumission, Now(), TimeUnit.Hours)},
                                                If(
                                                  _hrs < 24,
                                                  "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                  With(
                                                    {_days: RoundDown(_hrs / 24, 0)},
                                                    "il y a " & _days & If(_days = 1, " jour", " jours")
                                                  )
                                                )
                                              )
                                            )
                                          Width: =Parent.Width - 36
                                    - TxtASRSLA:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(220, 38, 38, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: |-
                                            =With(
                                              {
                                                _sla: LookUp(Services_Siege, Title = ThisItem.Service_Actuel_ID.Value, SLA_Theorique_Heures),
                                                _hrs: If(IsBlank(ThisItem.Date_Soumission), Blank(), DateDiff(ThisItem.Date_Soumission, Now(), TimeUnit.Hours))
                                              },
                                              If(
                                                IsBlank(_sla) || IsBlank(_hrs),
                                                "",
                                                _hrs & "h écoulées / SLA " & _sla & "h"
                                              )
                                            )
                                          Width: =Parent.Width - 36
                        - BtnASRClick:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.TemplateHeight
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: =""
                              Width: =Parent.TemplateWidth
                  - TxtASEmptyRetard:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(6, 95, 70, 1)
                        Size: =14
                        Text: |-
                          ="Aucune demande en retard 🎉"
                        Visible: =GalleryRetard.AllItemsCount = 0
                        Width: =Parent.Width - 56
                  - TxtASSectionEcheance:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(217, 119, 6, 1)
                        FontWeight: =FontWeight.Semibold
                        Size: =16
                        Text: ="Échéance proche" & If(GalleryEcheance.AllItemsCount > 0, " · " & GalleryEcheance.AllItemsCount, "")
                        Width: =Parent.Width - 56
                  - GalleryEcheance:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =If(
                              UserRole = "Admin",
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Alerte_Echeance_Notifiee = true
                                          && Alerte_Retard_Active = false
                                          && (Statut_Actuel.Value = "Soumis"
                                              || Statut_Actuel.Value = "En cours")
                                  ),
                                  "Date_Soumission", SortOrder.Ascending
                              ),
                              SortByColumns(
                                  Filter(
                                      Demandes,
                                      Service_Actuel_ID.Value = UserServiceLabel
                                          && Alerte_Echeance_Notifiee = true
                                          && Alerte_Retard_Active = false
                                          && (Statut_Actuel.Value = "Soumis"
                                              || Statut_Actuel.Value = "En cours")
                                  ),
                                  "Date_Soumission", SortOrder.Ascending
                              )
                          )
                        TemplatePadding: =14
                        TemplateSize: =205
                        Width: =Parent.Width - 56
                      Children:
                        - ASECardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - RectASEStripe:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(217, 119, 6, 1)
                                    Width: =4
                              - ASEContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    PaddingBottom: =14
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                    PaddingTop: =14
                                  Children:
                                    - TxtASETitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          FontWeight: =FontWeight.Bold
                                          Size: =16
                                          Text: =ThisItem.Titre
                                          Width: =Parent.Width - 36
                                    - BadgeASEStatut:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(229, 231, 235, 1),
                                              "En cours", RGBA(219, 234, 254, 1),
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          Content: =ThisItem.Statut_Actuel.Value
                                          FontColor: |-
                                            =Switch(
