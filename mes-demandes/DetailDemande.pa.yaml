Screens:
  DetailDemande:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: =Set(varActionDialog, "")
    Children:
      - DetailScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(249, 250, 251, 1)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - DetailHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =150
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  PaddingTop: =24
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - BackRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =6
                      Children:
                        - IconBack:
                            Control: ModernIcon
                            Properties:
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Width: =28
                              Height: =28
                              AccessibleLabel: ="Retour"
                              OnSelect: =Back(ScreenTransition.Fade)
                        - TxtBack:
                            Control: ModernText
                            Properties:
                              Text: ="Retour"
                              Size: =14
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              AutoHeight: =true
                              OnSelect: =Back(ScreenTransition.Fade)
                  - TxtDetailTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Détail de la demande"
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(140, 12, 20, 1)
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                  - RectDetailAccentBar:
                      Control: Rectangle
                      Properties:
                        FillPortions: =0
                        Width: =56
                        Height: =4
                        Fill: =RGBA(140, 12, 20, 1)
            - MainColumns:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =If(DetailDemande.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingBottom: =28
                Children:
                  - MainColumn:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =If(DetailDemande.Size = ScreenSize.Small, 0, 2)
                        Height: |-
                          =166 + (5
                            + If(Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)), 1, 0)
                            + If(Not(IsBlank(varSelectedDemande.Date_Cloture)), 1, 0)
                          ) * 38
                          + If(
                              (UserRole = "Admin"
                                  || ((UserRole = "Gestionnaire" || UserRole = "Superviseur")
                                      && varSelectedDemande.Service_Actuel_ID.Value = UserServiceLabel))
                                  && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                      || varSelectedDemande.Statut_Actuel.Value = "En cours"),
                              If(
                                  IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                      && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                          || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                              && varSelectedDemande.Type_Modification.Value = "Transfert")),
                                  158, 112
                              ), 0
                          )
                          + If(
                              varSelectedDemande.Statut_Actuel.Value = "Validé"
                                  && (UserRole = "Admin"
                                      || (UserRole = "Agent" && varSelectedDemande.Agent_Demandeur.Email = User().Email)),
                              84, 0
                          )
                        Fill: =RGBA(249, 250, 251, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =16
                      Children:
                        - TitleCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =124
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =10
                              PaddingTop: =18
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - TxtDemandeTitle:
                                  Control: ModernText
                                  Properties:
                                    Text: =varSelectedDemande.Title
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(31, 41, 55, 1)
                                    AutoHeight: =true
                                    Width: =Parent.Width - 36
                              - BadgeStatutDetail:
                                  Control: Badge
                                  Properties:
                                    Content: =varSelectedDemande.Statut_Actuel.Value
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    FillPortions: =0
                                    Width: =96
                                    Height: =28
                                    LayoutMinWidth: =96
                                    BasePaletteColor: |-
                                      =Switch(
                                        varSelectedDemande.Statut_Actuel.Value,
                                        "Soumis", RGBA(229, 231, 235, 1),
                                        "En cours", RGBA(219, 234, 254, 1),
                                        "Validé", RGBA(209, 250, 229, 1),
                                        "Rejeté", RGBA(254, 226, 226, 1),
                                        "Clôturé", RGBA(219, 226, 254, 1),
                                        RGBA(229, 231, 235, 1)
                                      )
                                    FontColor: |-
                                      =Switch(
                                        varSelectedDemande.Statut_Actuel.Value,
                                        "Soumis", RGBA(55, 65, 81, 1),
                                        "En cours", RGBA(30, 64, 175, 1),
                                        "Validé", RGBA(6, 95, 70, 1),
                                        "Rejeté", RGBA(153, 27, 27, 1),
                                        "Clôturé", RGBA(30, 27, 120, 1),
                                        RGBA(55, 65, 81, 1)
                                      )
                        - InfoCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: |-
                                =26 + (5
                                  + If(Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)), 1, 0)
                                  + If(Not(IsBlank(varSelectedDemande.Date_Cloture)), 1, 0)
                                ) * 38
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =10
                              PaddingTop: =18
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RowAgent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblAgent:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Agent demandeur"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValAgent:
                                        Control: ModernText
                                        Properties:
                                          Text: =varSelectedDemande.Agent_Demandeur.DisplayName
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                              - RowDateSoumission:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblDateSoumission:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Date de soumission"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValDateSoumission:
                                        Control: ModernText
                                        Properties:
                                          Text: =Text(varSelectedDemande.Date_Soumission, DateTimeFormat.ShortDateTime24)
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                              - RowType:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblType:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Type de demande"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValType:
                                        Control: ModernText
                                        Properties:
                                          Text: =varSelectedDemande.Type_Demande_ID.Value
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                              - RowService:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblService:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Service actuel"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValService:
                                        Control: ModernText
                                        Properties:
                                          Text: =varSelectedDemande.Service_Actuel_ID.Value
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                              - RowUrgence:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblUrgence:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Niveau d'urgence"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValUrgence:
                                        Control: ModernText
                                        Properties:
                                          Text: =varSelectedDemande.Niveau_Urgence.Value
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =If(varSelectedDemande.Niveau_Urgence.Value = "Urgent" || varSelectedDemande.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(31, 41, 55, 1))
                                          FillPortions: =1
                              - RowGestionnaire:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    Visible: =Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName))
                                  Children:
                                    - TxtLblGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Gestionnaire assigné"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          Text: =varSelectedDemande.Gestionnaire_Assigne.DisplayName
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                              - RowDateCloture:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    Visible: =Not(IsBlank(varSelectedDemande.Date_Cloture))
                                  Children:
                                    - TxtLblDateCloture:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Date de clôture"
                                          Size: =13
                                          Color: =RGBA(112, 112, 112, 1)
                                          FillPortions: =0
                                          Width: =170
                                    - TxtValDateCloture:
                                        Control: ModernText
                                        Properties:
                                          Text: =Text(varSelectedDemande.Date_Cloture, DateTimeFormat.ShortDateTime24)
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                        - ActionsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: |-
                                =If(
                                    IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                        && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                            || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                && varSelectedDemande.Type_Modification.Value = "Transfert")),
                                    142, 96
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =6
                              PaddingTop: =14
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                              Visible: |-
                                =(UserRole = "Admin"
                                    || ((UserRole = "Gestionnaire" || UserRole = "Superviseur")
                                        && varSelectedDemande.Service_Actuel_ID.Value = UserServiceLabel))
                                    && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                        || varSelectedDemande.Statut_Actuel.Value = "En cours")
                            Children:
                              - TxtActionsLabel:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Actions"
                                    Size: =13
                                    Color: =RGBA(112, 112, 112, 1)
                                    FillPortions: =0
                                    AutoHeight: =true
                              - AssignRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                  Children:
                                    - BtnPrendreEnCharge:
                                        Control: ModernButton
                                        Properties:
                                          Text: ="Prendre en charge"
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(140, 12, 20, 1)
                                          FillPortions: =1
                                          Height: =40
                                          Visible: |-
                                            =IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                                && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                                    || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                        && varSelectedDemande.Type_Modification.Value = "Transfert"))
                                          OnSelect: =Set(varActionDialog, "prendre")
                                    - BtnAssignerGestionnaire:
                                        Control: ModernButton
                                        Properties:
                                          Text: ="Assigner à un gestionnaire"
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          FillPortions: =1
                                          Height: =40
                                          Visible: |-
                                            =(UserRole = "Superviseur" || UserRole = "Admin")
                                                && IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                                && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                                    || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                        && varSelectedDemande.Type_Modification.Value = "Transfert"))
                                          OnSelect: |-
                                            =Set(varActionDialog, "assigner");
                                            Reset(DdGestionnaireCible)
                              - ActionButtonsRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                  Children:
                                    - BtnValider:
                                        Control: ModernButton
                                        Properties:
                                          Text: ="Valider"
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(6, 95, 70, 1)
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: =Set(varActionDialog, "valider")
                                    - BtnRejeter:
                                        Control: ModernButton
                                        Properties:
                                          Text: ="Rejeter"
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(220, 38, 38, 1)
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: |-
                                            =Set(varActionDialog, "rejeter");
                                            Reset(InpMotifRejet)
                                    - BtnTransferer:
                                        Control: ModernButton
                                        Properties:
                                          Text: ="Transférer"
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          FillPortions: =1
                                          Height: =40
                                          DisplayMode: |-
                                            =If(
                                                varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                    && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)),
                                                DisplayMode.Edit,
                                                DisplayMode.Disabled
                                            )
                                          Tooltip: ="Transfert possible uniquement après prise en charge (statut En cours et gestionnaire assigné)"
                                          OnSelect: |-
                                            =Set(varActionDialog, "transferer");
                                            Reset(DdServiceCible)
                        - ClotureCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =68
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              PaddingTop: =14
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                              Visible: |-
                                =varSelectedDemande.Statut_Actuel.Value = "Validé"
                                    && (UserRole = "Admin"
                                        || (UserRole = "Agent" && varSelectedDemande.Agent_Demandeur.Email = User().Email))
                            Children:
                              - BtnCloturer:
                                  Control: ModernButton
                                  Properties:
                                    Text: ="Confirmer la réception"
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(6, 95, 70, 1)
                                    FillPortions: =0
                                    Height: =40
                                    OnSelect: =Set(varActionDialog, "cloturer")
                  - SideColumn:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        Fill: =RGBA(249, 250, 251, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =10
                      Children:
                        - TxtTimelineTitle:
                            Control: ModernText
                            Properties:
                              Text: ="Historique"
                              Size: =16
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(140, 12, 20, 1)
                              AutoHeight: =true
                              Width: =Parent.Width
                        - TimelineScroll:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              Fill: =RGBA(249, 250, 251, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutOverflowY: =LayoutOverflow.Scroll
                            Children:
                              - GalleryHistorique:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =SortByColumns(
                                        Filter(Historique_Demandes, Demande_ID = Text(varSelectedDemande.ID)),
                                        "Num_Mouvement",
                                        SortOrder.Ascending
                                      )
                                    FillPortions: =0
                                    Width: =Parent.Width
                                    Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                                    WrapCount: =1
                                    TemplateSize: =140
                                    TemplatePadding: =12
                                    Fill: =RGBA(0, 0, 0, 0)
                                    TemplateFill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - TLCardContainer:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight
                                          Fill: =RGBA(255, 255, 255, 1)
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          DropShadow: =DropShadow.Semilight
                                        Children:
                                          - TLDotColumn:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                FillPortions: =0
                                                Width: =32
                                                Fill: =RGBA(0, 0, 0, 0)
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                PaddingTop: =20
                                              Children:
                                                - TLDot:
                                                    Control: Circle
                                                    Properties:
                                                      FillPortions: =0
                                                      Width: =10
                                                      Height: =10
                                                      Fill: =RGBA(140, 12, 20, 1)
                                          - TLContentContainer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                FillPortions: =1
                                                Fill: =RGBA(0, 0, 0, 0)
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Start
                                                LayoutGap: =4
                                                PaddingTop: =16
                                                PaddingBottom: =16
                                                PaddingLeft: =4
                                                PaddingRight: =18
                                              Children:
                                                - TxtTLType:
                                                    Control: ModernText
                                                    Properties:
                                                      Text: =ThisItem.Type_Modification.Value
                                                      Size: =14
                                                      FontWeight: =FontWeight.Bold
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      AutoHeight: =true
                                                      Width: =Parent.Width - 54
                                                - TxtTLStatut:
                                                    Control: ModernText
                                                    Properties:
                                                      Text: |-
                                                        ="Statut : " & ThisItem.Statut_A_Ce_Moment
                                                      Size: =13
                                                      Color: =RGBA(112, 112, 112, 1)
                                                      AutoHeight: =true
                                                      Width: =Parent.Width - 54
                                                - TxtTLComment:
                                                    Control: ModernText
                                                    Properties:
                                                      Text: =ThisItem.Commentaire_Action
                                                      Size: =13
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      AutoHeight: =true
                                                      Width: =Parent.Width - 54
                                                      Visible: =Not(IsBlank(ThisItem.Commentaire_Action))
                                                - TxtTLMeta:
                                                    Control: ModernText
                                                    Properties:
                                                      Text: |-
                                                        ="Par " & ThisItem.Actionneur.DisplayName & "  ·  " & With(
                                                          {
                                                            _hrs: DateDiff(ThisItem.Date_Debut_Etape, Now(), TimeUnit.Hours)
                                                          },
                                                          If(
                                                            _hrs < 24,
                                                            "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                            With(
                                                              {_days: RoundDown(_hrs / 24, 0)},
                                                              "il y a " & _days & If(_days = 1, " jour", " jours")
                                                            )
                                                          )
                                                        )
                                                      Size: =12
                                                      Color: =RGBA(144, 144, 144, 1)
                                                      AutoHeight: =true
                                                      Width: =Parent.Width - 54
                              - TxtEmptyTimeline:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Aucun historique pour cette demande."
                                    Size: =14
                                    Color: =RGBA(144, 144, 144, 1)
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Width: =Parent.Width
                                    Visible: =GalleryHistorique.AllItemsCount = 0
      - DialogOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =Not(IsBlank(varActionDialog))
          Children:
            - RectDialogScrim:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                  Fill: =RGBA(17, 24, 39, 0.45)
                  BorderThickness: =0
                  OnSelect: =Set(varActionDialog, "")
            - DialogCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =If(DetailDemande.Size = ScreenSize.Small, Parent.Width - 40, 440)
                  Height: |-
                    =Switch(
                        varActionDialog,
                        "rejeter", 330,
                        "transferer", 280,
                        "assigner", 280,
                        210
                    )
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  DropShadow: =DropShadow.Regular
                Children:
                  - TxtDialogTitle:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =Switch(
                              varActionDialog,
                              "prendre", "Prendre en charge ?",
                              "valider", "Confirmer la validation ?",
                              "rejeter", "Rejeter la demande",
                              "transferer", "Transférer la demande",
                              "assigner", "Assigner à un gestionnaire",
                              "cloturer", "Confirmer la réception ?",
                              ""
                          )
                        Size: =17
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(31, 41, 55, 1)
                        FillPortions: =0
                        AutoHeight: =true
                  - TxtDialogBody:
                      Control: ModernText
                      Properties:
                        Text: |-
                          ="« " & varSelectedDemande.Title & " » — " & Switch(
                              varActionDialog,
                              "prendre", "vous serez assigné comme gestionnaire de cette demande.",
                              "valider", "la demande passera au statut Validé.",
                              "rejeter", "indiquez le motif du rejet (obligatoire).",
                              "transferer", "choisissez le service destinataire.",
                              "assigner", "choisissez le gestionnaire à qui l'assigner.",
                              "cloturer", "vous confirmez la bonne réception ; la demande sera clôturée.",
                              ""
                          )
                        Size: =13
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        AutoHeight: =true
                  - InpMotifRejet:
                      Control: ModernTextInput
                      Properties:
                        FillPortions: =0
                        Height: =96
                        Type: =TextInputType.Multiline
                        Placeholder: ="Motif du rejet…"
                        AccessibleLabel: ="Motif du rejet (obligatoire)"
                        Visible: =varActionDialog = "rejeter"
                  - DdServiceCible:
                      Control: ModernDropdown
                      Properties:
                        FillPortions: =0
                        Height: =40
                        Items: =Filter(Services_Siege, Title <> varSelectedDemande.Service_Actuel_ID.Value)
                        ItemDisplayText: =ThisItem.Title
                        AccessibleLabel: ="Service destinataire du transfert"
                        Visible: =varActionDialog = "transferer"
                  - DdGestionnaireCible:
                      Control: ModernDropdown
                      Properties:
                        FillPortions: =0
                        Height: =40
                        Items: |-
                          =Filter(
                              Membres_Services,
                              Role.Value = "Gestionnaire"
                                  && Service_ID.Id = LookUp(Services_Siege, Title = varSelectedDemande.Service_Actuel_ID.Value, ID)
                          )
                        ItemDisplayText: =ThisItem.Utilisateur.DisplayName
                        AccessibleLabel: ="Gestionnaire destinataire de l'assignation"
                        Visible: =varActionDialog = "assigner"
                  - DialogButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutGap: =10
                      Children:
                        - BtnDialogAnnuler:
                            Control: ModernButton
                            Properties:
                              Text: ="Annuler"
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              FillPortions: =0
                              Width: =120
                              Height: =40
                              OnSelect: =Set(varActionDialog, "")
                        - BtnDialogConfirmer:
                            Control: ModernButton
                            Properties:
                              Text: ="Confirmer"
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: |-
                                =Switch(
                                    varActionDialog,
                                    "rejeter", RGBA(220, 38, 38, 1),
                                    "valider", RGBA(6, 95, 70, 1),
                                    "cloturer", RGBA(6, 95, 70, 1),
                                    RGBA(140, 12, 20, 1)
                                )
                              FillPortions: =0
                              Width: =140
                              Height: =40
                              DisplayMode: |-
                                =If(
                                    (varActionDialog = "rejeter" && IsBlank(Trim(InpMotifRejet.Text)))
                                        || (varActionDialog = "transferer" && IsBlank(DdServiceCible.Selected.ID))
                                        || (varActionDialog = "assigner" && IsBlank(DdGestionnaireCible.Selected.ID)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              OnSelect: |-
                                =Switch(
                                    varActionDialog,
                                    "prendre",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {
                                            Gestionnaire_Assigne: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                DisplayName: User().FullName,
                                                Email: User().Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                            }
                                        }),
                                        Notify("Échec de la prise en charge : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande prise en charge — le statut se met à jour dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "valider",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Validé"}}),
                                        Notify("Échec de la validation : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande validée.", NotificationType.Success)
                                    ),
                                    "rejeter",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Rejeté"}, Motif_Rejet: Trim(InpMotifRejet.Text)}),
                                        Notify("Échec du rejet : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande rejetée.", NotificationType.Success)
                                    ),
                                    "transferer",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Service_Actuel_ID: {Id: DdServiceCible.Selected.ID, Value: DdServiceCible.Selected.Title}}),
                                        Notify("Échec du transfert : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande transférée.", NotificationType.Success)
                                    ),
                                    "assigner",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {
                                            Gestionnaire_Assigne: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & Lower(DdGestionnaireCible.Selected.Utilisateur.Email),
                                                DisplayName: DdGestionnaireCible.Selected.Utilisateur.DisplayName,
                                                Email: DdGestionnaireCible.Selected.Utilisateur.Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                            }
                                        }),
                                        Notify("Échec de l'assignation : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande assignée — le statut se met à jour dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "cloturer",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Clôturé"}}),
                                        Notify("Échec de la clôture : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Réception confirmée, demande clôturée.", NotificationType.Success)
                                    )
                                )
