                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    Visible: |-
                                      =varSelectedDemande.Statut_Actuel.Value = "En cours"
                                        && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName))
                                        && Coalesce(TypeRulesActuelles.Complement_Autorise, true)
                                  Children:
                                    - BtnDemanderComplement:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          BasePaletteColor: =RGBA(217, 119, 6, 1)
                                          DisplayMode: =If(varPolling, DisplayMode.Disabled, DisplayMode.Edit)
                                          FillPortions: =1
                                          Height: =40
                                          Icon: ="Clock"
                                          OnSelect: |-
                                            =Set(varActionDialog, "complement");
                                            Reset(TxtDemandeComplement)
