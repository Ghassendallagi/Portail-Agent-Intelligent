Screens:
  DetailDemande:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varActionDialog, "");
        Set(varPolling, false);
        Set(varPollCount, 0);
        Set(varPollMode, "")
    Children:
      - DetailScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - DetailHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - BackRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                      Children:
                        - IconBack:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour"
                              Height: =28
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Back(ScreenTransition.Fade)
                              Width: =28
                        - TxtBack:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Back(ScreenTransition.Fade)
                              Size: =14
                              Text: ="Retour"
                  - TxtDetailTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =24
                        Text: ="Détail de la demande"
                        Width: =Parent.Width - 56
                  - RectDetailAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - MainColumns:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(DetailDemande.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =20
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - MainColumn:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(249, 250, 251, 1)
                        FillPortions: =If(DetailDemande.Size = ScreenSize.Small, 0, 2)
                        Height: |-
                          =166 + (5
                            + If(Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)), 1, 0)
                            + If(Not(IsBlank(varSelectedDemande.Date_Cloture)), 1, 0)
                          ) * 38
                          + 122
                          + If(
                              (UserRole = "Admin"
                                  || ((UserRole = "Gestionnaire" || UserRole = "Superviseur")
                                      && varSelectedDemande.Service_Actuel_ID.Value = UserServiceLabel))
                                  && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                      || varSelectedDemande.Statut_Actuel.Value = "En cours"),
                              62
                                  + If(
                                      IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                        && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                            || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                && varSelectedDemande.Type_Modification.Value = "Transfert")),
                                      46, 0
                                  )
                                  + If(
                                      varSelectedDemande.Statut_Actuel.Value = "En cours"
                                        && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)),
                                      46, 0
                                  )
                                  + If(
                                      varSelectedDemande.Statut_Actuel.Value = "En cours"
                                        && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)),
                                      46, 0
                                  ), 0
                          )
                          + If(
                              varSelectedDemande.Statut_Actuel.Value = "Validé"
                                  && (UserRole = "Admin"
                                      || (UserRole = "Agent" && varSelectedDemande.Agent_Demandeur.Email = User().Email)),
                              84, 0
                          )
                          + 236
                          + 228
                          + If(
                              varSelectedDemande.Statut_Actuel.Value = "En attente complément"
                                  && UserRole = "Agent"
                                  && varSelectedDemande.Agent_Demandeur.Email = User().Email,
                              254, 0
                          )
                          + If(
                              varSelectedDemande.Deadline_Metier_Active = true
                                  && Not(IsBlank(varSelectedDemande.Deadline_Metier)),
                              158, 0
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - TitleCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =124
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - TxtDemandeTitle:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 41, 55, 1)
                                    FontWeight: =FontWeight.Bold
                                    Size: =18
                                    Text: =varSelectedDemande.Titre
                                    Width: =Parent.Width - 36
                              - BadgesRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - BadgeStatutDetail:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =Switch(
                                              varSelectedDemande.Statut_Actuel.Value,
                                              "Soumis", RGBA(229, 231, 235, 1),
                                              "En cours", RGBA(219, 234, 254, 1),
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          Content: =varSelectedDemande.Statut_Actuel.Value
                                          FontColor: |-
                                            =Switch(
                                              varSelectedDemande.Statut_Actuel.Value,
                                              "Soumis", RGBA(55, 65, 81, 1),
                                              "En cours", RGBA(30, 64, 175, 1),
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                          Height: =28
                                          LayoutMinWidth: =96
                                          Width: =96
                                    - BadgeValideDG:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Filled
                                          BasePaletteColor: =RGBA(21, 128, 61, 1)
                                          Content: ="Validé par la Direction Générale"
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =28
                                          LayoutMinWidth: =Len("Validé par la Direction Générale") * 8 + 32
                                          Visible: |-
                                            =varSelectedDemande.Statut_Actuel.Value = "Validé"
                                              && varSelectedDemande.Service_Actuel_ID.Value = "Direction Generale"
                                          Width: =Len("Validé par la Direction Générale") * 8 + 32
                        - InfoCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =26 + (5
                                  + If(Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)), 1, 0)
                                  + If(Not(IsBlank(varSelectedDemande.Date_Cloture)), 1, 0)
                                ) * 38
                                + 122
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - RowAgent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblAgent:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Agent demandeur"
                                          Width: =170
                                    - TxtValAgent:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Agent_Demandeur.DisplayName
                              - RowDateSoumission:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblDateSoumission:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Date de soumission"
                                          Width: =170
                                    - TxtValDateSoumission:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =Text(varSelectedDemande.Date_Soumission, DateTimeFormat.ShortDateTime24)
                              - RowType:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblType:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Type de demande"
                                          Width: =170
                                    - TxtValType:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Type_Demande_ID.Value
                              - RowDescription:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =112
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblDescription:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Description"
                                          Width: =170
                                    - TxtValDescription:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =If(IsBlank(varSelectedDemande.Description), "Aucune description", varSelectedDemande.Description)
                              - RowService:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblService:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Service actuel"
                                          Width: =170
                                    - TxtValService:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Service_Actuel_ID.Value
                              - RowUrgence:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblUrgence:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Niveau d'urgence"
                                          Width: =170
                                    - TxtValUrgence:
                                        Control: ModernText
                                        Properties:
                                          Color: =If(varSelectedDemande.Niveau_Urgence.Value = "Urgent" || varSelectedDemande.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(31, 41, 55, 1))
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Niveau_Urgence.Value
                              - RowGestionnaire:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName))
                                  Children:
                                    - TxtLblGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Gestionnaire assigné"
                                          Width: =170
                                    - TxtValGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Gestionnaire_Assigne.DisplayName
                              - RowDateCloture:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =Not(IsBlank(varSelectedDemande.Date_Cloture))
                                  Children:
                                    - TxtLblDateCloture:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Date de clôture"
                                          Width: =170
                                    - TxtValDateCloture:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =Text(varSelectedDemande.Date_Cloture, DateTimeFormat.ShortDateTime24)
                        - AICard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =212
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - AIHeaderRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =24
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - IconAI:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: ="Prédictions IA"
                                          Height: =24
                                          Icon: ="Sparkle"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          Width: =24
                                    - TxtAITitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(140, 12, 20, 1)
                                          FontWeight: =FontWeight.Bold
                                          Size: =16
                                          Text: ="Prédictions IA"
                                          Width: =Parent.Width - 64
                              - AIProfilRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtAIProfilLbl:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Profil agent"
                                          Width: =170
                                    - BadgeAIProfil:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =Switch(
                                                LookUp(Agents, Email_Agent = varSelectedDemande.Agent_Demandeur.Email, Profil_Comportemental_ML).Value,
                                                "Autonome", RGBA(209, 250, 229, 1),
                                                "Récurrent", RGBA(219, 234, 254, 1),
                                                "À accompagner", RGBA(254, 235, 200, 1),
                                                "Critique", RGBA(254, 226, 226, 1),
                                                RGBA(229, 231, 235, 1)
                                            )
                                          Content: |-
                                            =With(
                                                {_p: LookUp(Agents, Email_Agent = varSelectedDemande.Agent_Demandeur.Email, Profil_Comportemental_ML).Value},
                                                If(IsBlank(_p), "En attente d'analyse", _p)
                                            )
                                          FontColor: |-
                                            =Switch(
                                                LookUp(Agents, Email_Agent = varSelectedDemande.Agent_Demandeur.Email, Profil_Comportemental_ML).Value,
                                                "Autonome", RGBA(6, 95, 70, 1),
                                                "Récurrent", RGBA(30, 64, 175, 1),
                                                "À accompagner", RGBA(180, 83, 9, 1),
                                                "Critique", RGBA(153, 27, 27, 1),
                                                RGBA(55, 65, 81, 1)
                                            )
                                          Height: =24
                                          LayoutMinWidth: =170
                                          Width: =170
                              - AIDelaiRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtAIDelaiLbl:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Délai estimé"
                                          Width: =170
                                    - TxtAIDelaiVal:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =If(IsBlank(varSelectedDemande.Prediction_Delai_ML), RGBA(144, 144, 144, 1), RGBA(31, 41, 55, 1))
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: |-
                                            =If(
                                                IsBlank(varSelectedDemande.Prediction_Delai_ML),
                                                "En attente d'analyse",
                                                If(
                                                    varSelectedDemande.Prediction_Delai_ML < 48,
                                                    Round(varSelectedDemande.Prediction_Delai_ML, 0) & " h",
                                                    With(
                                                        {_j: Round(varSelectedDemande.Prediction_Delai_ML / 24, 1)},
                                                        If(_j = RoundDown(_j, 0), Text(_j, "0"), Text(_j, "0.0")) & " jours"
                                                    )
                                                )
                                            )
                                    - BadgeAIDelai:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =If(
                                                varSelectedDemande.Prediction_Delai_ML < 24, RGBA(209, 250, 229, 1),
                                                If(varSelectedDemande.Prediction_Delai_ML < 72, RGBA(219, 234, 254, 1), RGBA(254, 235, 200, 1))
                                            )
                                          Content: |-
                                            =If(
                                                varSelectedDemande.Prediction_Delai_ML < 24, "Rapide",
                                                If(varSelectedDemande.Prediction_Delai_ML < 72, "Normal", "Long")
                                            )
                                          FontColor: |-
                                            =If(
                                                varSelectedDemande.Prediction_Delai_ML < 24, RGBA(6, 95, 70, 1),
                                                If(varSelectedDemande.Prediction_Delai_ML < 72, RGBA(30, 64, 175, 1), RGBA(180, 83, 9, 1))
                                            )
                                          Height: =24
                                          LayoutMinWidth: =84
                                          Visible: =Not(IsBlank(varSelectedDemande.Prediction_Delai_ML))
                                          Width: =84
                              - AIRisqueRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtAIRisqueLbl:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Risque de retard"
                                          Width: =170
                                    - TxtAIRisqueAttente:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(144, 144, 144, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="En attente d'analyse"
                                          Visible: =IsBlank(varSelectedDemande.Probabilite_Retard_ML)
                                    - BadgeAIRisque:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =If(
                                                varSelectedDemande.Probabilite_Retard_ML < 0.3, RGBA(209, 250, 229, 1),
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.7, RGBA(254, 235, 200, 1), RGBA(254, 226, 226, 1))
                                            )
                                          Content: |-
                                            =If(
                                                varSelectedDemande.Probabilite_Retard_ML < 0.3, "Faible risque",
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.7, "Risque modéré", "Risque élevé")
                                            )
                                          FontColor: |-
                                            =If(
                                                varSelectedDemande.Probabilite_Retard_ML < 0.3, RGBA(6, 95, 70, 1),
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.7, RGBA(180, 83, 9, 1), RGBA(153, 27, 27, 1))
                                            )
                                          Height: =24
                                          LayoutMinWidth: =120
                                          Visible: =Not(IsBlank(varSelectedDemande.Probabilite_Retard_ML))
                                          Width: =120
                                    - TxtAIRisquePct:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: |-
                                            =If(
                                                varSelectedDemande.Probabilite_Retard_ML < 0.3, RGBA(21, 128, 61, 1),
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.7, RGBA(180, 83, 9, 1), RGBA(220, 38, 38, 1))
                                            )
                                          FontWeight: =FontWeight.Bold
                                          Size: =13
                                          Text: =Text(varSelectedDemande.Probabilite_Retard_ML * 100, "0") & " %"
                                          Visible: =Not(IsBlank(varSelectedDemande.Probabilite_Retard_ML))
                                          Width: =60
                              - AIGaugeTrack:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(229, 231, 235, 1)
                                    FillPortions: =0
                                    Height: =8
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    Width: =Parent.Width - 36
                                  Children:
                                    - AIGaugeFill:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: |-
                                            =If(
                                                IsBlank(varSelectedDemande.Probabilite_Retard_ML), RGBA(144, 144, 144, 1),
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.3, RGBA(21, 128, 61, 1),
                                                   If(varSelectedDemande.Probabilite_Retard_ML < 0.7, RGBA(180, 83, 9, 1), RGBA(220, 38, 38, 1)))
                                            )
                                          FillPortions: =0
