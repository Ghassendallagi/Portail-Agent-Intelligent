Screens:
  DetailDemande:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: =Set(varActionDialog, "")
    Children:
      - DetailScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - DetailHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - BackRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                      Children:
                        - IconBack:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour"
                              Height: =28
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Back(ScreenTransition.Fade)
                              Width: =28
                        - TxtBack:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Back(ScreenTransition.Fade)
                              Size: =14
                              Text: ="Retour"
                  - TxtDetailTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =24
                        Text: ="Détail de la demande"
                        Width: =Parent.Width - 56
                  - RectDetailAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - MainColumns:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(DetailDemande.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =20
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - MainColumn:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(249, 250, 251, 1)
                        FillPortions: =If(DetailDemande.Size = ScreenSize.Small, 0, 2)
                        Height: |-
                          =166 + (8
                            + If(Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)), 1, 0)
                            + If(Not(IsBlank(varSelectedDemande.Date_Cloture)), 1, 0)
                          ) * 38
                          + 122
                          + If(
                              (UserRole = "Admin"
                                  || ((UserRole = "Gestionnaire" || UserRole = "Superviseur")
                                      && varSelectedDemande.Service_Actuel_ID.Value = UserServiceLabel))
                                  && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                      || varSelectedDemande.Statut_Actuel.Value = "En cours"),
                              If(
                                  IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                      && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                          || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                              && varSelectedDemande.Type_Modification.Value = "Transfert")),
                                  158, 112
                              ), 0
                          )
                          + If(
                              varSelectedDemande.Statut_Actuel.Value = "Validé"
                                  && (UserRole = "Admin"
                                      || (UserRole = "Agent" && varSelectedDemande.Agent_Demandeur.Email = User().Email)),
                              84, 0
                          )
                          + 236
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                      Children:
                        - TitleCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =124
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - TxtDemandeTitle:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 41, 55, 1)
                                    FontWeight: =FontWeight.Bold
                                    Size: =18
                                    Text: =varSelectedDemande.Title
                                    Width: =Parent.Width - 36
                              - BadgeStatutDetail:
                                  Control: Badge
                                  Properties:
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    BasePaletteColor: |-
                                      =Switch(
                                        varSelectedDemande.Statut_Actuel.Value,
                                        "Soumis", RGBA(229, 231, 235, 1),
                                        "En cours", RGBA(219, 234, 254, 1),
                                        "Validé", RGBA(209, 250, 229, 1),
                                        "Rejeté", RGBA(254, 226, 226, 1),
                                        "Clôturé", RGBA(219, 226, 254, 1),
                                        RGBA(229, 231, 235, 1)
                                      )
                                    Content: =varSelectedDemande.Statut_Actuel.Value
                                    FontColor: |-
                                      =Switch(
                                        varSelectedDemande.Statut_Actuel.Value,
                                        "Soumis", RGBA(55, 65, 81, 1),
                                        "En cours", RGBA(30, 64, 175, 1),
                                        "Validé", RGBA(6, 95, 70, 1),
                                        "Rejeté", RGBA(153, 27, 27, 1),
                                        "Clôturé", RGBA(30, 27, 120, 1),
                                        RGBA(55, 65, 81, 1)
                                      )
                                    Height: =28
                                    LayoutMinWidth: =96
                                    Width: =96
                        - InfoCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =26 + (8
                                  + If(Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)), 1, 0)
                                  + If(Not(IsBlank(varSelectedDemande.Date_Cloture)), 1, 0)
                                ) * 38
                                + 122
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - RowAgent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblAgent:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Agent demandeur"
                                          Width: =170
                                    - TxtValAgent:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Agent_Demandeur.DisplayName
                              - RowProfilAgent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblProfilAgent:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Profil agent (IA)"
                                          Width: =170
                                    - TxtValProfilAgent:
                                        Control: ModernText
                                        Properties:
                                          Color: |-
                                            =Switch(
                                                LookUp(Agents, Email_Agent = varSelectedDemande.Agent_Demandeur.Email, Profil_Comportemental_ML).Value,
                                                "Autonome", RGBA(21, 128, 61, 1),
                                                "Récurrent", RGBA(21, 128, 61, 1),
                                                "À accompagner", RGBA(180, 83, 9, 1),
                                                "Critique", RGBA(220, 38, 38, 1),
                                                RGBA(144, 144, 144, 1)
                                            )
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: |-
                                            =If(
                                                IsBlank(LookUp(Agents, Email_Agent = varSelectedDemande.Agent_Demandeur.Email, Profil_Comportemental_ML).Value),
                                                "Non calculé",
                                                LookUp(Agents, Email_Agent = varSelectedDemande.Agent_Demandeur.Email, Profil_Comportemental_ML).Value
                                            )
                              - RowDateSoumission:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblDateSoumission:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Date de soumission"
                                          Width: =170
                                    - TxtValDateSoumission:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =Text(varSelectedDemande.Date_Soumission, DateTimeFormat.ShortDateTime24)
                              - RowType:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblType:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Type de demande"
                                          Width: =170
                                    - TxtValType:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Type_Demande_ID.Value
                              - RowDescription:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =112
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblDescription:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Description"
                                          Width: =170
                                    - TxtValDescription:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =If(IsBlank(varSelectedDemande.Description), "Aucune description", varSelectedDemande.Description)
                              - RowService:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblService:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Service actuel"
                                          Width: =170
                                    - TxtValService:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Service_Actuel_ID.Value
                              - RowUrgence:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblUrgence:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Niveau d'urgence"
                                          Width: =170
                                    - TxtValUrgence:
                                        Control: ModernText
                                        Properties:
                                          Color: =If(varSelectedDemande.Niveau_Urgence.Value = "Urgent" || varSelectedDemande.Niveau_Urgence.Value = "Critique", RGBA(220, 38, 38, 1), RGBA(31, 41, 55, 1))
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Niveau_Urgence.Value
                              - RowPredictionML:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblPredictionML:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Délai prédit (IA)"
                                          Width: =170
                                    - TxtValPredictionML:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: |-
                                            =If(
                                                IsBlank(varSelectedDemande.Prediction_Delai_ML),
                                                "Non disponible",
                                                Text(varSelectedDemande.Prediction_Delai_ML, "0.0") & "h · " &
                                                If(varSelectedDemande.Prediction_Delai_ML < 24, "Rapide",
                                                   If(varSelectedDemande.Prediction_Delai_ML < 72, "Normal",
                                                      "Long"))
                                            )
                              - RowRisqueRetard:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - TxtLblRisqueRetard:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Risque de retard (IA)"
                                          Width: =170
                                    - TxtValRisqueRetard:
                                        Control: ModernText
                                        Properties:
                                          Color: |-
                                            =If(
                                                IsBlank(varSelectedDemande.Probabilite_Retard_ML),
                                                RGBA(144, 144, 144, 1),
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.3,
                                                   RGBA(21, 128, 61, 1),
                                                   If(varSelectedDemande.Probabilite_Retard_ML < 0.6,
                                                      RGBA(180, 83, 9, 1),
                                                      RGBA(220, 38, 38, 1)))
                                            )
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: |-
                                            =If(
                                                IsBlank(varSelectedDemande.Probabilite_Retard_ML),
                                                "Non disponible",
                                                Text(varSelectedDemande.Probabilite_Retard_ML * 100, "0") & "% · " &
                                                If(varSelectedDemande.Probabilite_Retard_ML < 0.3, "Faible",
                                                   If(varSelectedDemande.Probabilite_Retard_ML < 0.6, "Modéré",
                                                      "Élevé"))
                                            )
                              - RowGestionnaire:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName))
                                  Children:
                                    - TxtLblGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Gestionnaire assigné"
                                          Width: =170
                                    - TxtValGestionnaire:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =varSelectedDemande.Gestionnaire_Assigne.DisplayName
                              - RowDateCloture:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =Not(IsBlank(varSelectedDemande.Date_Cloture))
                                  Children:
                                    - TxtLblDateCloture:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =13
                                          Text: ="Date de clôture"
                                          Width: =170
                                    - TxtValDateCloture:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: =Text(varSelectedDemande.Date_Cloture, DateTimeFormat.ShortDateTime24)
                        - ActionsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                        && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                            || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                && varSelectedDemande.Type_Modification.Value = "Transfert")),
                                    142, 96
                                )
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: |-
                                =(UserRole = "Admin"
                                    || ((UserRole = "Gestionnaire" || UserRole = "Superviseur")
                                        && varSelectedDemande.Service_Actuel_ID.Value = UserServiceLabel))
                                    && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                        || varSelectedDemande.Statut_Actuel.Value = "En cours")
                            Children:
                              - TxtActionsLabel:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    Size: =13
                                    Text: ="Actions"
                              - AssignRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                  Children:
                                    - BtnPrendreEnCharge:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(140, 12, 20, 1)
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: =Set(varActionDialog, "prendre")
                                          Text: ="Prendre en charge"
                                          Visible: |-
                                            =IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                                && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                                    || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                        && varSelectedDemande.Type_Modification.Value = "Transfert"))
                                    - BtnAssignerGestionnaire:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: |-
                                            =Set(varActionDialog, "assigner");
                                            Reset(DdGestionnaireCible)
                                          Text: ="Assigner à un gestionnaire"
                                          Visible: |-
                                            =(UserRole = "Superviseur" || UserRole = "Admin")
                                                && IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)
                                                && (varSelectedDemande.Statut_Actuel.Value = "Soumis"
                                                    || (varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                        && varSelectedDemande.Type_Modification.Value = "Transfert"))
                              - ActionButtonsRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                  Children:
                                    - BtnValider:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(6, 95, 70, 1)
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: =Set(varActionDialog, "valider")
                                          Text: ="Valider"
                                    - BtnRejeter:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(220, 38, 38, 1)
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: |-
                                            =Set(varActionDialog, "rejeter");
                                            Reset(InpMotifRejet)
                                          Text: ="Rejeter"
                                    - BtnTransferer:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          DisplayMode: |-
                                            =If(
                                                varSelectedDemande.Statut_Actuel.Value = "En cours"
                                                    && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)),
                                                DisplayMode.Edit,
                                                DisplayMode.Disabled
                                            )
                                          FillPortions: =1
                                          Height: =40
                                          OnSelect: |-
                                            =Set(varActionDialog, "transferer");
                                            Reset(DdServiceCible)
                                          Text: ="Transférer"
                                          Tooltip: ="Transfert possible uniquement après prise en charge (statut En cours et gestionnaire assigné)"
                        - ClotureCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =68
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: |-
                                =varSelectedDemande.Statut_Actuel.Value = "Validé"
                                    && (UserRole = "Admin"
                                        || (UserRole = "Agent" && varSelectedDemande.Agent_Demandeur.Email = User().Email))
                            Children:
                              - BtnCloturer:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(6, 95, 70, 1)
                                    Height: =40
                                    OnSelect: =Set(varActionDialog, "cloturer")
                                    Text: ="Confirmer la réception"
                        - AttachmentsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =220
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - TxtAttachmentsTitle:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 41, 55, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Size: =14
                                    Text: ="Pièces jointes"
                              - AttachCtrlDetail:
                                  Control: Attachments
                                  Properties:
                                    AddAttachmentText: ="Ajouter un fichier"
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    Default: =varSelectedDemande
                                    Height: =150
                                    MaxAttachments: =10
                                    NoAttachmentsText: ="Aucune pièce jointe"
                  - SideColumn:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(249, 250, 251, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                      Children:
                        - TxtTimelineTitle:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              Size: =16
                              Text: ="Historique"
                              Width: =Parent.Width
                        - TimelineScroll:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(249, 250, 251, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowY: =LayoutOverflow.Scroll
                            Children:
                              - GalleryHistorique:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    FillPortions: =0
                                    Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                                    Items: |-
                                      =SortByColumns(
                                        Filter(Historique_Demandes, Demande_ID = Text(varSelectedDemande.ID)),
                                        "Num_Mouvement",
                                        SortOrder.Ascending
                                      )
                                    TemplatePadding: =12
                                    TemplateSize: =140
                                    Width: =Parent.Width
                                  Children:
                                    - TLCardContainer:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Semilight
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =Parent.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - TLDotColumn:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                FillPortions: =0
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Vertical
                                                PaddingTop: =20
                                                Width: =32
                                              Children:
                                                - TLDot:
                                                    Control: Circle
                                                    Properties:
                                                      Fill: =RGBA(140, 12, 20, 1)
                                                      Height: =10
                                                      Width: =10
                                          - TLContentContainer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                                PaddingBottom: =16
                                                PaddingLeft: =4
                                                PaddingRight: =18
                                                PaddingTop: =16
                                              Children:
                                                - TxtTLType:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FontWeight: =FontWeight.Bold
                                                      Size: =14
                                                      Text: =ThisItem.Type_Modification.Value
                                                      Width: =Parent.Width - 54
                                                - TxtTLStatut:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(112, 112, 112, 1)
                                                      Size: =13
                                                      Text: |-
                                                        ="Statut : " & ThisItem.Statut_A_Ce_Moment
                                                      Width: =Parent.Width - 54
                                                - TxtTLComment:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Size: =13
                                                      Text: =ThisItem.Commentaire_Action
                                                      Visible: =Not(IsBlank(ThisItem.Commentaire_Action))
                                                      Width: =Parent.Width - 54
                                                - TxtTLMeta:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(144, 144, 144, 1)
                                                      Size: =12
                                                      Text: |-
                                                        ="Par " & ThisItem.Actionneur.DisplayName & "  ·  " & With(
                                                          {
                                                            _hrs: DateDiff(ThisItem.Date_Debut_Etape, Now(), TimeUnit.Hours)
                                                          },
                                                          If(
                                                            _hrs < 24,
                                                            "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                            With(
                                                              {_days: RoundDown(_hrs / 24, 0)},
                                                              "il y a " & _days & If(_days = 1, " jour", " jours")
                                                            )
                                                          )
                                                        )
                                                      Width: =Parent.Width - 54
                              - TxtEmptyTimeline:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =RGBA(144, 144, 144, 1)
                                    Size: =14
                                    Text: ="Aucun historique pour cette demande."
                                    Visible: =GalleryHistorique.AllItemsCount = 0
                                    Width: =Parent.Width
      - DialogOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =Not(IsBlank(varActionDialog))
            Width: =Parent.Width
          Children:
            - RectDialogScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varActionDialog, "")
                  Width: =Parent.Width
            - DialogCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: |-
                    =Switch(
                        varActionDialog,
                        "rejeter", 330,
                        "transferer", 280,
                        "assigner", 280,
                        210
                    )
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(DetailDemande.Size = ScreenSize.Small, Parent.Width - 40, 440)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtDialogTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(31, 41, 55, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =17
                        Text: |-
                          =Switch(
                              varActionDialog,
                              "prendre", "Prendre en charge ?",
                              "valider", "Confirmer la validation ?",
                              "rejeter", "Rejeter la demande",
                              "transferer", "Transférer la demande",
                              "assigner", "Assigner à un gestionnaire",
                              "cloturer", "Confirmer la réception ?",
                              ""
                          )
                  - TxtDialogBody:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: |-
                          ="« " & varSelectedDemande.Title & " » — " & Switch(
                              varActionDialog,
                              "prendre", "vous serez assigné comme gestionnaire de cette demande.",
                              "valider", "la demande passera au statut Validé.",
                              "rejeter", "indiquez le motif du rejet (obligatoire).",
                              "transferer", "choisissez le service destinataire.",
                              "assigner", "choisissez le gestionnaire à qui l'assigner.",
                              "cloturer", "vous confirmez la bonne réception ; la demande sera clôturée.",
                              ""
                          )
                  - InpMotifRejet:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Motif du rejet (obligatoire)"
                        Height: =96
                        Placeholder: ="Motif du rejet…"
                        Type: =TextInputType.Multiline
                        Visible: =varActionDialog = "rejeter"
                  - DdServiceCible:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Service destinataire du transfert"
                        Height: =40
                        ItemDisplayText: =ThisItem.Title
                        Items: =Filter(Services_Siege, Title <> varSelectedDemande.Service_Actuel_ID.Value)
                        Visible: =varActionDialog = "transferer"
                  - DdGestionnaireCible:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Gestionnaire destinataire de l'assignation"
                        Height: =40
                        ItemDisplayText: =ThisItem.Utilisateur.DisplayName
                        Items: |-
                          =Filter(
                              Membres_Services,
                              Role.Value = "Gestionnaire"
                                  && Service_ID.Id = LookUp(Services_Siege, Title = varSelectedDemande.Service_Actuel_ID.Value, ID)
                          )
                        Visible: =varActionDialog = "assigner"
                  - DialogButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - BtnDialogAnnuler:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =40
                              OnSelect: =Set(varActionDialog, "")
                              Text: ="Annuler"
                              Width: =120
                        - BtnDialogConfirmer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: |-
                                =Switch(
                                    varActionDialog,
                                    "rejeter", RGBA(220, 38, 38, 1),
                                    "valider", RGBA(6, 95, 70, 1),
                                    "cloturer", RGBA(6, 95, 70, 1),
                                    RGBA(140, 12, 20, 1)
                                )
                              DisplayMode: |-
                                =If(
                                    (varActionDialog = "rejeter" && IsBlank(Trim(InpMotifRejet.Text)))
                                        || (varActionDialog = "transferer" && IsBlank(DdServiceCible.Selected.ID))
                                        || (varActionDialog = "assigner" && IsBlank(DdGestionnaireCible.Selected.ID)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Height: =40
                              OnSelect: |-
                                =Switch(
                                    varActionDialog,
                                    "prendre",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {
                                            Gestionnaire_Assigne: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                DisplayName: User().FullName,
                                                Email: User().Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                            }
                                        }),
                                        Notify("Échec de la prise en charge : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande prise en charge — le statut se met à jour dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "valider",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Validé"}}),
                                        Notify("Échec de la validation : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande validée.", NotificationType.Success)
                                    ),
                                    "rejeter",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Rejeté"}, Motif_Rejet: Trim(InpMotifRejet.Text)}),
                                        Notify("Échec du rejet : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande rejetée.", NotificationType.Success)
                                    ),
                                    "transferer",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Service_Actuel_ID: {Id: DdServiceCible.Selected.ID, Value: DdServiceCible.Selected.Title}}),
                                        Notify("Échec du transfert : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande transférée.", NotificationType.Success)
                                    ),
                                    "assigner",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {
                                            Gestionnaire_Assigne: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & Lower(DdGestionnaireCible.Selected.Utilisateur.Email),
                                                DisplayName: DdGestionnaireCible.Selected.Utilisateur.DisplayName,
                                                Email: DdGestionnaireCible.Selected.Utilisateur.Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                            }
                                        }),
                                        Notify("Échec de l'assignation : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande assignée — le statut se met à jour dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "cloturer",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Clôturé"}}),
                                        Notify("Échec de la clôture : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Réception confirmée, demande clôturée.", NotificationType.Success)
                                    )
                                )
                              Text: ="Confirmer"
                              Width: =140
