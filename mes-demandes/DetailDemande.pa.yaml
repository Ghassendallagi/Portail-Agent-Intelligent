                        - AttachmentsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =220
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - TxtAttachmentsTitle:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 41, 55, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Size: =14
                                    Text: ="Pièces jointes"
                              - AttachCtrlDetail:
                                  Control: Attachments
                                  Properties:
                                    AddAttachmentText: ="Ajouter un fichier"
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    Default: =varSelectedDemande
                                    Height: =150
                                    MaxAttachments: =10
                                    NoAttachmentsText: ="Aucune pièce jointe"
                        - ComplementResponseCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 251, 235, 1)
                              FillPortions: =0
                              Height: =254
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: |-
                                =varSelectedDemande.Statut_Actuel.Value = "En attente complément"
                                  && UserRole = "Agent"
                                  && varSelectedDemande.Agent_Demandeur.Email = User().Email
                            Children:
                              - CRHeaderRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =24
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - IconCRHeader:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =20
                                          Icon: ="Clock"
                                          IconColor: =RGBA(180, 83, 9, 1)
                                          Width: =20
                                    - TxtCRTitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(146, 64, 14, 1)
                                          FontWeight: =FontWeight.Bold
                                          Text: ="Compléter les informations demandées"
                              - TxtCRComment:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(120, 53, 15, 1)
                                    Size: =13
                                    Text: =varSelectedDemande.Commentaire_Complement
                                    Width: =Parent.Width - 36
                              - TxtCRReponse:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Votre réponse"
                                    Height: =72
                                    Placeholder: ="Votre réponse (et/ou ajoutez une pièce jointe ci-dessous)…"
                                    Type: =TextInputType.Multiline
                              - BtnEnvoyerComplement:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(180, 83, 9, 1)
                                    Height: =40
                                    OnSelect: |-
                                      =IfError(
                                          Patch(Historique_Demandes, Defaults(Historique_Demandes), {
                                              Title: varSelectedDemande.Titre & " - M" & varSelectedDemande.Num_Mouvement_Cours,
                                              Demande_ID: Text(varSelectedDemande.ID),
                                              Num_Mouvement: varSelectedDemande.Num_Mouvement_Cours,
                                              Service_A_Ce_Moment: varSelectedDemande.Service_Actuel_ID.Value,
                                              Gestionnaire_A_Ce_Moment: {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(varSelectedDemande.Gestionnaire_Assigne.Email), DisplayName: varSelectedDemande.Gestionnaire_Assigne.DisplayName, Email: varSelectedDemande.Gestionnaire_Assigne.Email, Department: "", JobTitle: "", Picture: ""},
                                              Statut_A_Ce_Moment: "En cours",
                                              Date_Debut_Etape: Now(),
                                              Actionneur: {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(User().Email), DisplayName: User().FullName, Email: User().Email, Department: "", JobTitle: "", Picture: ""},
                                              Commentaire_Action: If(IsBlank(Trim(TxtCRReponse.Text)), "Réponse fournie par l'agent", Trim(TxtCRReponse.Text)),
                                              Type_Modification: {Value: "Réponse complément"}
                                          });
                                          Patch(Demandes, varSelectedDemande, {
                                              Statut_Actuel: {Value: "En cours"},
                                              En_Attente_Complement: false,
                                              Date_Reponse_Complement: Now(),
                                              Duree_Pause_Heures: varSelectedDemande.Duree_Pause_Heures + DateDiff(varSelectedDemande.Date_Debut_Pause, Now(), TimeUnit.Minutes) / 60,
                                              Num_Mouvement_Cours: varSelectedDemande.Num_Mouvement_Cours + 1,
                                              Type_Modification: {Value: "Réponse complément"}
                                          }),
                                          Notify("Échec de l'envoi du complément : " & FirstError.Message, NotificationType.Error),
                                          Refresh(Demandes);
                                          Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                          Reset(TxtCRReponse);
                                          Notify("Complément envoyé, la demande reprend son traitement.", NotificationType.Success)
                                      )
                                    Text: ="Envoyer le complément"
                  - SideColumn:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(249, 250, 251, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                      Children:
                        - TxtTimelineTitle:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FontWeight: =FontWeight.Semibold
                              Size: =16
                              Text: ="Historique"
                              Width: =Parent.Width
                        - TimelineScroll:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(249, 250, 251, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowY: =LayoutOverflow.Scroll
                            Children:
                              - GalleryHistorique:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    FillPortions: =0
                                    Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                                    Items: |-
                                      =With(
                                          {
                                              _hist: SortByColumns(
                                                  Filter(Historique_Demandes, Demande_ID = Text(varSelectedDemande.ID)),
                                                  "Num_Mouvement",
                                                  SortOrder.Ascending
                                              )
                                          },
                                          ForAll(
                                              Sequence(CountRows(_hist) + If(IsEmpty(_hist), 0, 1)),
                                              {
                                                  TL_Num: If(ThisRecord.Value = 1, 0, Index(_hist, ThisRecord.Value - 1).Num_Mouvement),
                                                  TL_Type: If(ThisRecord.Value = 1, "Nouvelle demande", Index(_hist, ThisRecord.Value - 1).Type_Modification.Value),
                                                  TL_Statut: If(ThisRecord.Value = 1, "Soumis", Index(_hist, ThisRecord.Value - 1).Statut_A_Ce_Moment),
                                                  TL_Comment: If(ThisRecord.Value = 1, "Demande créée", Index(_hist, ThisRecord.Value - 1).Commentaire_Action),
                                                  TL_Acteur: If(ThisRecord.Value = 1, varSelectedDemande.Agent_Demandeur.DisplayName, Index(_hist, ThisRecord.Value - 1).Actionneur.DisplayName),
                                                  TL_Date: If(ThisRecord.Value = 1, varSelectedDemande.Date_Soumission, Index(_hist, ThisRecord.Value - 1).Date_Debut_Etape)
                                              }
                                          )
                                      )
                                    TemplatePadding: =12
                                    TemplateSize: =160
                                    Width: =Parent.Width
                                  Children:
                                    - TLCardContainer:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =If(ThisItem.TL_Num = Max(Filter(Historique_Demandes, Demande_ID = Text(varSelectedDemande.ID)), Num_Mouvement), DropShadow.Regular, DropShadow.Semilight)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =Parent.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =If(DetailDemande.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - TLDotColumn:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                FillPortions: =0
                                                Height: =If(DetailDemande.Size = ScreenSize.Small, 24, Parent.Height)
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Vertical
                                                PaddingTop: =20
                                                Width: =32
                                              Children:
                                                - TLDot:
                                                    Control: Circle
                                                    Properties:
                                                      Fill: |-
                                                        =Switch(
                                                            ThisItem.TL_Type,
                                                            "Nouvelle demande", RGBA(144, 144, 144, 1),
                                                            "Assignation", RGBA(30, 64, 175, 1),
                                                            "Réaffectation", RGBA(96, 165, 250, 1),
                                                            "Transfert", RGBA(180, 83, 9, 1),
                                                            "Validation", RGBA(21, 128, 61, 1),
                                                            "Rejet", RGBA(220, 38, 38, 1),
                                                            "Clôture", RGBA(140, 12, 20, 1),
                                                            "Demande complément", RGBA(217, 119, 6, 1),
                                                            "Réponse complément", RGBA(37, 99, 235, 1),
                                                            RGBA(144, 144, 144, 1)
                                                        )
                                                      Height: =16
                                                      Width: =16
                                                - TLLine:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      Fill: =RGBA(209, 213, 219, 1)
                                                      FillPortions: =0
                                                      Height: =Parent.Height - 46
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      Visible: =(DetailDemande.Size <> ScreenSize.Small) && (ThisItem.TL_Num <> Max(Filter(Historique_Demandes, Demande_ID = Text(varSelectedDemande.ID)), Num_Mouvement))
                                                      Width: =3
                                          - TLContentContainer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                                PaddingBottom: =16
                                                PaddingLeft: =4
                                                PaddingRight: =18
                                                PaddingTop: =16
                                              Children:
                                                - TLHeaderRow:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      FillPortions: =0
                                                      Height: =24
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =6
                                                      Width: =Parent.Width - 54
                                                    Children:
                                                      - IconTLType:
                                                          Control: ModernIcon
                                                          Properties:
                                                            AccessibleLabel: =ThisItem.TL_Type
                                                            Height: =18
                                                            Icon: |-
                                                              =Switch(
                                                                  ThisItem.TL_Type,
                                                                  "Nouvelle demande", "DocumentAdd",
                                                                  "Assignation", "Person",
                                                                  "Réaffectation", "ArrowRepeatAll",
                                                                  "Transfert", "ArrowForward",
                                                                  "Validation", "CheckmarkCircle",
                                                                  "Rejet", "DismissCircle",
                                                                  "Clôture", "Flag",
                                                                  "Demande complément", "Clock",
                                                                  "Réponse complément", "CheckmarkCircle",
                                                                  "Info"
                                                              )
                                                            IconColor: |-
                                                              =Switch(
                                                                  ThisItem.TL_Type,
                                                                  "Nouvelle demande", RGBA(144, 144, 144, 1),
                                                                  "Assignation", RGBA(30, 64, 175, 1),
                                                                  "Réaffectation", RGBA(96, 165, 250, 1),
                                                                  "Transfert", RGBA(180, 83, 9, 1),
                                                                  "Validation", RGBA(21, 128, 61, 1),
                                                                  "Rejet", RGBA(220, 38, 38, 1),
                                                                  "Clôture", RGBA(140, 12, 20, 1),
                                                                  "Demande complément", RGBA(217, 119, 6, 1),
                                                                  "Réponse complément", RGBA(37, 99, 235, 1),
                                                                  RGBA(144, 144, 144, 1)
                                                              )
                                                            Width: =18
                                                      - TxtTLType:
                                                          Control: ModernText
                                                          Properties:
                                                            AutoHeight: =true
                                                            Color: |-
                                                              =Switch(
                                                                  ThisItem.TL_Type,
                                                                  "Nouvelle demande", RGBA(112, 112, 112, 1),
                                                                  "Assignation", RGBA(30, 64, 175, 1),
                                                                  "Réaffectation", RGBA(96, 165, 250, 1),
                                                                  "Transfert", RGBA(180, 83, 9, 1),
                                                                  "Validation", RGBA(21, 128, 61, 1),
                                                                  "Rejet", RGBA(220, 38, 38, 1),
                                                                  "Clôture", RGBA(140, 12, 20, 1),
                                                                  "Demande complément", RGBA(180, 83, 9, 1),
                                                                  "Réponse complément", RGBA(30, 64, 175, 1),
                                                                  RGBA(31, 41, 55, 1)
                                                              )
                                                            FontWeight: =FontWeight.Bold
                                                            Size: =14
                                                            Text: =ThisItem.TL_Type
                                                            Width: =Parent.Width - 96
                                                      - BadgeTLActuel:
                                                          Control: Badge
                                                          Properties:
                                                            Appearance: ='BadgeCanvas.Appearance'.Filled
                                                            BasePaletteColor: =RGBA(140, 12, 20, 1)
                                                            Content: ="Actuel"
                                                            FontColor: =RGBA(255, 255, 255, 1)
                                                            Height: =22
                                                            LayoutMinWidth: =66
                                                            Visible: =ThisItem.TL_Num = Max(Filter(Historique_Demandes, Demande_ID = Text(varSelectedDemande.ID)), Num_Mouvement)
                                                            Width: =66
                                                - TxtTLStatut:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(112, 112, 112, 1)
                                                      Size: =13
                                                      Text: |-
                                                        ="Statut : " & If(
                                                          IsBlank(ThisItem.TL_Statut),
                                                          "Information indisponible",
                                                          ThisItem.TL_Statut
                                                        )
                                                      Width: =Parent.Width - 54
                                                - TxtTLComment:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Size: =13
                                                      Text: |-
                                                        =If(
                                                          IsBlank(ThisItem.TL_Comment),
                                                          "Information indisponible",
                                                          ThisItem.TL_Comment
                                                        )
                                                      Width: =Parent.Width - 54
                                                - TxtTLActionneur:
                                                    Control: ModernText
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(144, 144, 144, 1)
                                                      Size: =12
                                                      Text: |-
                                                        ="Par " & If(
                                                          IsBlank(ThisItem.TL_Acteur),
                                                          "Information indisponible",
                                                          ThisItem.TL_Acteur
                                                        )
                                                      Width: =Parent.Width - 54
                                                - TLDateRow:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      FillPortions: =0
                                                      Height: =20
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =4
                                                      Width: =Parent.Width - 54
                                                    Children:
                                                      - IconTLDate:
                                                          Control: ModernIcon
                                                          Properties:
                                                            AccessibleLabel: ="Date du mouvement"
                                                            Height: =16
                                                            Icon: ="Clock"
                                                            IconColor: =RGBA(112, 112, 112, 1)
                                                            Width: =16
                                                      - TxtTLDate:
                                                          Control: ModernText
                                                          Properties:
                                                            AutoHeight: =true
                                                            Color: =RGBA(112, 112, 112, 1)
                                                            Size: =12
                                                            Text: |-
                                                              =If(
                                                                IsBlank(ThisItem.TL_Date),
                                                                "Information indisponible",
                                                                Text(ThisItem.TL_Date, DateTimeFormat.ShortDateTime24) & " · " & With(
                                                                  {_hrs: DateDiff(ThisItem.TL_Date, Now(), TimeUnit.Hours)},
                                                                  If(
                                                                    _hrs < 24,
                                                                    "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                                    With(
                                                                      {_days: RoundDown(_hrs / 24, 0)},
                                                                      "il y a " & _days & If(_days = 1, " jour", " jours")
                                                                    )
                                                                  )
                                                                )
                                                              )
                                                            Width: =Parent.Width - 24
                              - TxtEmptyTimeline:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =RGBA(144, 144, 144, 1)
                                    Size: =14
                                    Text: ="Aucun historique disponible"
                                    Visible: =GalleryHistorique.AllItemsCount = 0
                                    Width: =Parent.Width
      - DialogOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =Not(IsBlank(varActionDialog))
            Width: =Parent.Width
          Children:
            - RectDialogScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varActionDialog, "")
                  Width: =Parent.Width
            - DialogCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: |-
                    =Switch(
                        varActionDialog,
                        "rejeter", 330,
                        "transferer", 420,
                        "assigner", 280,
                        "complement", 320,
                        210
                    )
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(DetailDemande.Size = ScreenSize.Small, Parent.Width - 40, 440)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtDialogTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(31, 41, 55, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =17
                        Text: |-
                          =Switch(
                              varActionDialog,
                              "prendre", "Prendre en charge ?",
                              "valider", "Confirmer la validation ?",
                              "rejeter", "Rejeter la demande",
                              "transferer", "Transférer la demande",
                              "assigner", "Assigner à un gestionnaire",
                              "cloturer", "Confirmer la réception ?",
                              "complement", "Demande de complément",
                              ""
                          )
                  - TxtDialogBody:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: |-
                          ="« " & varSelectedDemande.Titre & " » — " & Switch(
                              varActionDialog,
                              "prendre", "vous serez assigné comme gestionnaire de cette demande.",
                              "valider", "la demande passera au statut Validé.",
                              "rejeter", "indiquez le motif du rejet (obligatoire).",
                              "transferer", "choisissez le service destinataire et indiquez le motif du transfert (obligatoire).",
                              "assigner", "choisissez le gestionnaire à qui l'assigner.",
                              "cloturer", "vous confirmez la bonne réception ; la demande sera clôturée.",
                              "complement", "expliquez les informations manquantes attendues de l'agent (obligatoire).",
                              ""
                          )
                  - InpMotifRejet:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Motif du rejet (obligatoire)"
                        Height: =96
                        Placeholder: ="Motif du rejet…"
                        Type: =TextInputType.Multiline
                        Visible: =varActionDialog = "rejeter"
                  - DdServiceCible:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Service destinataire du transfert"
                        Height: =40
                        ItemDisplayText: =ThisItem.Title
                        Items: |-
                          =Filter(
                              Services_Siege,
                              Title <> varSelectedDemande.Service_Actuel_ID.Value
                                  && (Coalesce(TypeRulesActuelles.Transfert_Direction_Generale_Autorise, true) || Title <> "Direction Generale")
                                  && (
                                      CountRows(TypeRulesActuelles.Services_A_Transferer) = 0
                                          || ID in TypeRulesActuelles.Services_A_Transferer.Id
                                          || ID in TypeRulesActuelles.Service_Par_Defaut.Id
                                  )
                          )
                        Visible: =varActionDialog = "transferer"
                  - DdGestionnaireCible:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Gestionnaire destinataire de l'assignation"
                        Height: =40
                        ItemDisplayText: =ThisItem.Utilisateur.DisplayName
                        Items: |-
                          =Filter(
                              Membres_Services,
                              Role.Value = "Gestionnaire"
                                  && Service_ID.Id = LookUp(Services_Siege, Title = varSelectedDemande.Service_Actuel_ID.Value, ID)
                          )
                        Visible: =varActionDialog = "assigner"
                  - DialogButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - BtnDialogAnnuler:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =40
                              OnSelect: =Set(varActionDialog, "")
                              Text: ="Annuler"
                              Width: =120
                        - BtnDialogConfirmer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: |-
                                =Switch(
                                    varActionDialog,
                                    "rejeter", RGBA(220, 38, 38, 1),
                                    "valider", RGBA(6, 95, 70, 1),
                                    "cloturer", RGBA(6, 95, 70, 1),
                                    RGBA(140, 12, 20, 1)
                                )
                              DisplayMode: |-
                                =If(
                                    (varActionDialog = "rejeter" && IsBlank(Trim(InpMotifRejet.Text)))
                                        || (varActionDialog = "transferer" && (IsBlank(DdServiceCible.Selected.ID) || IsBlank(Trim(TxtTransferComment.Text))))
                                        || (varActionDialog = "complement" && IsBlank(Trim(TxtDemandeComplement.Text)))
                                        || (varActionDialog = "assigner" && IsBlank(DdGestionnaireCible.Selected.ID)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Height: =40
                              OnSelect: |-
                                =Switch(
                                    varActionDialog,
                                    "prendre",
                                    IfError(
                                        Set(varPollMode, "assign");
                                        Patch(Demandes, varSelectedDemande, {
                                            Gestionnaire_Assigne: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                DisplayName: User().FullName,
                                                Email: User().Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                            }
                                        }),
                                        Notify("Échec de la prise en charge : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Set(varPollCount, 0);
                                        Set(varPolling, true);
                                        Notify("Demande prise en charge — le statut se met à jour dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "valider",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Validé"}}),
                                        Notify("Échec de la validation : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande validée.", NotificationType.Success)
                                    ),
                                    "rejeter",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Rejeté"}, Motif_Rejet: Trim(InpMotifRejet.Text)}),
                                        Notify("Échec du rejet : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande rejetée.", NotificationType.Success)
                                    ),
                                    "transferer",
                                    IfError(
                                        Set(varPollMode, "transfert");
                                        Patch(Demandes, varSelectedDemande, {Service_Actuel_ID: {Id: DdServiceCible.Selected.ID, Value: DdServiceCible.Selected.Title}, Commentaire_Transfert: Trim(TxtTransferComment.Text)}),
                                        Notify("Échec du transfert : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Set(varPollCount, 0);
                                        Set(varPolling, true);
                                        Notify("Demande transférée — le traitement se finalise dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "assigner",
                                    IfError(
                                        Set(varPollMode, "assign");
                                        Patch(Demandes, varSelectedDemande, {
                                            Gestionnaire_Assigne: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & Lower(DdGestionnaireCible.Selected.Utilisateur.Email),
                                                DisplayName: DdGestionnaireCible.Selected.Utilisateur.DisplayName,
                                                Email: DdGestionnaireCible.Selected.Utilisateur.Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                            }
                                        }),
                                        Notify("Échec de l'assignation : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Set(varPollCount, 0);
                                        Set(varPolling, true);
                                        Notify("Demande assignée — le statut se met à jour dans quelques secondes.", NotificationType.Success)
                                    ),
                                    "cloturer",
                                    IfError(
                                        Patch(Demandes, varSelectedDemande, {Statut_Actuel: {Value: "Clôturé"}}),
                                        Notify("Échec de la clôture : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Réception confirmée, demande clôturée.", NotificationType.Success)
                                    ),
                                    "complement",
                                    IfError(
                                        Patch(Historique_Demandes, Defaults(Historique_Demandes), {
                                            Title: varSelectedDemande.Titre & " - M" & varSelectedDemande.Num_Mouvement_Cours,
                                            Demande_ID: Text(varSelectedDemande.ID),
                                            Num_Mouvement: varSelectedDemande.Num_Mouvement_Cours,
                                            Service_A_Ce_Moment: varSelectedDemande.Service_Actuel_ID.Value,
                                            Gestionnaire_A_Ce_Moment: {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(varSelectedDemande.Gestionnaire_Assigne.Email), DisplayName: varSelectedDemande.Gestionnaire_Assigne.DisplayName, Email: varSelectedDemande.Gestionnaire_Assigne.Email, Department: "", JobTitle: "", Picture: ""},
                                            Statut_A_Ce_Moment: "En attente complément",
                                            Date_Debut_Etape: Now(),
                                            Actionneur: {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(User().Email), DisplayName: User().FullName, Email: User().Email, Department: "", JobTitle: "", Picture: ""},
                                            Commentaire_Action: Trim(TxtDemandeComplement.Text),
                                            Type_Modification: {Value: "Demande complément"}
                                        });
                                        Patch(Demandes, varSelectedDemande, {
                                            Statut_Actuel: {Value: "En attente complément"},
                                            En_Attente_Complement: true,
                                            Date_Debut_Pause: Now(),
                                            Commentaire_Complement: Trim(TxtDemandeComplement.Text),
                                            Num_Mouvement_Cours: varSelectedDemande.Num_Mouvement_Cours + 1,
                                            Type_Modification: {Value: "Demande complément"}
                                        });
                                        Patch(Notifications, Defaults(Notifications), {
                                            Title: "Complément demandé",
                                            Destinataire: {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(varSelectedDemande.Agent_Demandeur.Email), DisplayName: varSelectedDemande.Agent_Demandeur.DisplayName, Email: varSelectedDemande.Agent_Demandeur.Email, Department: "", JobTitle: "", Picture: ""},
                                            Type_Notification: {Value: "Warning"},
                                            Priority: {Value: "Normal"},
                                            Module: "Demandes",
                                            ObjectID: Text(varSelectedDemande.ID),
                                            Message: Trim(TxtDemandeComplement.Text),
                                            IsRead: false
                                        }),
                                        Notify("Échec de la demande de complément : " & FirstError.Message, NotificationType.Error),
                                        Set(varActionDialog, "");
                                        Refresh(Demandes);
                                        Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
                                        Notify("Demande de complément envoyée à l'agent.", NotificationType.Success)
                                    )
                                )
                              Text: ="Confirmer"
                              Width: =140
                  - TxtTransferCommentHint:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        Size: =12
                        Text: ="Veuillez indiquer le motif du transfert."
                        Visible: =varActionDialog = "transferer" && IsBlank(Trim(TxtTransferComment.Text))
                  - TxtTransferComment:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Motif du transfert (obligatoire)"
                        Height: =96
                        Placeholder: ="Motif du transfert…"
                        Type: =TextInputType.Multiline
                        Visible: =varActionDialog = "transferer"
                  - TxtDemandeComplement:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Informations attendues (obligatoire)"
                        Height: =96
                        Placeholder: ="Merci de joindre le rapport d'inspection signé…"
                        Type: =TextInputType.Multiline
                        Visible: =varActionDialog = "complement"
                  - TxtDemandeComplementHint:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        Size: =12
                        Text: ="Veuillez indiquer les informations attendues."
                        Visible: =varActionDialog = "complement" && IsBlank(Trim(TxtDemandeComplement.Text))
      - TmrRefreshDemande:
          Control: Timer
          Properties:
            Duration: =3000
            Height: =1
            OnTimerEnd: |-
              =Refresh(Demandes);
              Set(varSelectedDemande, LookUp(Demandes, ID = varSelectedDemande.ID));
              Set(varPollCount, varPollCount + 1);
              If(
                  Switch(
                      varPollMode,
                      "assign", varSelectedDemande.Statut_Actuel.Value = "En cours"
                          && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName)),
                      "transfert", varSelectedDemande.Statut_Actuel.Value = "Soumis"
                          && IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName),
                      true
                  ) || varPollCount >= 40,
                  Set(varPolling, false)
              )
            Repeat: =true
            Start: =varPolling
            Visible: =false
            Width: =1
