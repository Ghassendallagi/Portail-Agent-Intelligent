                                            =varSelectedDemande.Statut_Actuel.Value = "En cours"
                                              && Coalesce(TypeRulesActuelles.Complement_Autorise, true)
                                              && Not(IsBlank(varSelectedDemande.Gestionnaire_Assigne.DisplayName))
                        - ClotureCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
