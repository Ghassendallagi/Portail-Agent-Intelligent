                                    - BadgeDLStatut:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          BasePaletteColor: |-
                                            =If(
                                                Now() > varSelectedDemande.Deadline_Metier, RGBA(254, 226, 226, 1),
                                                DateDiff(Now(), varSelectedDemande.Deadline_Metier, TimeUnit.Hours) < 24, RGBA(254, 235, 200, 1),
                                                RGBA(209, 250, 229, 1)
                                            )
                                          Content: |-
                                            =If(
                                                Now() > varSelectedDemande.Deadline_Metier, "Dépassée",
                                                DateDiff(Now(), varSelectedDemande.Deadline_Metier, TimeUnit.Hours) < 24, "Proche échéance",
                                                "Normale"
                                            )
                                          FontColor: |-
                                            =If(
                                                Now() > varSelectedDemande.Deadline_Metier, RGBA(153, 27, 27, 1),
                                                DateDiff(Now(), varSelectedDemande.Deadline_Metier, TimeUnit.Hours) < 24, RGBA(180, 83, 9, 1),
                                                RGBA(6, 95, 70, 1)
                                            )
                                          Height: =24
                                          LayoutMinWidth: =120
                                          Width: =130
                              - DLRestantRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =24
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - IconDLRestant:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =18
                                          Icon: ="Clock"
                                          IconColor: |-
                                            =If(
                                                Now() > varSelectedDemande.Deadline_Metier, RGBA(220, 38, 38, 1),
                                                DateDiff(Now(), varSelectedDemande.Deadline_Metier, TimeUnit.Hours) < 24, RGBA(180, 83, 9, 1),
                                                RGBA(21, 128, 61, 1)
                                            )
                                          Width: =18
                                    - TxtDLRestant:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: |-
                                            =If(
                                                Now() > varSelectedDemande.Deadline_Metier, RGBA(220, 38, 38, 1),
                                                DateDiff(Now(), varSelectedDemande.Deadline_Metier, TimeUnit.Hours) < 24, RGBA(180, 83, 9, 1),
                                                RGBA(21, 128, 61, 1)
                                            )
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: |-
                                            =With(
                                                {_min: DateDiff(Now(), varSelectedDemande.Deadline_Metier, TimeUnit.Minutes)},
                                                If(
                                                    _min >= 1440, RoundDown(_min / 1440, 0) & If(RoundDown(_min / 1440, 0) > 1, " jours restants", " jour restant"),
                                                    _min >= 60, RoundDown(_min / 60, 0) & If(RoundDown(_min / 60, 0) > 1, " heures restantes", " heure restante"),
                                                    _min >= 0, _min & If(_min > 1, " minutes restantes", " minute restante"),
                                                    _min > -60, "Deadline dépassée depuis " & -_min & If(-_min > 1, " minutes", " minute"),
                                                    _min > -1440, "Deadline dépassée depuis " & RoundDown(-_min / 60, 0) & If(RoundDown(-_min / 60, 0) > 1, " heures", " heure"),
                                                    "Deadline dépassée depuis " & RoundDown(-_min / 1440, 0) & If(RoundDown(-_min / 1440, 0) > 1, " jours", " jour")
                                                )
                                            )
                                          Width: =Parent.Width - 62
                        - ActionsCard:
