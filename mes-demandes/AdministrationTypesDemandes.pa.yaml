Screens:
  AdministrationTypesDemandes:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varADFormOpen, false);
        Set(varADFormMode, "create");
        Set(varADEditingID, Blank());
        Reset(InpADSearch)
    Children:
      - RailAD:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =AdministrationTypesDemandes.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoAD:
                Control: Image
                Properties:
                  Height: =60
                  Image: =Logo
            - RectRailSepAD:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =16
            - NavADAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoADAccueil:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblADAccueil:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Accueil"
            - NavADMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoADMesDem:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblADMesDem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Mes demandes"
            - NavADFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoADFile:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Width: =22
                  - LblADFile:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Size: =14
                        Text: ="File à traiter"
            - NavADAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoADAlertes:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Width: =22
                  - LblADAlertes:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Alertes SLA"
            - NavADStats:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoADStats:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="DataBarVertical"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Width: =22
                  - LblADStats:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Statistiques"
            - NavADAdmin:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(140, 12, 20, 0.08)
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Admin"
                Children:
                  - IcoADAdmin:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Settings"
                        IconColor: =RGBA(140, 12, 20, 1)
                        OnSelect: =Navigate(AdministrationTypesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblADAdmin:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Navigate(AdministrationTypesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Administration"
            - NavADNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoADNotifs:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Width: =22
                  - LblADNotifs:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Notifications"
                  - BdgADNotifs:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        Width: =30
            - RectRailSpacerAD:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
            - RectRailSeparatorAD:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
            - TxtRailUserAD:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(55, 65, 81, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =User().FullName
            - TxtRailRoleAD:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(112, 112, 112, 1)
                  Size: =12
                  Text: =UserRole
      - ADScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(AdministrationTypesDemandes.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(AdministrationTypesDemandes.Size = ScreenSize.Small, 0, RailAD.Width)
            X: =If(AdministrationTypesDemandes.Size = ScreenSize.Small, 0, RailAD.Width)
          Children:
            - ADHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =104
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
                Children:
                  - ADTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =42
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        Width: =Parent.Width - 56
                      Children:
                        - TxtADTitreMain:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Size: =28
                              Text: ="Administration des types de demande"
                        - IconNotifAD:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Ouvrir les notifications"
                              Height: =28
                              Icon: ="Alert"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                              Width: =28
                        - BadgeNotifAD:
                            Control: Badge
                            Properties:
                              Appearance: ='BadgeCanvas.Appearance'.Filled
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =22
                              Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                  - RectADAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - ADBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =20
                Children:
                  - ADToolbarRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                      Children:
                        - InpADSearch:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Rechercher un type de demande"
                              BorderColor: =RGBA(229, 231, 235, 1)
                              FillPortions: =1
                              Height: =40
                              Placeholder: ="Rechercher par nom ou code métier…"
                        - BtnADNouveau:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              Icon: ="Add"
                              OnSelect: |-
                                =Set(varADFormMode, "create");
                                Set(varADEditingID, Blank());
                                Reset(InpADNom);
                                Reset(InpADCode);
                                Reset(InpADDescription);
                                Reset(DdADService);
                                Reset(RadADDeadline);
                                Reset(RadADComplement);
                                Reset(RadADTransfertDG);
                                Reset(RadADValidationDG);
                                Reset(RadADNiveauValidation);
                                Reset(RadADActif);
                                Set(varADFormOpen, true)
                              Text: ="Nouveau type"
                              Width: =180
                  - GalleryADTypes:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  Types_Demandes,
                                  IsBlank(Trim(InpADSearch.Text))
                                      || StartsWith(Title, Trim(InpADSearch.Text))
                                      || StartsWith(Code_Metier, Trim(InpADSearch.Text))
                              ),
                              "Title", SortOrder.Ascending
                          )
                        TemplatePadding: =10
                        TemplateSize: =152
                        Width: =Parent.Width - 56
                      Children:
                        - ADRowCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - ADRowInfo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                  Children:
                                    - TxtADRowTitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(31, 41, 55, 1)
                                          FontWeight: =FontWeight.Bold
                                          Text: =Coalesce(ThisItem.Title, "COALESCE_EMPTY")
                                          Width: =Parent.Width
                                    - ADRowBadgesLine:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =26
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          Width: =Parent.Width
                                        Children:
                                          - BadgeADRowCode:
                                              Control: Badge
                                              Properties:
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: =RGBA(219, 234, 254, 1)
                                                Content: =Coalesce(ThisItem.Code_Metier, "—")
                                                FontColor: =RGBA(30, 64, 175, 1)
                                                Height: =28
                                                LayoutMinWidth: =Len(Coalesce(ThisItem.Code_Metier, "—")) * 8 + 32
                                                Width: =Len(Coalesce(ThisItem.Code_Metier, "—")) * 8 + 32
                                          - BadgeADRowActif:
                                              Control: Badge
                                              Properties:
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: =Coalesce(If(ThisItem.Actif, RGBA(209, 250, 229, 1), RGBA(229, 231, 235, 1)), RGBA(209, 250, 229, 1))
                                                Content: =Coalesce(If(ThisItem.Actif, "Actif", "Inactif"), "Actif")
                                                FontColor: =Coalesce(If(ThisItem.Actif, RGBA(6, 95, 70, 1), RGBA(107, 114, 128, 1)), RGBA(6, 95, 70, 1))
                                                Height: =28
                                                LayoutMinWidth: =Len(Coalesce(If(ThisItem.Actif, "Actif", "Inactif"), "Actif")) * 8 + 32
                                                Width: =Len(Coalesce(If(ThisItem.Actif, "Actif", "Inactif"), "Actif")) * 8 + 32
                                    - TxtADRowService:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(112, 112, 112, 1)
                                          Size: =12
                                          Text: |-
                                            ="Service par défaut : " & If(CountRows(ThisItem.Service_Par_Defaut) > 0, First(ThisItem.Service_Par_Defaut).Value, "—")
                                          Width: =Parent.Width
                                    - ADRowRulesLine:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =20
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          Width: =Parent.Width
                                        Children:
                                          - TxtADRowRules:
                                              Control: ModernText
                                              Properties:
                                                AutoHeight: =true
                                                Color: =RGBA(144, 144, 144, 1)
                                                Size: =12
                                                Text: |-
                                                  =If(Coalesce(ThisItem.Deadline_Obligatoire, false), "Deadline obligatoire · ", "") &
                                                      If(Not(Coalesce(ThisItem.Complement_Autorise, true)), "Complément désactivé · ", "") &
                                                      If(Coalesce(ThisItem.Niveau_Validation.Value, "Simple") = "Direction_Generale", "Validation DG", "Validation simple")
                                                Width: =Parent.Width
                              - BtnADModifier:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(140, 12, 20, 1)
                                    Height: =36
                                    OnSelect: |-
                                      =Set(varADFormMode, "edit");
                                      Set(varADEditingID, ThisItem.ID);
                                      Reset(InpADNom);
                                      Reset(InpADCode);
                                      Reset(InpADDescription);
                                      Reset(DdADService);
                                      Reset(RadADDeadline);
                                      Reset(RadADComplement);
                                      Reset(RadADTransfertDG);
                                      Reset(RadADValidationDG);
                                      Reset(RadADNiveauValidation);
                                      Reset(RadADActif);
                                      Set(varADFormOpen, true)
                                    Text: ="Modifier"
                                    Width: =110
                              - BtnADToggleActif:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(Coalesce(ThisItem.Actif, true), RGBA(220, 38, 38, 1), RGBA(6, 95, 70, 1))
                                    Height: =36
                                    OnSelect: |-
                                      =IfError(
                                          Patch(Types_Demandes, ThisItem, {Actif: Not(Coalesce(ThisItem.Actif, true))}),
                                          Notify("Échec de la mise à jour : " & FirstError.Message, NotificationType.Error),
                                          Notify("Statut mis à jour.", NotificationType.Success)
                                      )
                                    Text: =If(Coalesce(ThisItem.Actif, true), "Désactiver", "Activer")
                                    Width: =110
                  - TxtADEmpty:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(144, 144, 144, 1)
                        Size: =14
                        Text: ="Aucun type de demande ne correspond à la recherche."
                        Visible: =GalleryADTypes.AllItemsCount = 0
                        Width: =Parent.Width - 56
      - ADFormOverlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =varADFormOpen
            Width: =Parent.Width
          Children:
            - RectADFormScrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(17, 24, 39, 0.45)
                  Height: =Parent.Height
                  OnSelect: =Set(varADFormOpen, false)
                  Width: =Parent.Width
            - ADFormCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Min(Parent.Height - 40, 720)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(AdministrationTypesDemandes.Size = ScreenSize.Small, Parent.Width - 40, 480)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - TxtADFormTitle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: =If(varADFormMode = "edit", "Modifier le type de demande", "Nouveau type de demande")
                  - TxtADLblNom:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Nom du type *"
                  - InpADNom:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Nom du type (obligatoire)"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varADFormMode = "edit", LookUp(Types_Demandes, ID = varADEditingID).Title, "")
                        Height: =40
                  - TxtADLblCode:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Code métier *"
                  - InpADCode:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Code métier (obligatoire)"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varADFormMode = "edit", LookUp(Types_Demandes, ID = varADEditingID).Code_Metier, "")
                        Height: =40
                        Placeholder: |-
                          ="Ex: CONTROLE_TECH"
                  - TxtADLblDescription:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Description métier"
                  - InpADDescription:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Description métier"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: =If(varADFormMode = "edit", LookUp(Types_Demandes, ID = varADEditingID).Description_Metier, "")
                        Height: =72
                        Type: =TextInputType.Multiline
                  - TxtADLblService:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Service par défaut"
                  - DdADService:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Service par défaut"
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Default: |-
                          =If(
                              varADFormMode = "edit" && CountRows(LookUp(Types_Demandes, ID = varADEditingID).Service_Par_Defaut) > 0,
                              LookUp(Services_Siege, ID = First(LookUp(Types_Demandes, ID = varADEditingID).Service_Par_Defaut).Id),
                              Blank()
                          )
                        Height: =40
                        ItemDisplayText: =ThisItem.Title
                        Items: =SortByColumns(Services_Siege, "Title", SortOrder.Ascending)
                  - TxtADLblDeadline:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Deadline obligatoire"
                  - RadADDeadline:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Deadline obligatoire"
                        Default: |-
                          =If(varADFormMode = "edit" && Coalesce(LookUp(Types_Demandes, ID = varADEditingID).Deadline_Obligatoire, false), {Value: "Oui"}, {Value: "Non"})
                        Height: =76
                        Items: =["Oui", "Non"]
                  - TxtADLblComplement:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Complément autorisé"
                  - RadADComplement:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Complément autorisé"
                        Default: |-
                          =If(varADFormMode = "edit" && Not(Coalesce(LookUp(Types_Demandes, ID = varADEditingID).Complement_Autorise, true)), {Value: "Non"}, {Value: "Oui"})
                        Height: =76
                        Items: =["Oui", "Non"]
                  - TxtADLblTransfertDG:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Transfert Direction Générale autorisé"
                  - RadADTransfertDG:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Transfert Direction Générale autorisé"
                        Default: |-
                          =If(varADFormMode = "edit" && Not(Coalesce(LookUp(Types_Demandes, ID = varADEditingID).Transfert_Direction_Generale_Aut, true)), {Value: "Non"}, {Value: "Oui"})
                        Height: =76
                        Items: =["Oui", "Non"]
                  - TxtADLblValidationDG:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Validation Direction Générale possible"
                  - RadADValidationDG:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Validation Direction Générale possible"
                        Default: |-
                          =If(varADFormMode = "edit" && Coalesce(LookUp(Types_Demandes, ID = varADEditingID).Validation_Direction_Generale_Po, false), {Value: "Oui"}, {Value: "Non"})
                        Height: =76
                        Items: =["Oui", "Non"]
                  - TxtADLblNiveauValidation:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Niveau de validation"
                  - RadADNiveauValidation:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Niveau de validation"
                        Default: |-
                          =If(varADFormMode = "edit" && Coalesce(LookUp(Types_Demandes, ID = varADEditingID).Niveau_Validation.Value, "Simple") = "Direction_Generale", {Value: "Direction_Generale"}, {Value: "Simple"})
                        Height: =76
                        Items: =["Simple", "Direction_Generale"]
                  - TxtADLblActif:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: ="Actif"
                  - RadADActif:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="Actif"
                        Default: |-
                          =If(varADFormMode = "edit" && Not(Coalesce(LookUp(Types_Demandes, ID = varADEditingID).Actif, true)), {Value: "Non"}, {Value: "Oui"})
                        Height: =76
                        Items: =["Oui", "Non"]
                  - TxtADFormErr:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(220, 38, 38, 1)
                        Size: =12
                        Text: ="Le nom et le code métier sont obligatoires."
                        Visible: =varADTriedSave && (IsBlank(Trim(InpADNom.Text)) || IsBlank(Trim(InpADCode.Text)))
                  - ADFormButtonsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - BtnADAnnuler:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Outline
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: =Set(varADFormOpen, false)
                              Text: ="Annuler"
                              Width: =120
                        - BtnADEnregistrer:
                            Control: ModernButton
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: |-
                                =Set(varADTriedSave, true);
                                If(
                                    Not(IsBlank(Trim(InpADNom.Text))) && Not(IsBlank(Trim(InpADCode.Text))),
                                    IfError(
                                        Patch(
                                            Types_Demandes,
                                            If(varADFormMode = "edit", LookUp(Types_Demandes, ID = varADEditingID), Defaults(Types_Demandes)),
                                            {
                                                Title: Trim(InpADNom.Text),
                                                Code_Metier: Trim(InpADCode.Text),
                                                Description_Metier: Trim(InpADDescription.Text),
                                                Service_Par_Defaut: Filter(Table({Id: DdADService.Selected.ID, Value: DdADService.Selected.Title}), Not(IsBlank(DdADService.Selected.ID))),
                                                Deadline_Obligatoire: RadADDeadline.Selected.Value = "Oui",
                                                Complement_Autorise: RadADComplement.Selected.Value = "Oui",
                                                Transfert_Direction_Generale_Aut: RadADTransfertDG.Selected.Value = "Oui",
                                                Validation_Direction_Generale_Po: RadADValidationDG.Selected.Value = "Oui",
                                                Niveau_Validation: {Value: RadADNiveauValidation.Selected.Value},
                                                Actif: RadADActif.Selected.Value = "Oui"
                                            }
                                        ),
                                        Notify("Échec de l'enregistrement : " & FirstError.Message, NotificationType.Error),
                                        Set(varADFormOpen, false);
                                        Set(varADTriedSave, false);
                                        Refresh(Types_Demandes);
                                        Notify("Type de demande enregistré.", NotificationType.Success)
                                    )
                                )
                              Text: ="Enregistrer"
                              Width: =140
