                  - TxtACActivite:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(55, 65, 81, 1)
                        FontWeight: =FontWeight.Semibold
                        Size: =16
                        Text: ="Activité récente"
                        Width: =Parent.Width - 56
                  - GalleryActivite:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =FirstN(
                              SortByColumns(
                                  Filter(Notifications, Destinataire.Email = User().Email),
                                  "Created", SortOrder.Descending
                              ),
                              5
                          )
                        TemplatePadding: =6
                        TemplateSize: =60
                      Children:
                        - ActCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =If(ThisItem.IsRead, RGBA(255, 255, 255, 1), RGBA(219, 234, 254, 1))
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Parent.TemplateWidth
                            Children:
                              - RectActStripe:
                                  Control: Rectangle
                                  Properties:
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Type_Notification.Value,
                                        "Success", RGBA(6, 95, 70, 1),
                                        "Validation", RGBA(6, 95, 70, 1),
                                        "Refus", RGBA(220, 38, 38, 1),
                                        "Error", RGBA(220, 38, 38, 1),
                                        "Warning", RGBA(234, 88, 12, 1),
                                        "Reminder", RGBA(217, 119, 6, 1),
                                        "Information", RGBA(37, 99, 235, 1),
                                        RGBA(112, 112, 112, 1)
                                      )
                                    Width: =4
                              - ActIconCol:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    PaddingTop: =16
                                    Width: =40
                                  Children:
                                    - IconActType:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: =ThisItem.Type_Notification.Value
                                          Height: =20
                                          Icon: |-
                                            =Switch(
                                                ThisItem.Type_Notification.Value,
                                                "Information", "Info",
                                                "Success", "CheckmarkCircle",
                                                "Validation", "CheckmarkCircle",
                                                "Warning", "Warning",
                                                "Reminder", "Clock",
                                                "Refus", "DismissCircle",
                                                "Error", "DismissCircle",
                                                "Info"
                                            )
                                          IconColor: |-
                                            =Switch(
                                                ThisItem.Type_Notification.Value,
                                                "Information", RGBA(37, 99, 235, 1),
                                                "Success", RGBA(6, 95, 70, 1),
                                                "Validation", RGBA(6, 95, 70, 1),
                                                "Warning", RGBA(234, 88, 12, 1),
                                                "Reminder", RGBA(217, 119, 6, 1),
                                                "Refus", RGBA(220, 38, 38, 1),
                                                "Error", RGBA(220, 38, 38, 1),
                                                RGBA(112, 112, 112, 1)
                                            )
                                          Width: =20
                              - ActContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =3
                                    PaddingBottom: =10
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =6
                                  Children:
                                    - TxtActTitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =If(ThisItem.IsRead, RGBA(112, 112, 112, 1), RGBA(17, 24, 39, 1))
                                          FontWeight: =If(ThisItem.IsRead, FontWeight.Normal, FontWeight.Semibold)
                                          Size: =14
                                          Text: =ThisItem.Title
                                          Width: =Parent.Width - 32
                                    - TxtActDate:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(144, 144, 144, 1)
                                          Size: =12
                                          Text: |-
                                            =With(
                                                {_hrs: DateDiff(ThisItem.Created, Now(), TimeUnit.Hours)},
                                                If(
                                                    _hrs < 1,
                                                    With(
                                                        {_mins: DateDiff(ThisItem.Created, Now(), TimeUnit.Minutes)},
                                                        If(_mins < 2, "à l'instant", "il y a " & _mins & " minutes")
                                                    ),
                                                    _hrs < 24,
                                                    "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                    _hrs < 336,
                                                    With(
                                                        {_days: RoundDown(_hrs / 24, 0)},
                                                        "il y a " & _days & If(_days = 1, " jour", " jours")
                                                    ),
                                                    With(
                                                        {_wks: RoundDown(_hrs / 168, 0)},
                                                        "il y a " & _wks & If(_wks = 1, " semaine", " semaines")
                                                    )
                                                )
                                            )
                                          Width: =Parent.Width - 32
                        - BtnActCardClick:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.TemplateHeight
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Text: =""
                              Width: =Parent.TemplateWidth
