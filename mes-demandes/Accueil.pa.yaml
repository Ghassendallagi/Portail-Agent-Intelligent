                  - TxtACActivite:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(55, 65, 81, 1)
                        FontWeight: =FontWeight.Semibold
                        Size: =16
                        Text: ="Activité récente"
                        Width: =Parent.Width - 56
                  - GalleryActivite:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =FirstN(
                              SortByColumns(
                                  Filter(Notifications, Destinataire.Email = User().Email),
                                  "Created", SortOrder.Descending
                              ),
                              5
                          )
                        TemplatePadding: =6
                        TemplateSize: =62
                      Children:
                        - ActCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =If(ThisItem.IsRead, RGBA(255, 255, 255, 1), RGBA(219, 234, 254, 1))
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Parent.TemplateWidth
                            Children:
                              - RectActStripe:
                                  Control: Rectangle
                                  Properties:
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Type_Notification.Value,
                                        "Success", RGBA(6, 95, 70, 1),
                                        "Validation", RGBA(6, 95, 70, 1),
                                        "Refus", RGBA(220, 38, 38, 1),
                                        "Error", RGBA(220, 38, 38, 1),
                                        "Warning", RGBA(234, 88, 12, 1),
                                        "Reminder", RGBA(217, 119, 6, 1),
                                        "Information", RGBA(37, 99, 235, 1),
                                        RGBA(112, 112, 112, 1)
                                      )
                                    Width: =4
                              - ActContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =3
                                    PaddingBottom: =12
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =8
                                  Children:
                                    - TxtActTitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =If(ThisItem.IsRead, RGBA(112, 112, 112, 1), RGBA(17, 24, 39, 1))
                                          FontWeight: =If(ThisItem.IsRead, FontWeight.Normal, FontWeight.Semibold)
                                          Size: =14
                                          Text: =ThisItem.Title
                                          Width: =Parent.Width - 32
                                    - TxtActDate:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(144, 144, 144, 1)
                                          Size: =12
                                          Text: |-
                                            =With(
                                              {_hrs: DateDiff(ThisItem.Created, Now(), TimeUnit.Hours)},
                                              If(
                                                _hrs < 1,
                                                "il y a moins d'une heure",
                                                _hrs < 24,
                                                "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                With(
                                                  {_days: RoundDown(_hrs / 24, 0)},
                                                  "il y a " & _days & If(_days = 1, " jour", " jours")
                                                )
                                              )
                                            )
                                          Width: =Parent.Width - 32
                        - BtnActCardClick:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.TemplateHeight
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
