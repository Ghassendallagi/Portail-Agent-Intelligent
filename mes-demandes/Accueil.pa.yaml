Screens:
  Accueil:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
    Children:
      - RailAC:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =Accueil.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoAC:
                Control: Image
                Properties:
                  Height: =60
                  Image: =Logo
            - RectRailSepAC:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =16
            - NavACAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(140, 12, 20, 0.08)
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoACAccueil:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(140, 12, 20, 1)
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblACAccueil:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Accueil"
            - NavACMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoACMesDem:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblACMesDem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Mes demandes"
            - NavACNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoACNouvelle:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Width: =22
                  - LblACNouvelle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Nouvelle demande"
            - NavACFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoACFile:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Width: =22
                  - LblACFile:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Size: =14
                        Text: ="File à traiter"
            - NavACAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoACAlertes:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Width: =22
                  - LblACAlertes:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Alertes SLA"
            - NavACStats:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoACStats:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="DataBarVertical"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Width: =22
                  - LblACStats:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Statistiques"
            - NavACNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoACNotifs:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Width: =22
                  - LblACNotifs:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Notifications"
                  - BdgACNotifs:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =22
                        LayoutMinWidth: =36
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        Width: =36
            - RectRailSpacerAC:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
            - RectRailSeparatorAC:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
            - TxtRailUserAC:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(55, 65, 81, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =User().FullName
            - TxtRailRoleAC:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(112, 112, 112, 1)
                  Size: =12
                  Text: =UserRole
      - ACMain:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(Accueil.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(Accueil.Size = ScreenSize.Small, 0, RailAC.Width)
            X: =If(Accueil.Size = ScreenSize.Small, 0, RailAC.Width)
          Children:
            - ACHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =128
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
                Children:
                  - TxtACBonjour:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =28
                        Text: ="Bonjour " & User().FullName
                        Width: =Parent.Width - 56
                  - TxtACDate:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =14
                        Text: |-
                          =Switch(
                              Weekday(Today(), StartOfWeek.Monday),
                              1, "Lundi", 2, "Mardi", 3, "Mercredi", 4, "Jeudi", 5, "Vendredi", 6, "Samedi", 7, "Dimanche"
                          ) & " " & Day(Today()) & " " & Switch(
                              Month(Today()),
                              1, "janvier", 2, "février", 3, "mars", 4, "avril", 5, "mai", 6, "juin",
                              7, "juillet", 8, "août", 9, "septembre", 10, "octobre", 11, "novembre", 12, "décembre"
                          ) & " " & Year(Today())
                        Width: =Parent.Width - 56
            - ACBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - InsightRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: |-
                          =If(
                              Accueil.Size = ScreenSize.Small,
                              If(UserRole = "Superviseur" || UserRole = "Admin", 144, 0) + If(UserRole = "Superviseur", 164, 130),
                              If(UserRole = "Superviseur", 164, 130)
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Accueil.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =14
                        Width: =Parent.Width - 56
                      Children:
                        - SanteCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Regular
                              Fill: |-
                                =If(
                                    Value(NumKpiRetard.Text) = 0, RGBA(236, 253, 245, 1),
                                    If(Value(NumKpiRetard.Text) <= 2, RGBA(255, 247, 237, 1), RGBA(254, 242, 242, 1))
                                )
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                            Children:
                              - TxtSanteTitle:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    Size: =13
                                    Text: ="État du portail"
                              - SanteStatusRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                  Children:
                                    - DotSante:
                                        Control: Circle
                                        Properties:
                                          Fill: |-
                                            =If(
                                                Value(NumKpiRetard.Text) = 0, RGBA(21, 128, 61, 1),
                                                If(Value(NumKpiRetard.Text) <= 2, RGBA(180, 83, 9, 1), RGBA(220, 38, 38, 1))
                                            )
                                          Height: =14
                                          Width: =14
                                    - TxtSanteStatus:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: |-
                                            =If(
                                                Value(NumKpiRetard.Text) = 0, RGBA(21, 128, 61, 1),
                                                If(Value(NumKpiRetard.Text) <= 2, RGBA(180, 83, 9, 1), RGBA(220, 38, 38, 1))
                                            )
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Bold
                                          Size: =24
                                          Text: |-
                                            =If(
                                                Value(NumKpiRetard.Text) = 0, "Portail sous contrôle",
                                                If(Value(NumKpiRetard.Text) <= 2, "Attention requise", "Situation critique")
                                            )
                              - TxtSanteSub:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(107, 114, 128, 1)
                                    Size: =13
                                    Text: |-
                                      =If(
                                          Value(NumKpiRetard.Text) = 0,
                                          "Aucune demande en retard SLA",
                                          NumKpiRetard.Text & If(Value(NumKpiRetard.Text) > 1, " demandes", " demande") & " en retard SLA"
                                      )
                                    Width: =Parent.Width
                        - PrioCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - PrioTitleRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =24
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - IcoPrioTitle:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =20
                                          Icon: ="Flag"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          Width: =20
                                    - TxtPrioTitle:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(55, 65, 81, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Size: =16
                                          Text: ="Priorités du jour"
                              - LinePrioRetard:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                                  Children:
                                    - IcoPrioRetard:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =18
                                          Icon: ="Warning"
                                          IconColor: =RGBA(220, 38, 38, 1)
                                          Width: =18
                                    - TxtPrioRetard:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(55, 65, 81, 1)
                                          FillPortions: =1
                                          Size: =13
                                          Text: =NumKpiRetard.Text & If(Value(NumKpiRetard.Text) > 1, " demandes", " demande") & " en retard SLA"
                              - LinePrioATraiter:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                                  Children:
                                    - IcoPrioATraiter:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =18
                                          Icon: ="Briefcase"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          Width: =18
                                    - TxtPrioATraiter:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(55, 65, 81, 1)
                                          FillPortions: =1
                                          Size: =13
                                          Text: =NumKpiATraiter.Text & If(Value(NumKpiATraiter.Text) > 1, " demandes", " demande") & " à traiter"
                              - LinePrioAssignees:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur"
                                  Children:
                                    - IcoPrioAssignees:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =18
                                          Icon: ="Person"
                                          IconColor: =RGBA(37, 99, 235, 1)
                                          Width: =18
                                    - TxtPrioAssignees:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(55, 65, 81, 1)
                                          FillPortions: =1
                                          Size: =13
                                          Text: =NumKpiAssignees.Text & " en cours (assignées à vous)"
                              - LinePrioAgEnCours:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =UserRole = "Agent"
                                  Children:
                                    - IcoPrioAgEnCours:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =18
                                          Icon: ="Document"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          Width: =18
                                    - TxtPrioAgEnCours:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(55, 65, 81, 1)
                                          FillPortions: =1
                                          Size: =13
                                          Text: =NumKpiAgEnCours.Text & If(Value(NumKpiAgEnCours.Text) > 1, " demandes", " demande") & " en cours de traitement"
                              - LinePrioAgAValider:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =UserRole = "Agent"
                                  Children:
                                    - IcoPrioAgAValider:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =18
                                          Icon: ="CheckmarkCircle"
                                          IconColor: =RGBA(21, 128, 61, 1)
                                          Width: =18
                                    - TxtPrioAgAValider:
                                        Control: ModernText
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(55, 65, 81, 1)
                                          FillPortions: =1
                                          Size: =13
                                          Text: =NumKpiAgAValider.Text & If(Value(NumKpiAgAValider.Text) > 1, " demandes validées", " demande validée") & " à confirmer"
                  - KpiRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: |-
                          =If(
                              Accueil.Size = ScreenSize.Small,
                              Switch(UserRole, "Agent", 3, "Gestionnaire", 4, "Superviseur", 5, 5) * 172,
                              172
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Accueil.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =14
                        Width: =Parent.Width - 56
                      Children:
                        - KpiAgEnCours:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(254, 242, 242, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Agent"
                            Children:
                              - BdgIcoKpiAgEnCours:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(254, 226, 226, 1)
                                    FillPortions: =0
                                    Height: =38
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    Width: =38
                                  Children:
                                    - IcoKpiAgEnCours:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =22
                                          Icon: ="Document"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          OnSelect: |-
                                            =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                          Width: =22
                              - LblKpiAgEnCours:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                    Size: =13
                                    Text: ="Mes demandes en cours"
                              - NumKpiAgEnCours:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                    Size: =40
                                    Text: =Text(CountRows(Filter(Demandes, Agent_Demandeur.Email = User().Email && (Statut_Actuel.Value = "Soumis" || Statut_Actuel.Value = "En cours"))))
                              - TxtCtxKpiAgEnCours:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(75, 85, 99, 1)
                                    Size: =13
                                    Text: ="En attente de traitement"
                        - KpiAgAValider:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(236, 253, 245, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Agent"
                            Children:
                              - BdgIcoKpiAgAValider:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(209, 250, 229, 1)
                                    FillPortions: =0
                                    Height: =38
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
