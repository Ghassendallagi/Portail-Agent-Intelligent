Screens:
  Accueil:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
    Children:
      - RailAC:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =Accueil.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoAC:
                Control: Image
                Properties:
                  Height: =60
                  Image: =Logo
            - RectRailSepAC:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =16
            - NavACAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(140, 12, 20, 0.08)
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoACAccueil:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(140, 12, 20, 1)
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblACAccueil:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Accueil"
            - NavACMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoACMesDem:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblACMesDem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Mes demandes"
            - NavACNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoACNouvelle:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Width: =22
                  - LblACNouvelle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Nouvelle demande"
            - NavACFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoACFile:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Width: =22
                  - LblACFile:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Size: =14
                        Text: ="File à traiter"
            - NavACAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoACAlertes:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Width: =22
                  - LblACAlertes:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Alertes SLA"
            - NavACStats:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoACStats:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="DataBarVertical"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Width: =22
                  - LblACStats:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Statistiques"
            - NavACNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoACNotifs:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Width: =22
                  - LblACNotifs:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Notifications"
                  - BdgACNotifs:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =22
                        LayoutMinWidth: =36
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        Width: =36
            - RectRailSpacerAC:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
            - RectRailSeparatorAC:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
            - TxtRailUserAC:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(55, 65, 81, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =User().FullName
            - TxtRailRoleAC:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(112, 112, 112, 1)
                  Size: =12
                  Text: =UserRole
      - ACMain:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(Accueil.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(Accueil.Size = ScreenSize.Small, 0, RailAC.Width)
            X: =If(Accueil.Size = ScreenSize.Small, 0, RailAC.Width)
          Children:
            - ACHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =128
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
                Children:
                  - TxtACBonjour:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =28
                        Text: ="Bonjour " & User().FullName
                        Width: =Parent.Width - 56
                  - TxtACDate:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =14
                        Text: |-
                          =Switch(
                              Weekday(Today(), StartOfWeek.Monday),
                              1, "Lundi", 2, "Mardi", 3, "Mercredi", 4, "Jeudi", 5, "Vendredi", 6, "Samedi", 7, "Dimanche"
                          ) & " " & Day(Today()) & " " & Switch(
                              Month(Today()),
                              1, "janvier", 2, "février", 3, "mars", 4, "avril", 5, "mai", 6, "juin",
                              7, "juillet", 8, "août", 9, "septembre", 10, "octobre", 11, "novembre", 12, "décembre"
                          ) & " " & Year(Today())
                        Width: =Parent.Width - 56
            - ACBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - KpiRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: |-
                          =If(
                              Accueil.Size = ScreenSize.Small,
                              Switch(UserRole, "Agent", 3, "Gestionnaire", 4, "Superviseur", 4, 4) * 170,
                              170
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Accueil.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =14
                        Width: =Parent.Width - 56
                      Children:
                        - KpiAgEnCours:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(254, 242, 242, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Agent"
                            Children:
                              - BdgIcoKpiAgEnCours:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(254, 226, 226, 1)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    Width: =44
                                  Children:
                                    - IcoKpiAgEnCours:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =26
                                          Icon: ="Document"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          OnSelect: |-
                                            =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                          Width: =26
                              - LblKpiAgEnCours:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                    Size: =13
                                    Text: ="Mes demandes en cours"
                              - NumKpiAgEnCours:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                    Size: =48
                                    Text: =Text(CountRows(Filter(Demandes, Agent_Demandeur.Email = User().Email && (Statut_Actuel.Value = "Soumis" || Statut_Actuel.Value = "En cours"))))
                        - KpiAgAValider:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(236, 253, 245, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Agent"
                            Children:
                              - BdgIcoKpiAgAValider:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(209, 250, 229, 1)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    Width: =44
                                  Children:
                                    - IcoKpiAgAValider:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =26
                                          Icon: ="Checkmark"
                                          IconColor: =RGBA(6, 95, 70, 1)
                                          OnSelect: |-
                                            =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                          Width: =26
                              - LblKpiAgAValider:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                    Size: =13
                                    Text: ="À confirmer (validées)"
                              - NumKpiAgAValider:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(6, 95, 70, 1)
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "encours"})
                                    Size: =48
                                    Text: =Text(CountRows(Filter(Demandes, Agent_Demandeur.Email = User().Email && Statut_Actuel.Value = "Validé")))
                        - KpiAgTerminees:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(245, 245, 246, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Agent"
                            Children:
                              - BdgIcoKpiAgTerminees:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(243, 244, 246, 1)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    Width: =44
                                  Children:
                                    - IcoKpiAgTerminees:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =26
                                          Icon: ="Archive"
                                          IconColor: =RGBA(112, 112, 112, 1)
                                          OnSelect: |-
                                            =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "terminees"})
                                          Width: =26
                              - LblKpiAgTerminees:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "terminees"})
                                    Size: =13
                                    Text: ="Terminées"
                              - NumKpiAgTerminees:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(55, 65, 81, 1)
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: |-
                                      =Navigate(MesDemandes, ScreenTransition.Fade, {ctxMDTab: "terminees"})
                                    Size: =48
                                    Text: =Text(CountRows(Filter(Demandes, Agent_Demandeur.Email = User().Email && (Statut_Actuel.Value = "Clôturé" || Statut_Actuel.Value = "Rejeté"))))
                        - KpiATraiter:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(254, 242, 242, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                            Children:
                              - BdgIcoKpiATraiter:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(254, 226, 226, 1)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    Width: =44
                                  Children:
                                    - IcoKpiATraiter:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =26
                                          Icon: ="Briefcase"
                                          IconColor: =RGBA(140, 12, 20, 1)
                                          OnSelect: |-
                                            =Navigate(FileATraiter, ScreenTransition.Fade, {ctxFTTab: "atraiter"})
                                          Width: =26
                              - LblKpiATraiter:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    OnSelect: |-
                                      =Navigate(FileATraiter, ScreenTransition.Fade, {ctxFTTab: "atraiter"})
                                    Size: =13
                                    Text: ="À traiter"
                              - NumKpiATraiter:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(140, 12, 20, 1)
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: |-
                                      =Navigate(FileATraiter, ScreenTransition.Fade, {ctxFTTab: "atraiter"})
                                    Size: =48
                                    Text: |-
                                      =Text(
                                          If(
                                              UserRole = "Admin",
                                              CountRows(Filter(Demandes, Statut_Actuel.Value = "Soumis" || Statut_Actuel.Value = "En cours")),
                                              CountRows(Filter(Demandes, Service_Actuel_ID.Value = UserServiceLabel && (Statut_Actuel.Value = "Soumis" || Statut_Actuel.Value = "En cours")))
                                          )
                                      )
                        - KpiAssignees:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(239, 246, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur"
                            Children:
                              - BdgIcoKpiAssignees:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(219, 234, 254, 1)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    Width: =44
                                  Children:
                                    - IcoKpiAssignees:
                                        Control: ModernIcon
                                        Properties:
                                          Height: =26
                                          Icon: ="Person"
                                          IconColor: =RGBA(37, 99, 235, 1)
                                          OnSelect: |-
                                            =Navigate(FileATraiter, ScreenTransition.Fade, {ctxFTTab: "atraiter"})
                                          Width: =26
                              - LblKpiAssignees:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(112, 112, 112, 1)
                                    OnSelect: |-
                                      =Navigate(FileATraiter, ScreenTransition.Fade, {ctxFTTab: "atraiter"})
                                    Size: =13
                                    Text: ="En cours (à moi)"
                              - NumKpiAssignees:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(37, 99, 235, 1)
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: |-
                                      =Navigate(FileATraiter, ScreenTransition.Fade, {ctxFTTab: "atraiter"})
                                    Size: =48
                                    Text: =Text(CountRows(Filter(Demandes, Gestionnaire_Assigne.Email = User().Email && Statut_Actuel.Value = "En cours")))
                        - KpiTraitees:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(236, 253, 245, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                            Children:
                              - BdgIcoKpiTraitees:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(209, 250, 229, 1)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingBottom: =9
                                    PaddingLeft: =9
                                    PaddingRight: =9
                                    PaddingTop: =9
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
