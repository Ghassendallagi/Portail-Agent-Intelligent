Screens:
  MesDemandes:
    Properties:
      Fill: =ColorBackground
      OnVisible: |-
        =UpdateContext({ctxMDTab: Coalesce(ctxMDTab, "encours")})
    Children:
      - RailMD:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =300
            Height: =Parent.Height
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.Semilight
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            Visible: =MesDemandes.Size <> ScreenSize.Small
          Children:
            - ImgLogoMD:
                Control: Image
                Properties:
                  Image: =Logo
                  FillPortions: =0
                  Height: =60
                  ImagePosition: =ImagePosition.Fit
            - RectRailSepMD:
                Control: Rectangle
                Properties:
                  FillPortions: =0
                  Height: =16
                  Fill: =RGBA(0, 0, 0, 0)
            - NavMDAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(140, 12, 20, 0.08)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - IcoMDAccueil:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                  - LblMDAccueil:
                      Control: ModernText
                      Properties:
                        Text: ="Accueil"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
            - NavMDMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoMDMesDem:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Document"
                        IconColor: =RGBA(140, 12, 20, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                  - LblMDMesDem:
                      Control: ModernText
                      Properties:
                        Text: ="Mes demandes"
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(140, 12, 20, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
            - NavMDNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoMDNouvelle:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Add"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                  - LblMDNouvelle:
                      Control: ModernText
                      Properties:
                        Text: ="Nouvelle demande"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
            - NavMDFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoMDFile:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                  - LblMDFile:
                      Control: ModernText
                      Properties:
                        Text: ="File à traiter"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
            - NavMDAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoMDAlertes:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                  - LblMDAlertes:
                      Control: ModernText
                      Properties:
                        Text: ="Alertes SLA"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
            - NavMDNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - IcoMDNotifs:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Alert"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                  - LblMDNotifs:
                      Control: ModernText
                      Properties:
                        Text: ="Notifications"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                  - BdgMDNotifs:
                      Control: Badge
                      Properties:
                        Content: |-
                          =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        FontColor: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Width: =30
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: |-
                          =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
            - RectRailSpacerMD:
                Control: Rectangle
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
            - RectRailSeparatorMD:
                Control: Rectangle
                Properties:
                  FillPortions: =0
                  Height: =1
                  Fill: =RGBA(229, 231, 235, 1)
            - TxtRailUserMD:
                Control: ModernText
                Properties:
                  Text: =User().FullName
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(55, 65, 81, 1)
                  AutoHeight: =true
                  FillPortions: =0
            - TxtRailRoleMD:
                Control: ModernText
                Properties:
                  Text: =UserRole
                  Size: =12
                  FontWeight: =FontWeight.Normal
                  Color: =RGBA(112, 112, 112, 1)
                  AutoHeight: =true
                  FillPortions: =0
      - ScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =If(MesDemandes.Size = ScreenSize.Small, 0, RailMD.Width)
            Y: =0
            Width: =Parent.Width - If(MesDemandes.Size = ScreenSize.Small, 0, RailMD.Width)
            Height: =Parent.Height - If(MesDemandes.Size = ScreenSize.Small, 64, 0)
            Fill: =ColorBackground
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - HeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Fill: =ColorBackground
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  PaddingTop: =28
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                  Height: =104
                Children:
                  - TitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =42
                        Width: =Parent.Width - 56
                        Fill: =RGBA(255, 255, 255, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                      Children:
                        - TxtTitle:
                            Control: ModernText
                            Properties:
                              Text: ="Mes demandes"
                              Size: =28
                              FontWeight: =FontWeight.Bold
                              Color: =ColorAccent
                              AutoHeight: =true
                              FillPortions: =1
                        - IconNotifMD:
                            Control: ModernIcon
                            Properties:
                              Icon: ="Alert"
                              IconColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Width: =28
                              Height: =28
                              AccessibleLabel: ="Ouvrir les notifications"
                              OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        - BadgeNotifMD:
                            Control: Badge
                            Properties:
                              Content: |-
                                =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                              Appearance: ='BadgeCanvas.Appearance'.Filled
                              BasePaletteColor: =RGBA(220, 38, 38, 1)
                              FontColor: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Width: =32
                              Height: =22
                              LayoutMinWidth: =32
                              Visible: |-
                                =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        - BtnNouvelleDemande:
                            Control: ModernButton
                            Properties:
                              Text: =If(MesDemandes.Size = ScreenSize.Small, "+", "+ Nouvelle demande")
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =ColorAccent
                              FillPortions: =0
                              Width: =If(MesDemandes.Size = ScreenSize.Small, 44, 190)
                              Height: =40
                              AccessibleLabel: ="Créer une nouvelle demande"
                              OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                  - RectAccentBar:
                      Control: Rectangle
                      Properties:
                        FillPortions: =0
                        Width: =56
                        Height: =4
                        Fill: =ColorAccent
            - GalleryContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =ColorBackground
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutGap: =10
                  PaddingTop: =16
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingBottom: =28
                Children:
                  - InpSearchMD:
                      Control: ModernTextInput
                      Properties:
                        Type: =TextInputType.Search
                        Placeholder: ="Rechercher une demande..."
                        Default: =""
                        FillPortions: =0
                        Width: =Min(Parent.Width - 56, 800)
                        Height: =40
                        Size: =14
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        BorderColor: =RGBA(229, 231, 235, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                  - TabsRowMD:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =48
                        AlignInContainer: =AlignInContainer.Start
                        Width: =Min(Parent.Width - 56, 800)
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                      Children:
                        - BtnTbMDEnCours:
                            Control: ModernButton
                            Properties:
                              Text: ="En cours"
                              Icon: ="Clock"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxMDTab = "encours", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxMDTab = "encours", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxMDTab = "encours", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxMDTab = "encours", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxMDTab: "encours"})
                        - BtnTbMDTerminees:
                            Control: ModernButton
                            Properties:
                              Text: ="Terminées"
                              Icon: ="Checkmark"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxMDTab = "terminees", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxMDTab = "terminees", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxMDTab = "terminees", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxMDTab = "terminees", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxMDTab: "terminees"})
                        - BtnTbMDToutes:
                            Control: ModernButton
                            Properties:
                              Text: ="Toutes"
                              Icon: ="Document"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxMDTab = "toutes", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxMDTab = "toutes", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxMDTab = "toutes", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxMDTab = "toutes", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxMDTab: "toutes"})
                  - GalleryDemandes:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =With(
                              {_q: Trim(InpSearchMD.Text)},
                              If(
                                  ctxMDTab = "encours",
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          Agent_Demandeur.Email = User().Email
                                              && (Statut_Actuel.Value = "Soumis"
                                                  || Statut_Actuel.Value = "En cours"
                                                  || Statut_Actuel.Value = "Validé")
                                              && (IsBlank(_q) || StartsWith(Title, _q))
                                      ),
                                      "Date_Soumission", SortOrder.Descending
                                  ),
                                  ctxMDTab = "terminees",
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          Agent_Demandeur.Email = User().Email
                                              && (Statut_Actuel.Value = "Clôturé"
                                                  || Statut_Actuel.Value = "Rejeté")
                                              && (IsBlank(_q) || StartsWith(Title, _q))
                                      ),
                                      "Date_Soumission", SortOrder.Descending
                                  ),
                                  SortByColumns(
                                      Filter(
                                          Demandes,
                                          Agent_Demandeur.Email = User().Email
                                              && (IsBlank(_q) || StartsWith(Title, _q))
                                      ),
                                      "Date_Soumission", SortOrder.Descending
                                  )
                              )
                          )
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =150
                        TemplatePadding: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(varSelectedDemande, ThisItem);
                          Navigate(DetailDemande, ScreenTransition.Fade)
                      Children:
                        - CardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =ColorCardWhite
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RectUrgencyStripe:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Width: =4
                                    Fill: =If(ThisItem.Niveau_Urgence.Value = "Urgent" || ThisItem.Niveau_Urgence.Value = "Critique", ColorUrgent, RGBA(255, 255, 255, 0))
                              - ContentContainer:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =6
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                  Children:
                                    - TxtCardTitle:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Title
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - BadgeStatut:
                                        Control: Badge
                                        Properties:
                                          Content: =ThisItem.Statut_Actuel.Value
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          FillPortions: =0
                                          Width: =96
                                          Height: =28
                                          LayoutMinWidth: =96
                                          BasePaletteColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(229, 231, 235, 1),
                                              "En cours", RGBA(219, 234, 254, 1),
                                              "Validé", RGBA(209, 250, 229, 1),
                                              "Rejeté", RGBA(254, 226, 226, 1),
                                              "Clôturé", RGBA(219, 226, 254, 1),
                                              RGBA(229, 231, 235, 1)
                                            )
                                          FontColor: |-
                                            =Switch(
                                              ThisItem.Statut_Actuel.Value,
                                              "Soumis", RGBA(55, 65, 81, 1),
                                              "En cours", RGBA(30, 64, 175, 1),
                                              "Validé", RGBA(6, 95, 70, 1),
                                              "Rejeté", RGBA(153, 27, 27, 1),
                                              "Clôturé", RGBA(30, 27, 120, 1),
                                              RGBA(55, 65, 81, 1)
                                            )
                                    - TxtType:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Type : " & ThisItem.Type_Demande_ID.Value
                                          Size: =13
                                          Color: =ColorTextSecondary
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtService:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            ="Service : " & ThisItem.Service_Actuel_ID.Value
                                          Size: =13
                                          Color: =ColorTextSecondary
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtRelativeDate:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            =With(
                                              {
                                                _hrs: DateDiff(ThisItem.Date_Soumission, Now(), TimeUnit.Hours)
                                              },
                                              If(
                                                _hrs < 24,
                                                "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                With(
                                                  {_days: RoundDown(_hrs / 24, 0)},
                                                  "il y a " & _days & If(_days = 1, " jour", " jours")
                                                )
                                              )
                                            )
                                          Size: =12
                                          Color: =ColorTextTertiary
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                        - RectCardClick:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              OnSelect: |-
                                =Set(varSelectedDemande, ThisItem);
                                Navigate(DetailDemande, ScreenTransition.Fade)
                  - TxtEmptyState:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =Switch(
                              ctxMDTab,
                              "encours", "Aucune demande en cours.",
                              "terminees", "Aucune demande terminée.",
                              "Aucune demande pour le moment."
                          )
                        Size: =14
                        Color: =ColorTextTertiary
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =GalleryDemandes.AllItemsCount = 0
      - BarMD:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =Parent.Height - 64
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.Regular
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            Visible: =MesDemandes.Size = ScreenSize.Small
          Children:
            - BEntMDAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =2
                  PaddingTop: =10
                Children:
                  - BIcoMDAccueil:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                  - BLblMDAccueil:
                      Control: ModernText
                      Properties:
                        Text: ="Accueil"
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =0
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
            - BEntMDMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =2
                  PaddingTop: =10
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - BIcoMDMesDem:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Document"
                        IconColor: =RGBA(140, 12, 20, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                  - BLblMDMesDem:
                      Control: ModernText
                      Properties:
                        Text: ="Demandes"
                        Size: =10
