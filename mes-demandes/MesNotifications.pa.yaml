Screens:
  MesNotifications:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =UpdateContext({ctxNotifTab: "nonlues"})
    Children:
      - RailNT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =300
            Height: =Parent.Height
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.Semilight
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =4
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            Visible: =MesNotifications.Size <> ScreenSize.Small
          Children:
            - ImgLogoNT:
                Control: Image
                Properties:
                  Image: =Logo
                  FillPortions: =0
                  Height: =60
                  ImagePosition: =ImagePosition.Fit
            - RectRailSepNT:
                Control: Rectangle
                Properties:
                  FillPortions: =0
                  Height: =16
                  Fill: =RGBA(0, 0, 0, 0)
            - NavNTAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(140, 12, 20, 0.08)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - IcoNTAccueil:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                  - LblNTAccueil:
                      Control: ModernText
                      Properties:
                        Text: ="Accueil"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
            - NavNTMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoNTMesDem:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                  - LblNTMesDem:
                      Control: ModernText
                      Properties:
                        Text: ="Mes demandes"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
            - NavNTNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoNTNouvelle:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Add"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                  - LblNTNouvelle:
                      Control: ModernText
                      Properties:
                        Text: ="Nouvelle demande"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
            - NavNTFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoNTFile:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                  - LblNTFile:
                      Control: ModernText
                      Properties:
                        Text: ="File à traiter"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
            - NavNTAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoNTAlertes:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                  - LblNTAlertes:
                      Control: ModernText
                      Properties:
                        Text: ="Alertes SLA"
                        Size: =14
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
            - NavNTNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - IcoNTNotifs:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Alert"
                        IconColor: =RGBA(140, 12, 20, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                  - LblNTNotifs:
                      Control: ModernText
                      Properties:
                        Text: ="Notifications"
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(140, 12, 20, 1)
                        AutoHeight: =true
                        FillPortions: =1
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                  - BdgNTNotifs:
                      Control: Badge
                      Properties:
                        Content: |-
                          =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        FontColor: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Width: =30
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: |-
                          =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
            - RectRailSpacerNT:
                Control: Rectangle
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
            - RectRailSeparatorNT:
                Control: Rectangle
                Properties:
                  FillPortions: =0
                  Height: =1
                  Fill: =RGBA(229, 231, 235, 1)
            - TxtRailUserNT:
                Control: ModernText
                Properties:
                  Text: =User().FullName
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(55, 65, 81, 1)
                  AutoHeight: =true
                  FillPortions: =0
            - TxtRailRoleNT:
                Control: ModernText
                Properties:
                  Text: =UserRole
                  Size: =12
                  FontWeight: =FontWeight.Normal
                  Color: =RGBA(112, 112, 112, 1)
                  AutoHeight: =true
                  FillPortions: =0
      - NTScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =If(MesNotifications.Size = ScreenSize.Small, 0, RailNT.Width)
            Y: =0
            Width: =Parent.Width - If(MesNotifications.Size = ScreenSize.Small, 0, RailNT.Width)
            Height: =Parent.Height - If(MesNotifications.Size = ScreenSize.Small, 64, 0)
            Fill: =RGBA(249, 250, 251, 1)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - NTHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =104
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutGap: =8
                  PaddingTop: =28
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - NTTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =42
                        Width: =Parent.Width - 56
                        Fill: =RGBA(255, 255, 255, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                      Children:
                        - IconNTBack:
                            Control: ModernIcon
                            Properties:
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Width: =28
                              Height: =28
                              AccessibleLabel: ="Retour"
                              OnSelect: =Back(ScreenTransition.Fade)
                        - TxtNTTitle:
                            Control: ModernText
                            Properties:
                              Text: ="Notifications"
                              Size: =28
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(140, 12, 20, 1)
                              AutoHeight: =true
                              FillPortions: =1
                        - BtnNTToutLu:
                            Control: ModernButton
                            Properties:
                              Text: =If(MesNotifications.Size = ScreenSize.Small, "Tout lu", "Tout marquer comme lu")
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              FillPortions: =0
                              Width: =If(MesNotifications.Size = ScreenSize.Small, 90, 210)
                              Height: =40
                              AccessibleLabel: ="Marquer toutes les notifications comme lues"
                              Visible: |-
                                =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                              OnSelect: |-
                                =IfError(
                                    UpdateIf(
                                        Notifications,
                                        Destinataire.Email = User().Email && IsRead = false,
                                        {IsRead: true, ReadDate: Now()}
                                    ),
                                    Notify("Échec du marquage : " & FirstError.Message, NotificationType.Error),
                                    Notify("Toutes les notifications ont été marquées comme lues.", NotificationType.Success)
                                )
                  - RectNTAccentBar:
                      Control: Rectangle
                      Properties:
                        FillPortions: =0
                        Width: =56
                        Height: =4
                        Fill: =RGBA(140, 12, 20, 1)
            - NTBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutGap: =10
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingBottom: =28
                Children:
                  - TabsRowNT:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =48
                        AlignInContainer: =AlignInContainer.Start
                        Width: =Min(Parent.Width - 56, 800)
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                      Children:
                        - BtnTbNTNonLues:
                            Control: ModernButton
                            Properties:
                              Text: ="Non lues"
                              Icon: ="Alert"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxNotifTab = "nonlues", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxNotifTab = "nonlues", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxNotifTab = "nonlues", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxNotifTab = "nonlues", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxNotifTab: "nonlues"})
                        - BtnTbNTToutes:
                            Control: ModernButton
                            Properties:
                              Text: ="Toutes"
                              Icon: ="Document"
                              Layout: =ButtonLayout.IconBefore
                              FillPortions: =1
                              Height: =48
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              Appearance: =If(ctxNotifTab = "toutes", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxNotifTab = "toutes", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxNotifTab = "toutes", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FontWeight: =If(ctxNotifTab = "toutes", FontWeight.Semibold, FontWeight.Normal)
                              OnSelect: |-
                                =UpdateContext({ctxNotifTab: "toutes"})
                  - GalleryNotifications:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =If(
                              ctxNotifTab = "nonlues",
                              SortByColumns(
                                  Filter(
                                      Notifications,
                                      Destinataire.Email = User().Email && IsRead = false
                                  ),
                                  "Created", SortOrder.Descending
                              ),
                              SortByColumns(
                                  Filter(
                                      Notifications,
                                      Destinataire.Email = User().Email
                                  ),
                                  "Created", SortOrder.Descending
                              )
                          )
                        FillPortions: =0
                        Width: =Parent.Width - 56
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        WrapCount: =1
                        TemplateSize: =124
                        TemplatePadding: =12
                        Fill: =RGBA(0, 0, 0, 0)
                        TemplateFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(varNotifSel, ThisItem);
                          If(
                              Not(varNotifSel.IsRead),
                              Patch(Notifications, varNotifSel, {IsRead: true, ReadDate: Now()})
                          );
                          Set(varDemandeNotif, LookUp(Demandes, ID = Value(varNotifSel.ObjectID)));
                          If(
                              IsBlank(varDemandeNotif),
                              Notify("Demande introuvable — elle a probablement été supprimée.", NotificationType.Warning),
                              Set(varSelectedDemande, varDemandeNotif);
                              Navigate(DetailDemande, ScreenTransition.Fade)
                          )
                      Children:
                        - NTCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =If(ThisItem.IsRead, RGBA(255, 255, 255, 1), RGBA(219, 234, 254, 1))
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              DropShadow: =DropShadow.Semilight
                            Children:
                              - RectNTTypeStripe:
                                  Control: Rectangle
                                  Properties:
                                    FillPortions: =0
                                    Width: =4
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Type_Notification.Value,
                                        "Success", RGBA(6, 95, 70, 1),
                                        "Validation", RGBA(6, 95, 70, 1),
                                        "Refus", RGBA(220, 38, 38, 1),
                                        "Error", RGBA(220, 38, 38, 1),
                                        "Warning", RGBA(234, 88, 12, 1),
                                        "Reminder", RGBA(217, 119, 6, 1),
                                        "Information", RGBA(37, 99, 235, 1),
                                        RGBA(112, 112, 112, 1)
                                      )
                              - NTContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    Fill: =RGBA(0, 0, 0, 0)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =4
                                    PaddingTop: =14
                                    PaddingBottom: =14
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                  Children:
                                    - TxtNTCardTitle:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Title
                                          Size: =15
                                          FontWeight: =If(ThisItem.IsRead, FontWeight.Normal, FontWeight.Bold)
                                          Color: =If(ThisItem.IsRead, RGBA(112, 112, 112, 1), RGBA(17, 24, 39, 1))
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                                    - TxtNTCardMessage:
                                        Control: ModernText
                                        Properties:
                                          Text: =ThisItem.Message
                                          Size: =13
                                          Color: =If(ThisItem.IsRead, RGBA(144, 144, 144, 1), RGBA(112, 112, 112, 1))
                                          AutoHeight: =false
                                          Height: =38
                                          Width: =Parent.Width - 36
                                    - TxtNTCardDate:
                                        Control: ModernText
                                        Properties:
                                          Text: |-
                                            =With(
                                              {_hrs: DateDiff(ThisItem.Created, Now(), TimeUnit.Hours)},
                                              If(
                                                _hrs < 1,
                                                "il y a moins d'une heure",
                                                _hrs < 24,
                                                "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                With(
                                                  {_days: RoundDown(_hrs / 24, 0)},
                                                  "il y a " & _days & If(_days = 1, " jour", " jours")
                                                )
                                              )
                                            )
                                          Size: =12
                                          Color: =RGBA(144, 144, 144, 1)
                                          AutoHeight: =true
                                          Width: =Parent.Width - 36
                        - RectNTCardClick:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              OnSelect: |-
                                =Set(varNotifSel, ThisItem);
                                If(
                                    Not(varNotifSel.IsRead),
                                    Patch(Notifications, varNotifSel, {IsRead: true, ReadDate: Now()})
                                );
                                Set(varDemandeNotif, LookUp(Demandes, ID = Value(varNotifSel.ObjectID)));
                                If(
                                    IsBlank(varDemandeNotif),
                                    Notify("Demande introuvable — elle a probablement été supprimée.", NotificationType.Warning),
                                    Set(varSelectedDemande, varDemandeNotif);
                                    Navigate(DetailDemande, ScreenTransition.Fade)
                                )
                  - TxtNTEmpty:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =If(
                              ctxNotifTab = "nonlues",
                              "Aucune notification non lue.",
                              "Aucune notification."
                          )
                        Size: =14
                        Color: =RGBA(144, 144, 144, 1)
                        Align: =Align.Center
                        AutoHeight: =true
                        Width: =Parent.Width - 56
                        Visible: =GalleryNotifications.AllItemsCount = 0
      - BarNT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =Parent.Height - 64
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.Regular
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            Visible: =MesNotifications.Size = ScreenSize.Small
          Children:
            - BEntNTAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =2
                  PaddingTop: =10
                Children:
                  - BIcoNTAccueil:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                  - BLblNTAccueil:
                      Control: ModernText
                      Properties:
                        Text: ="Accueil"
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =0
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
            - BEntNTMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =2
                  PaddingTop: =10
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - BIcoNTMesDem:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                  - BLblNTMesDem:
                      Control: ModernText
                      Properties:
                        Text: ="Demandes"
                        Size: =10
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =0
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
            - BEntNTNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =2
                  PaddingTop: =10
                  Visible: =UserRole = "Agent"
                Children:
                  - BIcoNTNouvelle:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Add"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                  - BLblNTNouvelle:
                      Control: ModernText
                      Properties:
                        Text: ="Nouvelle"
                        Size: =10
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =0
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
            - BEntNTFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =2
                  PaddingTop: =10
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - BIcoNTFile:
                      Control: ModernIcon
                      Properties:
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        FillPortions: =0
                        Width: =22
                        Height: =22
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                  - BLblNTFile:
                      Control: ModernText
                      Properties:
                        Text: ="À traiter"
                        Size: =10
                        Color: =RGBA(112, 112, 112, 1)
                        AutoHeight: =true
                        FillPortions: =0
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
            - BEntNTAlertes:
