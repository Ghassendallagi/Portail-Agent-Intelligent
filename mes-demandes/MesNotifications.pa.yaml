Screens:
  MesNotifications:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =UpdateContext({ctxNotifTab: "nonlues"})
    Children:
      - RailNT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =20
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            Visible: =MesNotifications.Size <> ScreenSize.Small
            Width: =300
          Children:
            - ImgLogoNT:
                Control: Image
                Properties:
                  Height: =60
                  Image: =Logo
            - RectRailSepNT:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =16
            - NavNTAccueil:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(140, 12, 20, 0.08)
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoNTAccueil:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Home"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Width: =22
                  - LblNTAccueil:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(Accueil, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Accueil"
            - NavNTMesDem:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoNTMesDem:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Document"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Width: =22
                  - LblNTMesDem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(MesDemandes, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Mes demandes"
            - NavNTNouvelle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Agent" || UserRole = "Admin"
                Children:
                  - IcoNTNouvelle:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Width: =22
                  - LblNTNouvelle:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(NouvelleDemande, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Nouvelle demande"
            - NavNTFile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Gestionnaire" || UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoNTFile:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Briefcase"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Width: =22
                  - LblNTFile:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(FileATraiter, ScreenTransition.Fade)
                        Size: =14
                        Text: ="File à traiter"
            - NavNTAlertes:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoNTAlertes:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Clock"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Width: =22
                  - LblNTAlertes:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(AlertesSLA, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Alertes SLA"
            - NavNTStats:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =UserRole = "Superviseur" || UserRole = "Admin"
                Children:
                  - IcoNTStats:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="DataBarVertical"
                        IconColor: =RGBA(112, 112, 112, 1)
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Width: =22
                  - LblNTStats:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        FillPortions: =1
                        OnSelect: =Navigate(EcranStatistiques, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Statistiques"
            - NavNTNotifs:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - IcoNTNotifs:
                      Control: ModernIcon
                      Properties:
                        Height: =22
                        Icon: ="Alert"
                        IconColor: =RGBA(140, 12, 20, 1)
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Width: =22
                  - LblNTNotifs:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(140, 12, 20, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Navigate(MesNotifications, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Notifications"
                  - BdgNTNotifs:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        Content: =Text(CountRows(Filter(Notifications, Destinataire.Email = User().Email && IsRead = false)))
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =20
                        LayoutMinWidth: =30
                        Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                        Width: =30
            - RectRailSpacerNT:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
            - RectRailSeparatorNT:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
            - TxtRailUserNT:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(55, 65, 81, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =User().FullName
            - TxtRailRoleNT:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(112, 112, 112, 1)
                  Size: =12
                  Text: =UserRole
      - NTScreenContainer:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(249, 250, 251, 1)
            Height: =Parent.Height - If(MesNotifications.Size = ScreenSize.Small, 64, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width - If(MesNotifications.Size = ScreenSize.Small, 0, RailNT.Width)
            X: =If(MesNotifications.Size = ScreenSize.Small, 0, RailNT.Width)
          Children:
            - NTHeaderContainer:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =20
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =28
                Children:
                  - NTTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0)
                        FillPortions: =0
                        Height: =42
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        Width: =Parent.Width - 56
                      Children:
                        - IconNTBack:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Retour"
                              Height: =28
                              Icon: ="ArrowLeft"
                              IconColor: =RGBA(140, 12, 20, 1)
                              OnSelect: =Back(ScreenTransition.Fade)
                              Width: =28
                        - TxtNTTitle:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(140, 12, 20, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Size: =28
                              Text: ="Notifications"
                        - BtnNTToutLu:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Marquer toutes les notifications comme lues"
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =RGBA(140, 12, 20, 1)
                              Height: =40
                              OnSelect: |-
                                =IfError(
                                    UpdateIf(
                                        Notifications,
                                        Destinataire.Email = User().Email && IsRead = false,
                                        {IsRead: true, ReadDate: Now()}
                                    ),
                                    Notify("Échec du marquage : " & FirstError.Message, NotificationType.Error),
                                    Notify("Toutes les notifications ont été marquées comme lues.", NotificationType.Success)
                                )
                              Text: =If(MesNotifications.Size = ScreenSize.Small, "Tout lu", "Tout marquer comme lu")
                              Visible: =Not(IsBlank(LookUp(Notifications, Destinataire.Email = User().Email && IsRead = false, ID)))
                              Width: =If(MesNotifications.Size = ScreenSize.Small, 90, 210)
                  - TxtNTCounters:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(112, 112, 112, 1)
                        Size: =13
                        Text: |-
                          =If(
                              ctxNotifTab = "toutes",
                              "Non lues : " & BdgNTNotifs.Content & "   ·   Total : " & GalleryNotifications.AllItemsCount,
                              "Non lues : " & GalleryNotifications.AllItemsCount
                          )
                  - RectNTAccentBar:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(140, 12, 20, 1)
                        Height: =4
                        Width: =56
            - NTBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(249, 250, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                Children:
                  - TabsRowNT:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        Width: =Min(Parent.Width - 56, 800)
                      Children:
                        - BtnTbNTNonLues:
                            Control: ModernButton
                            Properties:
                              Appearance: =If(ctxNotifTab = "nonlues", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxNotifTab = "nonlues", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxNotifTab = "nonlues", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FillPortions: =1
                              FontWeight: =If(ctxNotifTab = "nonlues", FontWeight.Semibold, FontWeight.Normal)
                              Height: =48
                              Icon: ="Alert"
                              OnSelect: |-
                                =UpdateContext({ctxNotifTab: "nonlues"})
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: ="Non lues"
                        - BtnTbNTToutes:
                            Control: ModernButton
                            Properties:
                              Appearance: =If(ctxNotifTab = "toutes", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Transparent)
                              BasePaletteColor: =If(ctxNotifTab = "toutes", RGBA(140, 12, 20, 1), RGBA(112, 112, 112, 1))
                              Color: =If(ctxNotifTab = "toutes", RGBA(255, 255, 255, 1), RGBA(112, 112, 112, 1))
                              FillPortions: =1
                              FontWeight: =If(ctxNotifTab = "toutes", FontWeight.Semibold, FontWeight.Normal)
                              Height: =48
                              Icon: ="Document"
                              OnSelect: |-
                                =UpdateContext({ctxNotifTab: "toutes"})
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: ="Toutes"
                  - GalleryNotifications:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =Self.AllItemsCount * (Self.TemplateHeight + Self.TemplatePadding)
                        Items: |-
                          =If(
                              ctxNotifTab = "nonlues",
                              SortByColumns(
                                  Filter(
                                      Notifications,
                                      Destinataire.Email = User().Email && IsRead = false
                                  ),
                                  "Created", SortOrder.Descending
                              ),
                              SortByColumns(
                                  Filter(
                                      Notifications,
                                      Destinataire.Email = User().Email
                                  ),
                                  "Created", SortOrder.Descending
                              )
                          )
                        TemplatePadding: =12
                        TemplateSize: =124
                        Width: =Parent.Width - 56
                      Children:
                        - NTCardContainer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =If(ThisItem.IsRead, RGBA(255, 255, 255, 1), RGBA(219, 234, 254, 1))
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.TemplateWidth
                            Children:
                              - RectNTTypeStripe:
                                  Control: Rectangle
                                  Properties:
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Type_Notification.Value,
                                        "Success", RGBA(6, 95, 70, 1),
                                        "Validation", RGBA(6, 95, 70, 1),
                                        "Refus", RGBA(220, 38, 38, 1),
                                        "Error", RGBA(220, 38, 38, 1),
                                        "Warning", RGBA(234, 88, 12, 1),
                                        "Reminder", RGBA(217, 119, 6, 1),
                                        "Information", RGBA(37, 99, 235, 1),
                                        RGBA(112, 112, 112, 1)
                                      )
                                    Width: =4
                              - NTIconCol:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    PaddingTop: =16
                                    Width: =48
                                  Children:
                                    - IconNTType:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: |-
                                            =Switch(
                                                ThisItem.Type_Notification.Value,
                                                "Information", "Information",
                                                "Success", "Succès",
                                                "Validation", "Validation",
                                                "Warning", "Attention",
                                                "Reminder", "Rappel",
                                                "Refus", "Rejet",
                                                "Error", "Erreur",
                                                "Info"
                                            )
                                          Height: =26
                                          Icon: |-
                                            =Switch(
                                                ThisItem.Type_Notification.Value,
                                                "Information", "Info",
                                                "Success", "CheckmarkCircle",
                                                "Validation", "CheckmarkCircle",
                                                "Warning", "Warning",
                                                "Reminder", "Clock",
                                                "Refus", "DismissCircle",
                                                "Error", "DismissCircle",
                                                "Info"
                                            )
                                          IconColor: |-
                                            =Switch(
                                                ThisItem.Type_Notification.Value,
                                                "Information", RGBA(37, 99, 235, 1),
                                                "Success", RGBA(6, 95, 70, 1),
                                                "Validation", RGBA(6, 95, 70, 1),
                                                "Warning", RGBA(234, 88, 12, 1),
                                                "Reminder", RGBA(217, 119, 6, 1),
                                                "Refus", RGBA(220, 38, 38, 1),
                                                "Error", RGBA(220, 38, 38, 1),
                                                RGBA(112, 112, 112, 1)
                                            )
                                          Width: =26
                              - NTContent:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    PaddingBottom: =14
                                    PaddingLeft: =2
                                    PaddingRight: =18
                                    PaddingTop: =14
                                  Children:
                                    - NTCardHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =24
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          Width: =Parent.Width - 20
                                        Children:
                                          - DotNTUnread:
                                              Control: Circle
                                              Properties:
                                                Fill: =RGBA(220, 38, 38, 1)
                                                Height: =8
                                                Visible: =Not(ThisItem.IsRead)
                                                Width: =8
                                          - TxtNTCardTitle:
                                              Control: ModernText
                                              Properties:
                                                AutoHeight: =true
                                                Color: =If(ThisItem.IsRead, RGBA(112, 112, 112, 1), RGBA(17, 24, 39, 1))
                                                FillPortions: =1
                                                FontWeight: =If(ThisItem.IsRead, FontWeight.Normal, FontWeight.Bold)
                                                Size: =14
                                                Text: =ThisItem.Title
                                          - BadgeNTType:
                                              Control: Badge
                                              Properties:
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                BasePaletteColor: |-
                                                  =Switch(
                                                      ThisItem.Type_Notification.Value,
                                                      "Information", RGBA(219, 234, 254, 1),
                                                      "Success", RGBA(209, 250, 229, 1),
                                                      "Validation", RGBA(209, 250, 229, 1),
                                                      "Warning", RGBA(254, 235, 200, 1),
                                                      "Reminder", RGBA(254, 235, 200, 1),
                                                      "Refus", RGBA(254, 226, 226, 1),
                                                      "Error", RGBA(254, 226, 226, 1),
                                                      RGBA(229, 231, 235, 1)
                                                  )
                                                Content: |-
                                                  =Switch(
                                                      ThisItem.Type_Notification.Value,
                                                      "Information", "Information",
                                                      "Success", "Succès",
                                                      "Validation", "Validation",
                                                      "Warning", "Attention",
                                                      "Reminder", "Rappel",
                                                      "Refus", "Rejet",
                                                      "Error", "Erreur",
                                                      "Info"
                                                  )
                                                FontColor: |-
                                                  =Switch(
                                                      ThisItem.Type_Notification.Value,
                                                      "Information", RGBA(30, 64, 175, 1),
                                                      "Success", RGBA(6, 95, 70, 1),
                                                      "Validation", RGBA(6, 95, 70, 1),
                                                      "Warning", RGBA(180, 83, 9, 1),
                                                      "Reminder", RGBA(180, 83, 9, 1),
                                                      "Refus", RGBA(153, 27, 27, 1),
                                                      "Error", RGBA(153, 27, 27, 1),
                                                      RGBA(55, 65, 81, 1)
                                                  )
                                                Height: =22
                                                LayoutMinWidth: =96
                                                Width: =96
                                    - TxtNTCardMessage:
                                        Control: ModernText
                                        Properties:
                                          Color: =If(ThisItem.IsRead, RGBA(144, 144, 144, 1), RGBA(112, 112, 112, 1))
                                          Height: =38
                                          Size: =13
                                          Text: =ThisItem.Message
                                          Width: =Parent.Width - 20
                                    - NTMetaRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =18
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =12
                                          Width: =Parent.Width - 20
                                        Children:
                                          - TxtNTCardRef:
                                              Control: ModernText
                                              Properties:
                                                AutoHeight: =true
                                                Color: =RGBA(140, 12, 20, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Size: =12
                                                Text: |-
                                                  =If(IsBlank(ThisItem.ObjectID), "", "Demande #" & ThisItem.ObjectID)
                                                Visible: =Not(IsBlank(ThisItem.ObjectID))
                                          - TxtNTCardDate:
                                              Control: ModernText
                                              Properties:
                                                AutoHeight: =true
                                                Color: =RGBA(144, 144, 144, 1)
                                                Size: =12
                                                Text: |-
                                                  =With(
                                                      {_hrs: DateDiff(ThisItem.Created, Now(), TimeUnit.Hours)},
                                                      If(
                                                          _hrs < 1,
                                                          With(
                                                              {_mins: DateDiff(ThisItem.Created, Now(), TimeUnit.Minutes)},
                                                              If(_mins < 2, "à l'instant", "il y a " & _mins & " minutes")
                                                          ),
                                                          _hrs < 24,
                                                          "il y a " & _hrs & If(_hrs = 1, " heure", " heures"),
                                                          _hrs < 336,
                                                          With(
                                                              {_days: RoundDown(_hrs / 24, 0)},
                                                              "il y a " & _days & If(_days = 1, " jour", " jours")
                                                          ),
                                                          With(
                                                              {_wks: RoundDown(_hrs / 168, 0)},
                                                              "il y a " & _wks & If(_wks = 1, " semaine", " semaines")
                                                          )
                                                      )
                                                  )
                        - BtnNTCardClick:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.TemplateHeight
                              HoverBorderColor: =RGBA(140, 12, 20, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              OnSelect: |-
                                =Set(varNotifSel, ThisItem);
                                If(
                                    Not(varNotifSel.IsRead),
                                    Patch(Notifications, varNotifSel, {IsRead: true, ReadDate: Now()})
                                );
                                Set(varDemandeNotif, LookUp(Demandes, ID = Value(varNotifSel.ObjectID)));
                                If(
                                    IsBlank(varDemandeNotif),
                                    Notify("Demande introuvable — elle a probablement été supprimée.", NotificationType.Warning),
                                    Set(varSelectedDemande, varDemandeNotif);
                                    Navigate(DetailDemande, ScreenTransition.Fade)
                                )
                              PressedBorderColor: =RGBA(140, 12, 20, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
